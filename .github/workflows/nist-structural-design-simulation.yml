name: NIST structural design simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "configs/research/nist_ambench_stage1_*.json"
      - "src/materials_data_analyzer/research_loop/design_simulation.py"
      - "src/materials_data_analyzer/research_loop/nist_*.py"
      - "src/materials_data_analyzer/research_loop/authorized_execution.py"
      - "src/materials_data_analyzer/research_loop/planning_adapter.py"
      - "src/materials_data_analyzer/research_loop/planning_state.py"
      - "scripts/run_nist_structural_design_action.py"
      - "tests/test_structural_design_simulation.py"
      - "tests/test_nist_audited_structural_simulation_action.py"
      - "docs/STRUCTURAL_DESIGN_SIMULATION.md"
      - "docs/NIST_AUDITED_STRUCTURAL_SIMULATION_ACTION.md"
      - ".github/workflows/nist-structural-design-simulation.yml"
  push:
    branches: [main]
    paths:
      - "configs/research/nist_ambench_stage1_*.json"
      - "src/materials_data_analyzer/research_loop/design_simulation.py"
      - "src/materials_data_analyzer/research_loop/nist_*.py"
      - "src/materials_data_analyzer/research_loop/authorized_execution.py"
      - "src/materials_data_analyzer/research_loop/planning_adapter.py"
      - "src/materials_data_analyzer/research_loop/planning_state.py"
      - "scripts/run_nist_structural_design_action.py"
      - "tests/test_structural_design_simulation.py"
      - "tests/test_nist_audited_structural_simulation_action.py"
      - "docs/STRUCTURAL_DESIGN_SIMULATION.md"
      - "docs/NIST_AUDITED_STRUCTURAL_SIMULATION_ACTION.md"
      - ".github/workflows/nist-structural-design-simulation.yml"

permissions:
  contents: read

concurrency:
  group: nist-structural-design-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run focused structural and typed-chain regressions
        run: |
          mkdir -p outputs
          set -o pipefail
          pytest -vv \
            tests/test_structural_design_simulation.py \
            tests/test_nist_audited_structural_simulation_action.py \
            2>&1 | tee outputs/nist_focused_pytest.txt
      - name: Upload focused regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nist-focused-regression-diagnostics
          path: outputs/nist_focused_pytest.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Run tracked response-free design simulation
        run: |
          mkdir -p outputs
          python -m materials_data_analyzer.research_design_simulation_cli \
            --spec configs/research/nist_ambench_stage1_structural_design_simulation.v1.json \
            --output outputs/nist_stage1_structural_design_simulation.json
      - name: Verify no-response boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("outputs/nist_stage1_structural_design_simulation.json").read_text()
          )
          before = result["before"]["grid"]
          after = result["after_proposal"]["grid"]
          changes = {
              item["model"]: item for item in result["comparison"]["model_changes"]
          }
          assert before["total_replicates"] == 10
          assert after["total_replicates"] == 19
          assert result["comparison"]["new_unique_cell_count"] == 3
          assert result["comparison"]["new_replicate_count"] == 9
          interaction = changes["interaction"]
          assert interaction["rank_before"] == 3
          assert interaction["rank_after"] == 4
          assert interaction["full_column_rank_before"] is False
          assert interaction["full_column_rank_after"] is True
          assert interaction["residual_df_before"] == 7
          assert interaction["residual_df_after"] == 15
          assert changes["quadratic"]["full_column_rank_after"] is False
          assert result["expected_information_gain"]["status"] == "not_quantified"
          assert result["expected_information_gain"]["value"] is None
          boundary = result["scientific_boundary"]
          for key in (
              "response_values_used",
              "synthetic_response_generated",
              "coefficients_estimated",
              "effect_sizes_estimated",
              "predictions_generated",
              "causal_effects_inferred",
              "optimization_performed",
              "engineering_decision_made",
          ):
              assert boundary[key] is False
          PY
      - name: Upload structural simulation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nist-stage1-structural-design-simulation
          path: outputs/nist_stage1_structural_design_simulation.json
          if-no-files-found: warn
          retention-days: 30
