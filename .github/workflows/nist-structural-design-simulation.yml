name: NIST structural design simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "configs/research/nist_ambench_stage1_structural_design_simulation.v1.json"
      - "src/materials_data_analyzer/research_loop/design_simulation.py"
      - "src/materials_data_analyzer/research_design_simulation_cli.py"
      - "tests/test_structural_design_simulation.py"
      - "docs/STRUCTURAL_DESIGN_SIMULATION.md"
      - ".github/workflows/nist-structural-design-simulation.yml"
  push:
    branches: [main]
    paths:
      - "configs/research/nist_ambench_stage1_structural_design_simulation.v1.json"
      - "src/materials_data_analyzer/research_loop/design_simulation.py"
      - "src/materials_data_analyzer/research_design_simulation_cli.py"
      - "tests/test_structural_design_simulation.py"
      - "docs/STRUCTURAL_DESIGN_SIMULATION.md"
      - ".github/workflows/nist-structural-design-simulation.yml"

permissions:
  contents: read

concurrency:
  group: nist-structural-design-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run focused regressions
        run: pytest -q tests/test_structural_design_simulation.py
      - name: Run tracked response-free design simulation
        run: |
          python -m materials_data_analyzer.research_design_simulation_cli \
            --spec configs/research/nist_ambench_stage1_structural_design_simulation.v1.json \
            --output outputs/nist_stage1_structural_design_simulation.json
      - name: Verify structural result and no-response boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("outputs/nist_stage1_structural_design_simulation.json").read_text()
          )
          before = result["before"]["grid"]
          after = result["after_proposal"]["grid"]
          changes = {
              item["model"]: item for item in result["comparison"]["model_changes"]
          }

          assert before["total_replicates"] == 10
          assert before["unique_cell_count"] == 3
          assert before["observed_level_grid_complete"] is False
          assert after["total_replicates"] == 19
          assert after["unique_cell_count"] == 6
          assert after["observed_level_grid_complete"] is True
          assert result["comparison"]["new_unique_cell_count"] == 3
          assert result["comparison"]["new_replicate_count"] == 9

          interaction = changes["interaction"]
          assert interaction["rank_before"] == 3
          assert interaction["rank_after"] == 4
          assert interaction["full_column_rank_before"] is False
          assert interaction["full_column_rank_after"] is True
          assert interaction["residual_df_before"] == 7
          assert interaction["residual_df_after"] == 15

          quadratic = changes["quadratic"]
          assert quadratic["rank_after"] == 5
          assert quadratic["full_column_rank_after"] is False

          assert result["expected_information_gain"]["status"] == "not_quantified"
          assert result["expected_information_gain"]["value"] is None
          boundary = result["scientific_boundary"]
          assert boundary["response_values_used"] is False
          assert boundary["synthetic_response_generated"] is False
          assert boundary["coefficients_estimated"] is False
          assert boundary["predictions_generated"] is False
          assert boundary["causal_effects_inferred"] is False
          assert boundary["optimization_performed"] is False
          assert boundary["engineering_decision_made"] is False
          PY
      - name: Upload structural simulation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nist-stage1-structural-design-simulation
          path: outputs/nist_stage1_structural_design_simulation.json
          if-no-files-found: warn
          retention-days: 30
