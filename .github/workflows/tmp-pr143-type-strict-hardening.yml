name: Temporary PR143 type-strict hardening gate

on:
  push:
    branches:
      - agent/mission-source-trust-bridge-clean-140

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mission-source-trust-bridge-clean-140
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply bridge hardening
        run: |
          python scripts/tmp_pr143_type_strict_bridge_hardening.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run focused trust-boundary gate
        run: |
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/mission_source_trust_bridge.py \
            tests/test_mission_source_trust_bridge.py
          python -m pytest -q \
            tests/test_mission_source_trust_bridge.py \
            tests/test_acquisition_source_trust_policy.py \
            tests/test_acquisition_record_binding.py \
            tests/test_research_program_source_trust_policy_pins.py \
            tests/test_research_program_exact_file_binding_toctou.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/mission_source_trust_bridge.py \
            tests/test_mission_source_trust_bridge.py
      - name: Commit verified source and tests
        run: |
          git add \
            src/materials_data_analyzer/research_loop/mission_source_trust_bridge.py \
            tests/test_mission_source_trust_bridge.py
          if git diff --cached --quiet; then
            echo "No verified source/test changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden mission source-trust bridge type identity"
          git push origin HEAD:agent/mission-source-trust-bridge-clean-140
