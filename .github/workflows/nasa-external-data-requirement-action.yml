name: NASA external data requirement action

on:
  workflow_dispatch:
  push:
    paths:
      - "configs/research/nasa_external_data_requirement_action_registry.v1.json"
      - "docs/NASA_EXTERNAL_DATA_REQUIREMENT_ACTION.md"
      - "scripts/run_nasa_external_data_requirement_action.py"
      - "src/materials_data_analyzer/research_loop/authorized_execution.py"
      - "src/materials_data_analyzer/research_loop/nasa_action_policy.py"
      - "src/materials_data_analyzer/research_loop/nasa_external_data_requirement_action.py"
      - "tests/test_nasa_external_data_requirement_action.py"
      - "tests/test_nasa_external_data_requirement_script.py"
      - "tests/test_nasa_external_data_requirement_priority.py"
      - "tests/test_nasa_external_data_requirement_scientific_contract.py"
      - "tests/test_research_authorized_execution_surface_contract.py"
      - "tests/test_nasa_next_action_policy.py"
      - "tests/test_nasa_protocol_policy.py"
      - ".github/workflows/nasa-external-data-requirement-action.yml"
  pull_request:
    paths:
      - "configs/research/nasa_external_data_requirement_action_registry.v1.json"
      - "docs/NASA_EXTERNAL_DATA_REQUIREMENT_ACTION.md"
      - "scripts/run_nasa_external_data_requirement_action.py"
      - "src/materials_data_analyzer/research_loop/authorized_execution.py"
      - "src/materials_data_analyzer/research_loop/nasa_action_policy.py"
      - "src/materials_data_analyzer/research_loop/nasa_external_data_requirement_action.py"
      - "tests/test_nasa_external_data_requirement_action.py"
      - "tests/test_nasa_external_data_requirement_script.py"
      - "tests/test_nasa_external_data_requirement_priority.py"
      - "tests/test_nasa_external_data_requirement_scientific_contract.py"
      - "tests/test_research_authorized_execution_surface_contract.py"
      - "tests/test_nasa_next_action_policy.py"
      - "tests/test_nasa_protocol_policy.py"
      - ".github/workflows/nasa-external-data-requirement-action.yml"

permissions:
  contents: read

concurrency:
  group: nasa-external-data-requirement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-external-data-requirement:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run focused action, planner, registry, and scientific-contract tests
        run: |
          python -m pytest -q \
            tests/test_nasa_external_data_requirement_action.py \
            tests/test_nasa_external_data_requirement_script.py \
            tests/test_nasa_external_data_requirement_priority.py \
            tests/test_nasa_external_data_requirement_scientific_contract.py \
            tests/test_research_authorized_execution_surface_contract.py \
            tests/test_nasa_next_action_policy.py \
            tests/test_nasa_protocol_policy.py

      - name: Verify executable registry binding
        run: |
          python - <<'PY'
          from pathlib import Path

          from materials_data_analyzer.research_loop.action_registry import (
              describe_action,
              load_action_registry,
          )

          root = Path.cwd()
          registry = load_action_registry(
              root
              / "configs/research/"
              "nasa_external_data_requirement_action_registry.v1.json",
              repository_root=root,
          )
          contract = describe_action(
              registry,
              "external_data_requirement_generation",
          )
          assert contract["availability"] == "available"
          assert contract["binding"] == {
              "kind": "source_script",
              "name": None,
              "path": "scripts/run_nasa_external_data_requirement_action.py",
              "platform": "cross_platform",
          }
          assert contract["cost_units"] == 2
          assert "missing_protocol_metadata" in contract["target_blockers"]
          assert (
              "evidence_route_is_metadata_recovery_or_external_calibration"
              in contract["verifier_checks"]
          )
          assert (
              "source_cohort_and_temperature_confounding_is_guarded"
              in contract["verifier_checks"]
          )
          assert (
              "external_evidence_required_stop_rule_authorized"
              in contract["preconditions"]
          )
          print(registry["registry_sha256"])
          PY
