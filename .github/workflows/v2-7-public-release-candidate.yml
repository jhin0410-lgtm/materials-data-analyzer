name: v2.7 public release promotion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PUBLIC_RELEASE_VERSION"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - "configs/v2_7_public_release_candidate.json"
      - "scripts/audit_v2_7_public_release_candidate.py"
      - "tests/test_v2_7_public_release_candidate.py"
      - "tests/test_public_release_metadata.py"
      - "docs/V2_7_PUBLIC_RELEASE_CANDIDATE.md"
      - "docs/PLATFORM_V2_5_ROADMAP.md"
      - "docs/PLATFORM_V2_6_ROADMAP.md"
      - "docs/PUBLIC_RELEASE_STATUS.md"
      - "docs/releases/V2_7_0.md"
      - "docs/BATTERY_V2_6_EXTERNAL_EVIDENCE_LINE_CLOSEOUT.md"
      - "data/processed/battery_v2_6_14_external_evidence_line_closeout_summary.json"
      - "src/platform_core/version.py"
      - ".github/workflows/v2-7-public-release-candidate.yml"

permissions:
  contents: read

concurrency:
  group: v2-7-release-promotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release-boundary ancestry and distance
        run: |
          CORE=50e3ee1201ef791b250558a30c373848d615f815
          FEATURE_SCOPE=ed5eac38584a174edbb9216aca10fc8232cdb504
          RELEASE_TARGET=2d003aecede89aacc25cdb246bf9cc6adec19bf9
          git merge-base --is-ancestor "$CORE" "$FEATURE_SCOPE"
          git merge-base --is-ancestor "$FEATURE_SCOPE" "$RELEASE_TARGET"
          git merge-base --is-ancestor "$RELEASE_TARGET" HEAD
          test "$(git rev-list --count "$CORE..$FEATURE_SCOPE")" = "38"
          test "$(git rev-list --count "$CORE..$RELEASE_TARGET")" = "41"

      - name: Verify superseded v2.6 candidate is absent
        run: |
          test ! -e configs/v2_6_public_release_candidate.json
          test ! -e scripts/audit_v2_6_public_release_candidate.py
          test ! -e docs/V2_6_PUBLIC_RELEASE_CANDIDATE.md
          test ! -e tests/test_v2_6_public_release_candidate.py
          test ! -e .github/workflows/v2-6-public-release-candidate.yml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build release-promotion closeout
        run: |
          python scripts/audit_v2_7_public_release_candidate.py \
            --repo-root . \
            --output outputs/v2_7_public_release_candidate

      - name: Validate tracked v2.6 closeout
        run: |
          python -m src.platform_core.battery_v2_6_external_evidence_line_closeout \
            --json validate \
            data/processed/battery_v2_6_14_external_evidence_line_closeout_summary.json

      - name: Run representative NIST workflow
        run: |
          python scripts/run_representative_process_characterization_workflow.py \
            --output outputs/v2_7_representative_process_characterization

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_v2_7_public_release_candidate.py \
            tests/test_public_release_metadata.py \
            tests/test_battery_v2_6_external_evidence_line_closeout.py \
            tests/test_battery_v2_6_external_evidence_line_closeout_tracked.py \
            tests/test_representative_process_characterization_workflow.py

      - name: Verify promoted decision and checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/v2_7_public_release_candidate")
          summary = json.loads(
              (root / "v2_7_public_release_candidate.json").read_text(
                  encoding="utf-8"
              )
          )
          manifest = json.loads(
              (root / "v2_7_public_release_candidate_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          representative = json.loads(
              Path(
                  "outputs/v2_7_representative_process_characterization/"
                  "representative_workflow_summary.json"
              ).read_text(encoding="utf-8")
          )

          assert summary["decision"] == (
              "v2_7_0_metadata_promoted_pending_external_release_action"
          )
          assert summary["candidate_version"] == "2.7.0"
          assert summary["superseded_candidate_version"] == "2.6.0"
          assert summary["release_date"] == "2026-07-28"
          assert summary["post_v2_6_feature_scope_commit_count_at_audit"] == 38
          assert summary["post_v2_6_commit_count_at_audit"] == 41
          assert summary["audited_main_commit"] == (
              "2d003aecede89aacc25cdb246bf9cc6adec19bf9"
          )
          assert summary[
              "separate_v2_5_or_v2_6_public_release_authorized"
          ] is False
          assert summary["software_validation"]["status"] == "supported"
          assert summary["software_validation"]["v2_6_stage_count"] == 13
          assert all(summary["software_validation"]["checks"].values())
          assert summary["scientific_closeout"]["status"] == "inconclusive"
          assert summary["scientific_closeout"]["ridge_generalization"] == (
              "unsupported"
          )
          assert summary["scientific_closeout"][
              "post_v2_6_process_characterization_status"
          ] == "diagnostic"
          assert summary["public_metadata_promotion_performed"] is True
          assert summary["tag_or_release_created"] is False

          assert representative["evidence_level"] == "Diagnostic"
          assert representative["components"]["process_design_audit"][
              "readiness"
          ] == "not_ready_for_predictive_or_causal_modeling"
          assert representative["software_validation"]["response_model_fitted"] is False
          assert representative["software_validation"]["optimization_performed"] is False

          for name, filename in manifest["outputs"].items():
              path = root / filename
              assert path.is_file()
              assert manifest["output_sha256"][name] == hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()
          PY

      - name: Upload release-promotion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-7-public-release-promotion
          path: |
            outputs/v2_7_public_release_candidate
            outputs/v2_7_representative_process_characterization
          if-no-files-found: error
          retention-days: 14
