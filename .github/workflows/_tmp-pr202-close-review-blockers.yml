name: Temporary PR202 review-blocker gate

on:
  push:
    branches:
      - feature/bounded-recursive-research-cycle
    paths:
      - scripts/_tmp_pr202_close_review_blockers.py
      - .github/workflows/_tmp-pr202-close-review-blockers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/bounded-recursive-research-cycle
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply review-blocker patch
        run: |
          python scripts/_tmp_pr202_close_review_blockers.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run focused recursive-cycle gate
        run: |
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_controller.py \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_evidence.py \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_rediagnosis.py \
            tests/test_recursive_research_cycle_controller.py \
            tests/test_recursive_research_cycle_evidence.py \
            tests/test_recursive_research_cycle_rediagnosis.py \
            tests/test_recursive_research_cycle_integration.py
          python -m pytest -q \
            tests/test_recursive_research_cycle_controller.py \
            tests/test_recursive_research_cycle_evidence.py \
            tests/test_recursive_research_cycle_rediagnosis.py \
            tests/test_recursive_research_cycle_integration.py \
            tests/test_validated_recursive_cycle_planning.py \
            tests/test_autonomous_inquiry_plan_verifier.py \
            tests/test_authenticated_transition_consumer.py \
            tests/test_hypothesis_portfolio.py \
            tests/test_discrepancy_planning_handoff_policy.py \
            tests/test_model_evidence_discrepancy_physics_policy.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_controller.py \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_evidence.py \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_rediagnosis.py \
            tests/test_recursive_research_cycle_controller.py \
            tests/test_recursive_research_cycle_evidence.py \
            tests/test_recursive_research_cycle_rediagnosis.py \
            tests/test_recursive_research_cycle_integration.py
      - name: Commit verified source and tests
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_controller.py \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_evidence.py \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_rediagnosis.py \
            tests/test_recursive_research_cycle_controller.py \
            tests/test_recursive_research_cycle_evidence.py \
            tests/test_recursive_research_cycle_rediagnosis.py \
            tests/test_recursive_research_cycle_integration.py
          if git diff --cached --quiet; then
            echo 'No source/test changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Close recursive cycle review blockers'
          git push origin HEAD:feature/bounded-recursive-research-cycle
