permissions:
  contents: read

jobs:
  literal-one-command-live-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository development environment
        run: python -m pip install -e ".[dev]"
      - name: Run autonomous production adversarial tests
        run: >-
          python -m pytest -q
          tests/test_autonomous_production_driver.py
          tests/test_autonomous_production_transport_recovery.py
          tests/test_autonomous_production_transport_provenance_hardening.py
          tests/test_autonomous_production_authority_binding_hardening.py
          tests/test_autonomous_production_source_replay_hardening.py
          tests/test_autonomous_production_exact_head_p2_closure.py
          tests/test_autonomous_production_exact_head_p2_round2.py
          tests/test_autonomous_production_exact_head_p2_round3.py
          tests/test_autonomous_production_exact_head_p2_round4.py
          tests/test_research_program_cli_transport_recovery_wiring.py
          tests/test_public_data_acquisition_transport_errors.py
          tests/test_nist_mds2_2923_transport_errors.py
          tests/test_capability_expansion.py
          tests/test_capability_registry.py
          tests/test_capability_resolver_verifier.py
          tests/test_capability_trusted_replay.py
          tests/test_mds2_2923_reference_chain.py
          tests/test_nist_ammt_calibration_source_discovery.py
          tests/test_nist_ammt_calibration_candidate_acquisition.py
          tests/test_in625_physical_comparability_assessment.py
          tests/test_nist_mds2_2923_production_extension.py
          tests/test_nist_mds2_2923_scientific_intake.py
          tests/test_nist_mds2_2923_self_hash_contract.py
          tests/test_in625_geometry_condition_multisource_extension.py
      - name: Run literal public autonomous command through mds2 reference-chain frontier
        run: mda-research-program run-autonomous
      - name: Authenticate autonomous manifest and cycle hashes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/autonomous-in625-production")
          manifest = json.loads(
              (root / "autonomous-production-manifest.json").read_text(encoding="utf-8")
          )

          def canonical_sha(value):
              return hashlib.sha256(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode("utf-8")
              ).hexdigest()

          unsigned_manifest = dict(manifest)
          manifest_sha = unsigned_manifest.pop("manifest_sha256")
          assert manifest_sha == canonical_sha(unsigned_manifest)

          cycles = manifest.get("cycles")
          assert isinstance(cycles, list) and cycles
          for index, cycle in enumerate(cycles, start=1):
              assert isinstance(cycle, dict), f"cycle {index} must be an object"
              unsigned_cycle = dict(cycle)
              cycle_sha = unsigned_cycle.pop("cycle_sha256")
              assert cycle_sha == canonical_sha(unsigned_cycle), f"cycle {index} self-hash mismatch"
              assert cycle.get("cycle_index") == index, f"cycle {index} index drifted"
              if index > 1:
                  assert (
                      cycle.get("predecessor_cycle_sha256")
                      == cycles[index - 2]["cycle_sha256"]
                  ), f"cycle {index} predecessor binding drifted"
      - name: Verify live autonomous production result
        run: >-
          python -m materials_data_analyzer.research_loop.autonomous_production_live_verifier
          outputs/autonomous-in625-production
      - name: Upload bounded autonomous provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-production-live-replay
          path: |
            outputs/autonomous-in625-production/autonomous-production-manifest.json
            outputs/autonomous-in625-production/bounded-stop.json
            outputs/autonomous-in625-production/network-acquisition-receipt.json
            outputs/autonomous-in625-production/archive-manifest.json
            outputs/autonomous-in625-production/reviewed-tensile/reviewed_tensile_manifest.v2.json
            outputs/autonomous-in625-production/reviewed-tensile/reviewed_tensile_rows.v2.jsonl
            outputs/autonomous-in625-production/selected-source-files/Dataset/Mechanical testing/Tensile tests/Tensile tests.xlsx
            outputs/autonomous-in625-production/selected-source-files/Dataset/Mechanical testing/Tensile tests/README-Tensile tests.txt
            outputs/autonomous-in625-production/tensile-quality-verification.json
            outputs/autonomous-in625-production/quality-aware-rediagnosis.json
            outputs/autonomous-in625-production/physical-comparability-assessment.json
            outputs/autonomous-in625-production/nist-network-policy-qualification.json
            outputs/autonomous-in625-production/nist-network-authorization.json
            outputs/autonomous-in625-production/nist-network-acquisition-receipt.json
            outputs/autonomous-in625-production/nist-mds2-2923/**
            outputs/autonomous-in625-production/nist-transport-unavailability.json
            outputs/autonomous-in625-production/nist-scientific-intake.json
            outputs/autonomous-in625-production/nist-post-acquisition-rediagnosis.json
            outputs/autonomous-in625-production/multisource-policy-qualification.json
            outputs/autonomous-in625-production/multisource-source-acquisition.json
            outputs/autonomous-in625-production/geometry-condition-mapping-assessment.json
            outputs/autonomous-in625-production/capability-*.json
            outputs/autonomous-in625-production/calibration-protocol-bridge-capability-result.json
            outputs/autonomous-in625-production/nist-ammt-source-discovery-policy-qualification.json
            outputs/autonomous-in625-production/calibration-record-source-discovery.json
            outputs/autonomous-in625-production/nist-ammt-candidate-acquisition-policy-qualification.json
            outputs/autonomous-in625-production/nist-ammt-derived-candidate-authorization.json
            outputs/autonomous-in625-production/nist-ammt-calibration-candidate-acquisition.json
            outputs/autonomous-in625-production/nist-ammt-calibration-candidate-bridge-assessment.json
            outputs/autonomous-in625-production/nist-mds2-2923-reference-chain-policy-qualification.json
            outputs/autonomous-in625-production/nist-mds2-2923-reference-chain-evidence.json
            outputs/autonomous-in625-production/mds2-2923-experiment-identity-reference-chain.json
          if-no-files-found: warn
          retention-days: 14