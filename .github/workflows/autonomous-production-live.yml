name: Autonomous production live replay

on:
  push:
    branches:
      - main
      - feature/provenance-derived-calibration-candidate-acquisition-224
    paths:
      - ".github/workflows/autonomous-production-live.yml"
      - "configs/research/autonomous_in625_production_mission.v1.json"
      - "configs/research/in625_geometry_condition_multisource_acquisition_policy.v1.json"
      - "configs/research/in625_geometry_condition_source_reconnaissance.v1.json"
      - "configs/research/nist_ammt_publication_index_source_discovery_policy.v1.json"
      - "configs/research/nist_ammt_calibration_candidate_derived_acquisition_policy.v1.json"
      - "configs/research/in625_external_evidence_request_delegation_policy.v1.json"
      - "configs/research/in625_zenodo_network_acquisition_policy.v1.json"
      - "configs/research/nist_mds2_2923_network_acquisition_policy.v1.json"
      - "configs/research/in625_zenodo_20503603_verified_source.v1.json"
      - "configs/research/in625_external_evidence_action_registry.v1.json"
      - "configs/research/in625_tensile_reviewed_intake.v1.json"
      - "configs/research/in625_tensile_observed_quality.v1.json"
      - "configs/research/in625_external_physical_source_frontier.v1.json"
      - "data/case_studies/nist_ambench_2018_02/**"
      - "src/materials_data_analyzer/research_program_cli.py"
      - "src/materials_data_analyzer/research_loop/autonomous_production_*.py"
      - "src/materials_data_analyzer/research_loop/capability_*.py"
      - "src/materials_data_analyzer/research_loop/calibration_protocol_bridge_capability.py"
      - "src/materials_data_analyzer/research_loop/nist_ammt_*.py"
      - "src/materials_data_analyzer/research_loop/in625_geometry_condition_*.py"
      - "src/materials_data_analyzer/research_loop/in625_network_policy.py"
      - "src/materials_data_analyzer/research_loop/in625_physical_comparability_assessment.py"
      - "src/materials_data_analyzer/research_loop/nist_mds2_2923_*.py"
      - "tests/test_autonomous_production_driver.py"
      - "tests/test_capability_*.py"
      - "tests/test_nist_ammt_calibration_*.py"
      - "tests/test_in625_geometry_condition_multisource_extension.py"
      - "tests/test_in625_physical_comparability_assessment.py"
      - "tests/test_nist_mds2_2923_production_extension.py"
      - "tests/test_nist_mds2_2923_scientific_intake.py"
  pull_request:
    paths:
      - ".github/workflows/autonomous-production-live.yml"
      - "configs/research/autonomous_in625_production_mission.v1.json"
      - "configs/research/in625_geometry_condition_multisource_acquisition_policy.v1.json"
      - "configs/research/in625_geometry_condition_source_reconnaissance.v1.json"
      - "configs/research/nist_ammt_publication_index_source_discovery_policy.v1.json"
      - "configs/research/nist_ammt_calibration_candidate_derived_acquisition_policy.v1.json"
      - "configs/research/in625_external_evidence_request_delegation_policy.v1.json"
      - "configs/research/in625_zenodo_network_acquisition_policy.v1.json"
      - "configs/research/nist_mds2_2923_network_acquisition_policy.v1.json"
      - "configs/research/in625_zenodo_20503603_verified_source.v1.json"
      - "configs/research/in625_external_evidence_action_registry.v1.json"
      - "configs/research/in625_tensile_reviewed_intake.v1.json"
      - "configs/research/in625_tensile_observed_quality.v1.json"
      - "configs/research/in625_external_physical_source_frontier.v1.json"
      - "data/case_studies/nist_ambench_2018_02/**"
      - "src/materials_data_analyzer/research_program_cli.py"
      - "src/materials_data_analyzer/research_loop/autonomous_production_*.py"
      - "src/materials_data_analyzer/research_loop/capability_*.py"
      - "src/materials_data_analyzer/research_loop/calibration_protocol_bridge_capability.py"
      - "src/materials_data_analyzer/research_loop/nist_ammt_*.py"
      - "src/materials_data_analyzer/research_loop/in625_geometry_condition_*.py"
      - "src/materials_data_analyzer/research_loop/in625_network_policy.py"
      - "src/materials_data_analyzer/research_loop/in625_physical_comparability_assessment.py"
      - "src/materials_data_analyzer/research_loop/nist_mds2_2923_*.py"
      - "tests/test_autonomous_production_driver.py"
      - "tests/test_capability_*.py"
      - "tests/test_nist_ammt_calibration_*.py"
      - "tests/test_in625_geometry_condition_multisource_extension.py"
      - "tests/test_in625_physical_comparability_assessment.py"
      - "tests/test_nist_mds2_2923_production_extension.py"
      - "tests/test_nist_mds2_2923_scientific_intake.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-one-command-live-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository development environment
        run: python -m pip install -e ".[dev]"
      - name: Run autonomous production adversarial tests
        run: >-
          python -m pytest -q
          tests/test_autonomous_production_driver.py
          tests/test_capability_expansion.py
          tests/test_capability_registry.py
          tests/test_capability_resolver_verifier.py
          tests/test_nist_ammt_calibration_source_discovery.py
          tests/test_nist_ammt_calibration_candidate_acquisition.py
          tests/test_in625_physical_comparability_assessment.py
          tests/test_nist_mds2_2923_production_extension.py
          tests/test_nist_mds2_2923_scientific_intake.py
          tests/test_in625_geometry_condition_multisource_extension.py
      - name: Run literal public autonomous command through derived NIST calibration candidate acquisition
        run: mda-research-program run-autonomous
      - name: Verify live autonomous production result
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("outputs/autonomous-in625-production")
          load = lambda name: json.loads((root / name).read_text(encoding="utf-8"))
          manifest = load("autonomous-production-manifest.json")
          stop = load("bounded-stop.json")
          nist = load("nist-scientific-intake.json")
          sources = load("multisource-source-acquisition.json")
          mapping = load("geometry-condition-mapping-assessment.json")
          bridge = load("calibration-protocol-bridge-capability-result.json")
          discovery = load("calibration-record-source-discovery.json")
          gap3 = load("capability-gap-3.json")
          candidate3 = load("capability-candidate-3.json")
          verification3 = load("capability-verification-3.json")
          registry3 = load("capability-registry-promoted-3.json")
          policy3 = load("nist-ammt-candidate-acquisition-policy-qualification.json")
          authorization3 = load("nist-ammt-derived-candidate-authorization.json")
          acquisition3 = load("nist-ammt-calibration-candidate-acquisition.json")
          assessment3 = load("nist-ammt-calibration-candidate-bridge-assessment.json")
          gap4 = load("capability-gap-4.json")
          resolution4 = load("capability-resolution-4.json")

          assert manifest["schema_version"] == "1.7"
          assert manifest["policy_version"] == "1.7"
          assert manifest["measurement_row_count"] == 200289
          assert manifest["complete_numeric_measurement_row_count"] == 200288
          assert manifest["incomplete_numeric_measurement_row_count"] == 1
          assert manifest["caller_authored_request_queue_used"] is False
          assert manifest["machine_authored_typed_request_used"] is True
          assert manifest["unrestricted_network_search_performed"] is False
          assert manifest["arbitrary_command_execution_performed"] is False
          assert manifest["missing_value_imputation_performed"] is False
          assert manifest["row_exclusion_performed"] is False

          assert nist["in625_inventory"]["measurement_row_count"] == 178
          assert nist["in625_inventory"]["physical_track_count"] == 106
          assert nist["in625_inventory"]["machine_measurement_counts"] == {"AMMT": 34, "EOS M270": 144}
          assert nist["measurement_semantics"]["calibration_conversion_performed"] is False
          assert nist["issue_76"]["exact_target_cells_satisfied"] == 0
          assert sources["source_count"] == 8
          assert sources["network_requests_performed"] == 8
          assert sources["all_claim_anchors_matched"] is True
          assert sources["paper_claims_promoted_to_row_level_authority"] is False
          assert mapping["gate_decision"]["eos_rows_excluded_from_direct_mapping"] == 144
          assert mapping["gate_decision"]["directly_comparable_mds2_rows"] == 0
          assert mapping["gate_decision"]["direct_numerical_validation_authorized"] is False
          assert bridge["bridge_established"] is False
          assert bridge["directly_comparable_mds2_rows"] == 0
          assert bridge["issue_76_exact_target_cells_satisfied"] == 0

          assert discovery["discovery_status"] == "official_nist_ammt_publication_index_reviewed"
          assert discovery["candidate_count"] > 0
          assert discovery["candidate_links_followed"] == 0
          assert discovery["candidate_urls_gain_acquisition_authority"] is False
          assert discovery["next_action"]["action_class"] == "experiment_specific_calibration_record_candidate_acquisition"
          rank1 = next(item for item in discovery["candidates"] if item["rank"] == 1)
          assert rank1["link_host"] == "www.nist.gov"
          assert rank1["candidate_url_followed"] is False
          assert rank1["acquisition_authorized"] is False

          assert gap3["gap_class"] == "missing_source_adapter"
          assert candidate3["state"] == "candidate"
          assert candidate3["implementation_id"] == "nist-ammt-derived-calibration-candidate-acquisition-v1"
          assert candidate3["network_authority_granted"] is False
          assert candidate3["execution_authority_granted"] is False
          assert candidate3["self_promotion_requested"] is False
          assert verification3["promotion_eligible"] is True
          assert verification3["all_required_checks_passed"] is True
          assert any(
              item["action_class"] == "experiment_specific_calibration_record_candidate_acquisition"
              and item["state"] == "verified"
              for item in registry3["records"]
          )

          assert policy3["qualification_status"] == "exact_nist_ammt_candidate_acquisition_policy_authenticated"
          assert policy3["required_candidate_rank"] == 1
          assert policy3["candidate_page_allowed_hosts"] == ["www.nist.gov"]
          assert policy3["full_text_allowed_hosts"] == ["tsapps.nist.gov"]
          assert policy3["max_requests"] == 2
          assert policy3["network_access_performed"] is False

          assert authorization3["authorization_type"] == "provenance_derived_nist_candidate_acquisition"
          assert authorization3["candidate_rank"] == 1
          assert authorization3["candidate_id"] == rank1["candidate_id"]
          assert authorization3["candidate_url"] == rank1["url"]
          assert authorization3["candidate_url_derived_from_discovery"] is True
          assert authorization3["full_text_url_derived_from_candidate_page"] is False
          assert authorization3["caller_authored_url_used"] is False
          assert authorization3["scientific_status_change_authorized"] is False

          assert acquisition3["acquisition_status"] == "derived_nist_calibration_candidate_and_full_text_acquired"
          assert acquisition3["network_requests_performed"] == 2
          assert acquisition3["candidate_url_derived_from_discovery"] is True
          assert acquisition3["full_text_url_derived_from_candidate_page"] is True
          assert acquisition3["caller_authored_url_used"] is False
          assert acquisition3["unrestricted_search_performed"] is False
          assert acquisition3["literature_promoted_to_row_level_measurement_authority"] is False
          assert acquisition3["acquisition_success_establishes_calibration_bridge"] is False
          assert acquisition3["full_text"]["final_url"].startswith("https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=")
          assert acquisition3["full_text"]["page_count"] > 0
          assert acquisition3["full_text"]["extractor"] == "pypdf"
          assert acquisition3["full_text"]["raw_bytes_persisted"] is False
          claims = {item["claim_id"]: item for item in acquisition3["claim_receipts"]}
          assert claims["digital_camera_in_situ_calibration_methodology"]["matched"] is True
          assert claims["open_platform_testbed_experiment_scope"]["matched"] is True
          assert claims["spot_calibration_200w_pulsed_condition"]["matched"] is True
          assert claims["d4sigma_spot_definition"]["matched"] is True
          assert claims["explicit_mds2_2923_identity"]["matched"] is False
          assert claims["explicit_machine_setting_actual_power_bridge"]["matched"] is False

          assert assessment3["evidence_scope"]["digital_camera_in_situ_calibration_methodology_established"] is True
          assert assessment3["evidence_scope"]["d4sigma_spot_definition_established"] is True
          assert assessment3["experiment_specific_bridge"]["exact_mds2_2923_experiment_identity_established"] is False
          assert assessment3["experiment_specific_bridge"]["exact_machine_setting_to_calibrated_power_relation_established"] is False
          assert assessment3["experiment_specific_bridge"]["bridge_established"] is False
          assert assessment3["gate_decision"]["directly_comparable_mds2_rows"] == 0
          assert assessment3["gate_decision"]["direct_numerical_validation_authorized"] is False
          assert assessment3["gate_decision"]["issue_76_exact_target_cells_satisfied"] == 0
          assert assessment3["next_action"]["action_class"] == "mds2_2923_experiment_identity_reference_chain_assessment"

          assert len(manifest["cycles"]) == 10
          cycle9, cycle10 = manifest["cycles"][8:10]
          assert cycle9["selected_action_class"] == "experiment_specific_calibration_record_candidate_acquisition"
          assert cycle9["bounded_candidate_discovered"] is True
          assert cycle10["capability_available"] is True
          assert cycle10["research_action_resumed"] is True
          assert cycle10["network_requests_performed"] == 2
          assert cycle10["candidate_url_derived_from_discovery"] is True
          assert cycle10["full_text_url_derived_from_candidate_page"] is True
          assert cycle10["bridge_established"] is False
          assert cycle10["output_next_action_class"] == "mds2_2923_experiment_identity_reference_chain_assessment"

          assert gap4["gap_class"] == "missing_analysis_executor"
          assert resolution4["resolution_status"] == "no_bounded_candidate_available"
          assert manifest["third_capability_candidate_promoted"] is True
          assert manifest["third_research_action_resumed"] is True
          assert manifest["derived_candidate_acquisition_executed"] is True
          assert manifest["calibration_methodology_established"] is True
          assert manifest["exact_mds2_experiment_identity_established"] is False
          assert manifest["exact_machine_setting_to_calibrated_power_relation_established"] is False
          assert manifest["bridge_established"] is False
          assert manifest["directly_comparable_mds2_rows"] == 0
          assert manifest["issue_76_exact_target_cells_satisfied"] == 0
          assert manifest["fourth_capability_gap_emitted"] is True
          assert manifest["fourth_capability_candidate_discovered"] is False
          assert manifest["generated_next_action_class"] == "mds2_2923_experiment_identity_reference_chain_assessment"
          assert manifest["final_blocker"] == "experiment_identity_reference_chain_capability_not_established"
          assert manifest["scientific_status_changed"] is False
          assert manifest["positive_scientific_closeout_established"] is False
          assert manifest["global_evidence_unavailability_claimed"] is False

          assert stop["reason_code"] == "capability_expansion_required"
          assert stop["requested_action_class"] == "mds2_2923_experiment_identity_reference_chain_assessment"
          assert stop["bounded_candidate_discovered"] is False
          assert stop["global_evidence_unavailability_claimed"] is False
      - name: Upload bounded autonomous provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-production-live-replay
          path: |
            outputs/autonomous-in625-production/autonomous-production-manifest.json
            outputs/autonomous-in625-production/bounded-stop.json
            outputs/autonomous-in625-production/network-acquisition-receipt.json
            outputs/autonomous-in625-production/physical-comparability-assessment.json
            outputs/autonomous-in625-production/nist-network-policy-qualification.json
            outputs/autonomous-in625-production/nist-network-authorization.json
            outputs/autonomous-in625-production/nist-network-acquisition-receipt.json
            outputs/autonomous-in625-production/nist-scientific-intake.json
            outputs/autonomous-in625-production/nist-post-acquisition-rediagnosis.json
            outputs/autonomous-in625-production/multisource-policy-qualification.json
            outputs/autonomous-in625-production/multisource-source-acquisition.json
            outputs/autonomous-in625-production/geometry-condition-mapping-assessment.json
            outputs/autonomous-in625-production/capability-*.json
            outputs/autonomous-in625-production/calibration-protocol-bridge-capability-result.json
            outputs/autonomous-in625-production/nist-ammt-source-discovery-policy-qualification.json
            outputs/autonomous-in625-production/calibration-record-source-discovery.json
            outputs/autonomous-in625-production/nist-ammt-candidate-acquisition-policy-qualification.json
            outputs/autonomous-in625-production/nist-ammt-derived-candidate-authorization.json
            outputs/autonomous-in625-production/nist-ammt-calibration-candidate-acquisition.json
            outputs/autonomous-in625-production/nist-ammt-calibration-candidate-bridge-assessment.json
          if-no-files-found: warn
          retention-days: 14
