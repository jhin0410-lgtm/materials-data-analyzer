name: Temporary research-program exact-file binding gate

on:
  push:
    branches:
      - fix/research-program-exact-file-binding-toctou-20260816

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/research-program-exact-file-binding-toctou-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply single-snapshot patch
        run: |
          python scripts/tmp_fix_research_program_exact_file_binding.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run focused provenance gate
        run: |
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/research_program.py \
            tests/test_research_program_exact_file_binding_toctou.py
          python -m pytest -q \
            tests/test_research_program_exact_file_binding_toctou.py \
            tests/test_research_program.py \
            tests/test_research_program_source_trust_policy_pins.py \
            tests/test_research_program_repository_benchmark.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/research_program.py \
            tests/test_research_program_exact_file_binding_toctou.py
      - name: Commit verified source patch
        run: |
          git add \
            src/materials_data_analyzer/research_loop/research_program.py \
            tests/test_research_program_exact_file_binding_toctou.py
          if git diff --cached --quiet; then
            echo "No verified source/test changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Bind parsed research-program files to one byte snapshot"
          git push origin HEAD:fix/research-program-exact-file-binding-toctou-20260816
