name: Autonomous Phase A-E acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-a-e-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused acceptance regression
        run: |
          python -m pytest -q tests/test_phase_a_e_acceptance.py tests/test_autonomous_science_phases_b_e.py

      - name: Run deterministic real-case acceptance workflow
        run: |
          python scripts/run_phase_a_e_acceptance.py --output outputs/phase_a_e_acceptance_ci
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/phase_a_e_acceptance_ci/02_phase_a_e_acceptance")
          summary = json.loads((root / "phase_a_e_acceptance_summary.json").read_text())
          assert summary["status"] == "architecture_acceptance_passed_with_empirical_gaps"
          assert summary["architecture_acceptance_passed"] is True
          assert summary["scientific_hypothesis_verified"] is False
          assert summary["unresolved_github_issues"] == [76, 156]
          assert summary["scientific_boundary"]["network_required_for_acceptance"] is False
          assert summary["scientific_boundary"]["synthetic_scientific_measurements_used"] is False
          assert summary["phases"]["E"]["expected_information_gain"]["status"] == "not_quantified"
          assert summary["phases"]["E"]["second_executor_introduced"] is False
          PY

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-a-e-acceptance-evidence
          path: |
            outputs/phase_a_e_acceptance_ci/02_phase_a_e_acceptance/phase_a_e_acceptance_summary.json
            outputs/phase_a_e_acceptance_ci/02_phase_a_e_acceptance/phase_a_e_acceptance_report.md
            outputs/phase_a_e_acceptance_ci/02_phase_a_e_acceptance/phase_a_e_acceptance_manifest.json
            outputs/phase_a_e_acceptance_ci/phase_a_e_acceptance_run_manifest.json
          if-no-files-found: warn
          retention-days: 30
