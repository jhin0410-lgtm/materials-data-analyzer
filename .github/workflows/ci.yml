name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          mkdir -p outputs/ci
          set -o pipefail
          python -m pytest -q 2>&1 | tee outputs/ci/pytest.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-diagnostics-${{ matrix.os }}
          path: outputs/ci/pytest.log
          if-no-files-found: error
          retention-days: 14

  installed-package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        shell: bash
        run: |
          mkdir -p outputs/ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "build>=1.2,<2"
          set -o pipefail
          python -m build 2>&1 | tee outputs/ci/package-build.log

      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Smoke test installed CLIs
        shell: bash
        run: |
          python -c "import materials_data_analyzer; print(materials_data_analyzer.__version__)"
          mda --help
          mda \
            --mode eda \
            --input data/sample/experiment_process.csv \
            --run-name installed_package_smoke
          test -f outputs/installed_package_smoke/processed/preprocessing_audit.json
          test -f outputs/installed_package_smoke/run_manifest.json

          mda-nasa-battery-import --help
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from scipy.io import savemat

          output = Path("outputs/ci/nasa_import_input")
          output.mkdir(parents=True, exist_ok=True)
          cycles = []
          for cycle in range(1, 4):
              elapsed = np.linspace(0.0, 3600.0, 21)
              cycles.append(
                  {
                      "type": "discharge",
                      "ambient_temperature": 24.0,
                      "time": np.array([2026, 1, cycle, 0, 0, 0], dtype=float),
                      "data": {
                          "Voltage_measured": np.linspace(4.2, 3.0, 21),
                          "Current_measured": -np.ones(21),
                          "Temperature_measured": np.linspace(24.0, 27.0, 21),
                          "Time": elapsed,
                          "Capacity": 2.0 - 0.01 * cycle,
                      },
                  }
              )
          savemat(output / "B0005.mat", {"B0005": {"cycle": np.array(cycles, dtype=object)}})
          PY
          mda-nasa-battery-import \
            --input outputs/ci/nasa_import_input \
            --output outputs/installed_nasa_battery_import_smoke \
            --retrieved-at 2026-08-01T00:00:00Z
          test -f outputs/installed_nasa_battery_import_smoke/nasa_pcoe_cycle_summary.csv
          test -f outputs/installed_nasa_battery_import_smoke/nasa_pcoe_raw_signal.csv
          test -f outputs/installed_nasa_battery_import_smoke/nasa_pcoe_raw_signal_provenance.json
          test -f outputs/installed_nasa_battery_import_smoke/nasa_pcoe_import_manifest.json

          mda-battery-intelligence --help
          mda-battery-intelligence \
            --cycle-summary data/processed/kaggle_nasa_battery_cycle_summary_analysis_ready.csv \
            --output outputs/installed_battery_intelligence_smoke \
            --n-splits 3 \
            --knee-bootstrap-samples 0
          test -f outputs/installed_battery_intelligence_smoke/run_manifest.json
          test -f outputs/installed_battery_intelligence_smoke/reports/scientific_closeout.md
          test -f outputs/installed_battery_intelligence_smoke/reports/error_diagnostics_summary.json
          test -f outputs/installed_battery_intelligence_smoke/tables/validation_predictions.csv
          test -f outputs/installed_battery_intelligence_smoke/tables/model_comparison.csv
          test -f outputs/installed_battery_intelligence_smoke/tables/error_by_battery.csv
          test -f outputs/installed_battery_intelligence_smoke/tables/error_by_lifecycle_segment.csv
          test -f outputs/installed_battery_intelligence_smoke/tables/high_error_predictions.csv
          test -f outputs/installed_battery_intelligence_smoke/figures/model_mae_comparison.png
          python -c "import json, pathlib; p=json.loads(pathlib.Path('outputs/installed_battery_intelligence_smoke/reports/validation_summary.json').read_text()); assert p['summary']['best_baseline_name']; assert len(p['summary']['model_metrics']) == 7"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('outputs/installed_battery_intelligence_smoke/reports/scientific_closeout.json').read_text()); assert p['component_statuses']['battery_disjoint_leakage_control']['status'] == 'Supported'; assert p['component_statuses']['engineering_decision_readiness']['status'] == 'Not ready'"

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ matrix.os }}
          path: |
            outputs/ci/package-build.log
            dist/*
            outputs/installed_package_smoke/processed/preprocessing_audit.json
            outputs/installed_package_smoke/run_manifest.json
            outputs/installed_nasa_battery_import_smoke/nasa_pcoe_cycle_summary.csv
            outputs/installed_nasa_battery_import_smoke/nasa_pcoe_raw_signal_provenance.json
            outputs/installed_nasa_battery_import_smoke/nasa_pcoe_import_manifest.json
            outputs/installed_battery_intelligence_smoke/run_manifest.json
            outputs/installed_battery_intelligence_smoke/reports/validation_summary.json
            outputs/installed_battery_intelligence_smoke/reports/error_diagnostics_summary.json
            outputs/installed_battery_intelligence_smoke/reports/scientific_closeout.json
            outputs/installed_battery_intelligence_smoke/reports/scientific_closeout.md
            outputs/installed_battery_intelligence_smoke/tables/model_comparison.csv
            outputs/installed_battery_intelligence_smoke/tables/trajectory_diagnostics.csv
            outputs/installed_battery_intelligence_smoke/tables/validation_by_battery.csv
            outputs/installed_battery_intelligence_smoke/tables/error_by_battery.csv
            outputs/installed_battery_intelligence_smoke/tables/error_by_lifecycle_segment.csv
            outputs/installed_battery_intelligence_smoke/tables/error_by_knee_phase.csv
            outputs/installed_battery_intelligence_smoke/tables/error_by_domain_status.csv
            outputs/installed_battery_intelligence_smoke/tables/high_error_predictions.csv
            outputs/installed_battery_intelligence_smoke/figures/model_mae_comparison.png
            outputs/installed_battery_intelligence_smoke/figures/ridge_vs_best_baseline_error_delta.png
          if-no-files-found: warn
          retention-days: 14
