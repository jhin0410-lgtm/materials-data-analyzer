name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run first failing test with log
        run: python -m pytest -x -vv > pytest.log 2>&1

      - name: Upload pytest diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nist-ambench-pytest-log
          path: pytest.log
          if-no-files-found: error
