name: Live Co-Cr corrosion generalization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-cocr-corrosion-generalization.yml"
      - "configs/research/cocr_corrosion_zenodo_episode.v1.json"
      - "scripts/run_live_cocr_corrosion_zenodo.py"
      - "scripts/audit_live_cocr_corrosion.py"
      - "src/materials_data_analyzer/research_loop/cocr_corrosion_zenodo_episode.py"
      - "src/materials_data_analyzer/research_loop/cocr_corrosion_scientific_intake.py"
      - "src/materials_data_analyzer/research_loop/zenodo_evidence_acquisition.py"

permissions:
  contents: read

jobs:
  acquire-electrochemistry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt
      - name: Acquire checksum-bound electrochemical XLSX files
        run: |
          python scripts/run_live_cocr_corrosion_zenodo.py \
            --config configs/research/cocr_corrosion_zenodo_episode.v1.json \
            --output outputs/cocr-corrosion
      - name: Verify acquisition boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/cocr-corrosion")
          summary = json.loads((root / "cocr_corrosion_episode_summary.json").read_text(encoding="utf-8"))
          normalized = json.loads((root / "zenodo_record_normalized.json").read_text(encoding="utf-8"))
          assert summary["record_id"] == "21253453"
          assert summary["doi"] == "10.5281/zenodo.21253453"
          assert summary["acquired_file_count"] == 6
          assert {item["key"] for item in summary["acquired_files"]} == {
              "EIS CONTROL RAW DATA.xlsx",
              "EIS WEAR RAW DATA.xlsx",
              "lpr control cocr.xlsx",
              "LPR WEAR.xlsx",
              "LPR_Control_Converted.xlsx",
              "PDP CONTROL VS WEAR.xlsx",
          }
          assert normalized["record_decision"] == "AUTO"
          assert summary["repeat_independence_audited"] is False
          assert summary["reference_electrode_audited"] is False
          assert summary["equivalent_circuit_model_validated"] is False
          assert summary["microscopy_linkage_audited"] is False
          assert summary["scientific_support_established"] is False
          assert summary["scientific_status_changed"] is False
          assert summary["requires_scientific_intake"] is True
          PY
      - name: Execute scientific intake and bounded second pass
        run: |
          python scripts/audit_live_cocr_corrosion.py \
            --episode-root outputs/cocr-corrosion \
            --output outputs/cocr-corrosion/intake
      - name: Verify bounded research-cycle snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/cocr-corrosion/intake/cocr_scientific_intake_summary.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["eis_control_acquisitions"] == 10
          assert report["eis_wear_acquisitions"] == 11
          assert report["eis_points_per_acquisition"] == 56
          assert report["common_eis_times_h"] == [0, 40, 60, 80, 100, 120, 140, 170]
          assert report["lpr_control_traces"] == 10
          assert report["lpr_wear_traces"] == 11
          assert report["lpr_points_per_trace"] == 21
          assert report["common_lpr_times_h"] == [0, 40, 60, 80, 100, 120, 140, 170]
          assert abs(report["converted_control_potential_shift_v"] - 0.044) < 1e-12
          assert abs(report["converted_control_current_factor"] - (50 / 43)) < 1e-12
          assert report["converted_control_is_independent_measurement"] is False
          assert report["replicate_independence_established"] is False
          assert report["full_bounded_research_cycle_completed"] is True
          assert report["scientific_status_changed"] is False
          PY
      - name: Upload exact electrochemistry research-cycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cocr-corrosion-live-acquisition
          path: outputs/cocr-corrosion/
          if-no-files-found: warn
          retention-days: 30
