name: Temporary PR128 authenticated consumer gate

on:
  push:
    branches:
      - agent/authenticated-transition-consumer-20260815

permissions:
  contents: write

jobs:
  focused-consumer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/authenticated-transition-consumer-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply contract fix
        run: |
          python scripts/tmp_fix_authenticated_transition_consumer.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Consumer regression gate
        run: |
          set -euo pipefail
          python -m ruff check --fix tests/test_authenticated_transition_consumer.py
          python -m pytest -q \
            tests/test_authenticated_transition_consumer.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_inference_binding.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/authenticated_transition_consumer.py \
            tests/test_authenticated_transition_consumer.py
      - name: Commit verified consumer changes
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/authenticated_transition_consumer.py \
            tests/test_authenticated_transition_consumer.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Align independent consumer with producer graph contract'
          git push origin HEAD:agent/authenticated-transition-consumer-20260815
