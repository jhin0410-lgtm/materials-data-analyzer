name: Live SSRM titanium generalization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-ssrm-titanium-generalization.yml"
      - "configs/research/ssrm_titanium_zenodo_episode.v1.json"
      - "scripts/run_live_ssrm_titanium_zenodo.py"
      - "src/materials_data_analyzer/research_loop/safe_archive_inventory.py"
      - "src/materials_data_analyzer/research_loop/ssrm_titanium_zenodo_episode.py"
      - "src/materials_data_analyzer/research_loop/zenodo_evidence_acquisition.py"
      - "tests/test_safe_archive_inventory.py"
      - "tests/test_ssrm_titanium_zenodo_episode.py"
      - "tests/test_zenodo_evidence_acquisition.py"

permissions:
  contents: read

jobs:
  live-ssrm-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and focused regressions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt
          python -m pytest -q \
            tests/test_ssrm_titanium_zenodo_episode.py \
            tests/test_zenodo_evidence_acquisition.py \
            tests/test_safe_archive_inventory.py

      - name: Acquire exact Zenodo archive and build bounded inventory
        run: |
          python scripts/run_live_ssrm_titanium_zenodo.py \
            --config configs/research/ssrm_titanium_zenodo_episode.v1.json \
            --output outputs/ssrm-titanium

      - name: Verify acquisition-only scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/ssrm-titanium")
          summary = json.loads((root / "ssrm_titanium_episode_summary.json").read_text(encoding="utf-8"))
          inventory = json.loads((root / "archive_inventory.json").read_text(encoding="utf-8"))
          normalized = json.loads((root / "zenodo_record_normalized.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "acquisition" / "zenodo_acquisition_manifest.json").read_text(encoding="utf-8"))

          assert summary["record_id"] == "18504064"
          assert summary["doi"] == "10.5281/zenodo.18504064"
          assert summary["source_license_ids"] == ["cc-zero"]
          assert summary["license_ids"] == ["cc0-1.0"]
          assert summary["archive_file"] == "SSRM of Ti, Ti6Al4V, Ti5553.zip"
          assert summary["source_checksum_algorithm"] == "md5"
          assert summary["source_checksum_digest"] == "86894af4aff1cc9f1e762ae2a0f5042c"
          assert summary["archive_member_count"] > 0
          assert summary["archive_text_candidate_count"] > 0
          assert summary["archive_text_hashed_count"] > 0
          assert summary["bulk_extraction_performed"] is False
          assert summary["semantic_lineage_audited"] is False
          assert summary["cross_technique_identical_aliquot_established"] is False
          assert summary["replicate_independence_established"] is False
          assert summary["scientific_support_established"] is False
          assert summary["scientific_status_changed"] is False
          assert summary["requires_scientific_intake"] is True

          assert normalized["policy_version"] == "1.1"
          assert normalized["source_license_ids"] == ["cc-zero"]
          assert normalized["license_ids"] == ["cc0-1.0"]
          assert normalized["record_decision"] == "AUTO"
          assert normalized["download_success_is_scientific_validation"] is False
          assert manifest["source_license_ids"] == ["cc-zero"]
          assert manifest["license_ids"] == ["cc0-1.0"]
          assert inventory["archive_sha256"] == summary["archive_sha256"]
          assert inventory["bulk_extraction_performed"] is False
          assert inventory["scientific_status_changed"] is False
          PY

      - name: Upload exact SSRM acquisition evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ssrm-titanium-live-acquisition
          path: outputs/ssrm-titanium/
          if-no-files-found: warn
          retention-days: 30
