name: IN625 Zenodo live evidence

on:
  push:
    branches:
      - feature/verified-in625-recursive-acquisition-211
    paths:
      - ".github/workflows/in625-zenodo-live-evidence.yml"
      - "configs/research/in625_zenodo_20503603_verified_source.v1.json"
      - "src/materials_data_analyzer/research_loop/in625_zenodo_live_evidence.py"
      - "tests/test_in625_zenodo_live_evidence.py"
  pull_request:
    paths:
      - ".github/workflows/in625-zenodo-live-evidence.yml"
      - "configs/research/in625_zenodo_20503603_verified_source.v1.json"
      - "src/materials_data_analyzer/research_loop/in625_zenodo_live_evidence.py"
      - "tests/test_in625_zenodo_live_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository development environment
        run: python -m pip install -e ".[dev]"
      - name: Run fail-closed source and archive tests
        run: python -m pytest -q tests/test_in625_zenodo_live_evidence.py
      - name: Verify README, acquire archive, and extract bounded tabular evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/in625-zenodo-live-evidence
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from materials_data_analyzer.research_loop.in625_zenodo_live_evidence import (
              build_verified_in625_zenodo_readme_manifest,
              inspect_verified_in625_dataset_archive,
          )

          root = Path("outputs/in625-zenodo-live-evidence")
          config = json.loads(Path("configs/research/in625_zenodo_20503603_verified_source.v1.json").read_text(encoding="utf-8"))
          record_id = str(config["zenodo"]["record_id"])
          api_url = f"https://zenodo.org/api/records/{record_id}"
          headers = {"User-Agent": "materials-data-analyzer/2.7 verified-in625-evidence"}

          def get_bytes(url: str, *, timeout: int = 60) -> bytes:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  final_url = response.geturl()
                  parsed = urllib.parse.urlparse(final_url)
                  if parsed.scheme.lower() != "https" or (parsed.hostname or "").lower() != "zenodo.org":
                      raise SystemExit(f"provider redirect left exact Zenodo HTTPS host: {final_url}")
                  return response.read()

          metadata_bytes = get_bytes(api_url)
          record = json.loads(metadata_bytes.decode("utf-8"))
          file_by_key = {item["key"]: item for item in record.get("files", [])}
          readme_name = config["zenodo"]["readme_file"]
          archive_name = config["zenodo"]["archive_file"]
          readme_url = file_by_key[readme_name]["links"]["self"]
          archive_url = file_by_key[archive_name]["links"]["self"]
          readme_bytes = get_bytes(readme_url)

          readme_manifest = build_verified_in625_zenodo_readme_manifest(
              config=config,
              metadata_bytes=metadata_bytes,
              readme_bytes=readme_bytes,
          )
          (root / "record.json").write_bytes(metadata_bytes)
          (root / readme_name).write_bytes(readme_bytes)
          (root / "readme-manifest.json").write_text(
              json.dumps(readme_manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          archive_path = root / archive_name
          req = urllib.request.Request(archive_url, headers=headers)
          with urllib.request.urlopen(req, timeout=180) as response, archive_path.open("wb") as sink:
              final_url = response.geturl()
              parsed = urllib.parse.urlparse(final_url)
              if parsed.scheme.lower() != "https" or (parsed.hostname or "").lower() != "zenodo.org":
                  raise SystemExit(f"archive redirect left exact Zenodo HTTPS host: {final_url}")
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  sink.write(chunk)

          archive_manifest = inspect_verified_in625_dataset_archive(
              config=config,
              archive_path=archive_path,
              selected_output_dir=root / "selected-tabular",
          )
          (root / "archive-manifest.json").write_text(
              json.dumps(archive_manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "record_id": readme_manifest["record_id"],
              "readme_sha256": readme_manifest["readme"]["sha256"],
              "archive_sha256": archive_manifest["archive"]["sha256"],
              "archive_member_count": archive_manifest["inventory_summary"]["member_count"],
              "selected_tabular_count": archive_manifest["inventory_summary"]["selected_tabular_count"],
              "selected_tabular_bytes": archive_manifest["inventory_summary"]["selected_tabular_bytes"],
              "direct_nist_condition_comparability_established": archive_manifest["scientific_boundary"]["direct_nist_condition_comparability_established"],
          }, indent=2))
          archive_path.unlink()
          PY
      - name: Upload verified provenance and bounded tabular evidence
        uses: actions/upload-artifact@v7
        with:
          name: in625-zenodo-live-evidence
          path: |
            outputs/in625-zenodo-live-evidence/record.json
            outputs/in625-zenodo-live-evidence/README - Dataset description.txt
            outputs/in625-zenodo-live-evidence/readme-manifest.json
            outputs/in625-zenodo-live-evidence/archive-manifest.json
            outputs/in625-zenodo-live-evidence/selected-tabular/
          if-no-files-found: error
          retention-days: 30
