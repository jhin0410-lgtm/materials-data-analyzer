name: Temporary PR202 final review fix

on:
  push:
    branches:
      - feature/bounded-recursive-research-cycle
    paths:
      - scripts/_tmp_pr202_final_review_fix.py
      - .github/workflows/_tmp-pr202-final-review-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-review-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/bounded-recursive-research-cycle
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply final review patch
        run: |
          python scripts/_tmp_pr202_final_review_fix.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run focused regression gate
        run: |
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_evidence.py \
            src/materials_data_analyzer/research_loop/validated_recursive_cycle_planning.py \
            tests/test_autonomous_inquiry_plan_verifier.py \
            tests/test_recursive_research_cycle_review_hardening.py
          python -m pytest -q \
            tests/test_autonomous_inquiry_plan_verifier.py \
            tests/test_recursive_research_cycle_controller.py \
            tests/test_recursive_research_cycle_evidence.py \
            tests/test_recursive_research_cycle_review_hardening.py \
            tests/test_recursive_research_cycle_integration.py \
            tests/test_recursive_research_cycle_rediagnosis.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/recursive_research_cycle_evidence.py \
            src/materials_data_analyzer/research_loop/validated_recursive_cycle_planning.py \
            tests/test_autonomous_inquiry_plan_verifier.py \
            tests/test_recursive_research_cycle_review_hardening.py
      - name: Commit verified patch and remove temporary gate
        run: |
          set -euo pipefail
          rm scripts/_tmp_pr202_final_review_fix.py
          rm .github/workflows/_tmp-pr202-final-review-fix.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Close final recursive-cycle review gaps'
          git push origin HEAD:feature/bounded-recursive-research-cycle
