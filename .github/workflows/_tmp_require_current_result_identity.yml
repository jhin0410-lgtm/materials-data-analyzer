name: Temporary current result identity closure

on:
  push:
    branches:
      - agent/authenticated-inference-provenance-20260815
    paths:
      - .github/workflows/_tmp_require_current_result_identity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/authenticated-inference-provenance-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply current result identity closure
        run: |
          python scripts/_tmp_require_current_result_identity.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_authenticated_epistemic_transition.py')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python -m py_compile src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py
          python -m py_compile tests/test_authenticated_epistemic_transition.py
          git diff --check
      - name: Run focused replayability gate
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition.py
          python -m pytest -q \
            tests/test_authenticated_inference_binding.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_inherited_portability.py \
            tests/test_authenticated_epistemic_transition_merge_gate.py \
            tests/test_authenticated_epistemic_transition_construction_contract.py \
            tests/test_authenticated_transition_legacy_critic_compatibility.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition.py
          git diff --check
      - name: Commit current result identity closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition.py
          git diff --cached --quiet && exit 1
          git commit -m 'Require replayable current result identity'
          git push origin HEAD:agent/authenticated-inference-provenance-20260815
