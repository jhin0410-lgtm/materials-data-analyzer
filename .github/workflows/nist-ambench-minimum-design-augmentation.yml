name: NIST AM-Bench minimum design augmentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/plan_nist_ambench_2018_02_design_augmentation.py"
      - "scripts/audit_nist_ambench_2018_02_process_design.py"
      - "scripts/run_nist_ambench_2018_02_workflow.py"
      - "scripts/build_nist_ambench_2018_02_case_study.py"
      - "tests/test_nist_design_augmentation_plan.py"
      - "tests/test_nist_process_design_audit.py"
      - "data/case_studies/nist_ambench_2018_02/**"
      - "docs/NIST_AMBENCH_MINIMUM_DESIGN_AUGMENTATION.md"
      - ".github/workflows/nist-ambench-minimum-design-augmentation.yml"

permissions:
  contents: read

concurrency:
  group: nist-ambench-design-augmentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-minimum-design-augmentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build verified NIST integrated case
        run: |
          python scripts/run_nist_ambench_2018_02_workflow.py \
            --output outputs/nist_ambench_2018_02

      - name: Generate minimum design augmentation
        run: |
          python scripts/plan_nist_ambench_2018_02_design_augmentation.py \
            --integrated-table outputs/nist_ambench_2018_02/integrated_sample_table.csv \
            --output outputs/nist_ambench_design_augmentation

      - name: Run focused design-planning tests
        run: |
          python -m pytest -q \
            tests/test_nist_design_augmentation_plan.py \
            tests/test_nist_process_design_audit.py

      - name: Verify staged plan and checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import pandas as pd

          root = Path("outputs/nist_ambench_design_augmentation")
          plan = json.loads(
              (root / "nist_design_augmentation_plan.json").read_text(
                  encoding="utf-8"
              )
          )
          manifest = json.loads(
              (root / "nist_design_augmentation_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          conditions = pd.read_csv(
              root / "nist_design_augmentation_conditions.csv"
          )

          assert plan["status"] == "completed"
          assert plan["evidence_level"] == "Diagnostic"
          assert plan["decision"]["recommended_next_action"] == (
              "execute_stage_1_only"
          )
          assert plan["totals"] == {
              "stage_1_new_conditions": 3,
              "stage_1_new_traces": 9,
              "stage_2_additional_conditions": 3,
              "stage_2_additional_traces": 9,
              "cumulative_new_conditions_through_stage_2": 6,
              "cumulative_new_traces_through_stage_2": 18,
          }

          stage_1 = plan["stages"]["stage_1_complete_observed_grid"]
          assert stage_1["conditions"] == [
              {
                  "actual_laser_power_w": 137.9,
                  "scan_speed_mm_s": 800.0,
              },
              {
                  "actual_laser_power_w": 137.9,
                  "scan_speed_mm_s": 1200.0,
              },
              {
                  "actual_laser_power_w": 179.2,
                  "scan_speed_mm_s": 400.0,
              },
          ]
          interaction = stage_1["resulting_design"]["models"][
              "main_effects_plus_interaction"
          ]
          assert interaction["parameter_count"] == 4
          assert interaction["matrix_rank"] == 4
          assert interaction["condition_level_residual_df"] == 2

          stage_2 = plan["stages"]["stage_2_add_midpoint_power"]
          assert stage_2["candidate_midpoint_power_w"] == 158.55
          quadratic = stage_2["resulting_design"]["models"][
              "full_quadratic_response_surface"
          ]
          assert quadratic["parameter_count"] == 6
          assert quadratic["matrix_rank"] == 6
          assert quadratic["condition_level_residual_df"] == 3

          validation = plan["stages"]["stage_3_independent_validation"]
          assert validation["numeric_conditions_automatically_selected"] is False
          assert validation["minimum_distinct_validation_conditions"] == 2
          assert validation["minimum_trace_replicates_per_condition"] == 3

          assert len(conditions) == 6
          assert set(conditions["minimum_trace_replicates"]) == {3}
          assert not conditions["machine_feasibility_confirmed"].astype(bool).any()
          assert conditions["actual_power_calibration_required"].astype(bool).all()

          assert plan["software_validation"] == {
              "machine_feasibility_assumed": False,
              "missing_response_values_inferred": False,
              "optimization_performed": False,
              "response_model_fitted": False,
              "response_values_read": False,
          }
          for name, filename in manifest["outputs"].items():
              path = root / filename
              assert path.is_file()
              assert manifest["output_sha256"][name] == hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()
          assert manifest["response_model_fitted"] is False
          assert manifest["optimization_performed"] is False
          assert manifest["machine_feasibility_assumed"] is False
          assert not list(root.glob("*.pkl"))
          assert not list(root.glob("*model*"))
          print(
              (root / "nist_design_augmentation_plan.md").read_text(
                  encoding="utf-8"
              )
          )
          PY

      - name: Upload design-planning evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nist-ambench-minimum-design-augmentation
          path: |
            outputs/nist_ambench_2018_02
            outputs/nist_ambench_design_augmentation
          if-no-files-found: error
          retention-days: 14
