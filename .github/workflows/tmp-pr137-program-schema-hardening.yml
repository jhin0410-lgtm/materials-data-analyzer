name: Temporary PR137 program-schema hardening gate

on:
  push:
    branches:
      - agent/mission-source-trust-policy-pins-clean-20260816

permissions:
  contents: write

jobs:
  focused-program-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mission-source-trust-policy-pins-clean-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply program schema hardening
        run: |
          python scripts/tmp_pr137_program_schema_hardening.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run focused regressions
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/research_program.py \
            tests/test_research_program_source_trust_policy_pins.py
          python -m pytest -q \
            tests/test_research_program_source_trust_policy_pins.py \
            tests/test_research_program.py \
            tests/test_acquisition_source_trust_policy.py \
            tests/test_acquisition_record_binding.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/research_program.py \
            tests/test_research_program_source_trust_policy_pins.py
      - name: Commit verified hardening
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/research_program.py \
            tests/test_research_program_source_trust_policy_pins.py
          if git diff --cached --quiet; then
            echo "No source/test changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Version source-trust program output schema'
          git push origin HEAD:agent/mission-source-trust-policy-pins-clean-20260816
