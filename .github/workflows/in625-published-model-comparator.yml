name: IN625 published retrospective model comparator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/in625-published-model-comparator.yml"
      - "scripts/run_in625_published_model_comparator.py"
      - "src/materials_data_analyzer/research_loop/in625_published_model_comparator.py"
      - "src/materials_data_analyzer/research_loop/in625_model_discrepancy_inquiry.py"
      - "scripts/run_in625_model_discrepancy_inquiry.py"
      - "tests/test_in625_model_discrepancy_inquiry.py"
      - "src/materials_data_analyzer/research_loop/in625_blind_challenge_history.py"
      - "scripts/run_in625_blind_challenge_history.py"
      - "tests/test_in625_blind_challenge_history.py"
      - "src/materials_data_analyzer/research_loop/in625_geometry_condition_source_acquisition.py"
      - "src/materials_data_analyzer/research_loop/in625_model_holdout_benchmark.py"
      - "tests/test_in625_published_model_comparator.py"
      - "data/case_studies/nist_ambench_2018_02/source_process_conditions.csv"
      - "data/case_studies/nist_ambench_2018_02/source_melt_pool_measurements.csv"

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      contract_file_sha256: ${{ steps.freeze.outputs.contract_file_sha256 }}
      contract_object_sha256: ${{ steps.freeze.outputs.contract_object_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt

      - name: Freeze existing Case-B/A-C benchmark contract
        id: freeze
        run: |
          mkdir -p outputs/in625-published-comparator
          python scripts/run_in625_published_model_comparator.py freeze-contract \
            --repository-root . \
            --output outputs/in625-published-comparator/contract.json \
            | tee outputs/in625-published-comparator/contract_summary.json
          CONTRACT_FILE_SHA256="$(sha256sum outputs/in625-published-comparator/contract.json | cut -d' ' -f1)"
          CONTRACT_OBJECT_SHA256="$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-published-comparator/contract.json", encoding="utf-8"))))')"
          echo "contract_file_sha256=$CONTRACT_FILE_SHA256" >> "$GITHUB_OUTPUT"
          echo "contract_object_sha256=$CONTRACT_OBJECT_SHA256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: in625-published-comparator-contract
          path: |
            outputs/in625-published-comparator/contract.json
            outputs/in625-published-comparator/contract_summary.json
          if-no-files-found: error
          retention-days: 30

  acquire-published-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      evidence_file_sha256: ${{ steps.acquire.outputs.evidence_file_sha256 }}
      evidence_object_sha256: ${{ steps.acquire.outputs.evidence_object_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt

      - name: Acquire finite institutional publication evidence
        id: acquire
        run: |
          set -o pipefail
          mkdir -p outputs/in625-published-comparator
          python scripts/run_in625_published_model_comparator.py acquire \
            --output outputs/in625-published-comparator/published_evidence.json \
            | tee outputs/in625-published-comparator/acquisition_summary.json
          EVIDENCE_FILE_SHA256="$(sha256sum outputs/in625-published-comparator/published_evidence.json | cut -d' ' -f1)"
          EVIDENCE_OBJECT_SHA256="$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-published-comparator/published_evidence.json", encoding="utf-8"))))')"
          echo "evidence_file_sha256=$EVIDENCE_FILE_SHA256" >> "$GITHUB_OUTPUT"
          echo "evidence_object_sha256=$EVIDENCE_OBJECT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify retrospective authority boundary before upload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path(
                  "outputs/in625-published-comparator/published_evidence.json"
              ).read_text(encoding="utf-8")
          )
          assert value["calibration_record"]["parameter_fit_case_ids"] == ["B"]
          assert value["calibration_record"][
              "parameters_reported_fixed_for_validation_case_ids"
          ] == ["A", "C"]
          assert value["retrospective_scope"][
              "strict_prospective_holdout_model_selection_established"
          ] is False
          assert value["retrospective_scope"]["eligible_claim"] == (
              "retrospective_published_model_comparison"
          )
          assert value["authority_boundary"]["strict_blind_validation_claimed"] is False
          assert value["authority_boundary"]["scientific_status_promoted"] is False
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: in625-published-comparator-evidence
          path: |
            outputs/in625-published-comparator/published_evidence.json
            outputs/in625-published-comparator/acquisition_summary.json
          if-no-files-found: error
          retention-days: 30

  evaluate-retrospective-comparator:
    needs:
      - freeze-contract
      - acquire-published-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt

      - uses: actions/download-artifact@v8
        with:
          name: in625-published-comparator-contract
          path: downloaded-contract

      - uses: actions/download-artifact@v8
        with:
          name: in625-published-comparator-evidence
          path: downloaded-evidence

      - name: Evaluate published A-C predictions against current NIST measurements
        env:
          CONTRACT_FILE_SHA256: ${{ needs.freeze-contract.outputs.contract_file_sha256 }}
          CONTRACT_OBJECT_SHA256: ${{ needs.freeze-contract.outputs.contract_object_sha256 }}
          EVIDENCE_FILE_SHA256: ${{ needs.acquire-published-evidence.outputs.evidence_file_sha256 }}
          EVIDENCE_OBJECT_SHA256: ${{ needs.acquire-published-evidence.outputs.evidence_object_sha256 }}
        run: |
          set -o pipefail
          mkdir -p outputs/in625-published-comparator
          cp downloaded-contract/contract.json outputs/in625-published-comparator/contract.json
          cp downloaded-evidence/published_evidence.json outputs/in625-published-comparator/published_evidence.json
          python scripts/run_in625_published_model_comparator.py evaluate \
            --repository-root . \
            --contract outputs/in625-published-comparator/contract.json \
            --contract-file-sha256 "$CONTRACT_FILE_SHA256" \
            --contract-object-sha256 "$CONTRACT_OBJECT_SHA256" \
            --evidence outputs/in625-published-comparator/published_evidence.json \
            --evidence-file-sha256 "$EVIDENCE_FILE_SHA256" \
            --evidence-object-sha256 "$EVIDENCE_OBJECT_SHA256" \
            --output outputs/in625-published-comparator/evaluation.json \
            | tee outputs/in625-published-comparator/evaluation_summary.json

      - name: Verify bounded retrospective result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path(
                  "outputs/in625-published-comparator/evaluation.json"
              ).read_text(encoding="utf-8")
          )
          assert value["aggregate_ac_metrics"]["case_b_included"] is False
          assert value["aggregate_ac_metrics"]["width_mae_um"] > 0
          assert value["aggregate_ac_metrics"]["depth_mae_um"] > 0
          assert value["scientific_interpretation"][
              "parameter_fit_reported_case_b_only"
          ] is True
          assert value["scientific_interpretation"][
              "published_parameters_fixed_for_a_c"
          ] is True
          assert value["scientific_interpretation"][
              "strict_blind_model_selection_established"
          ] is False
          assert value["scientific_interpretation"][
              "eligible_as_strict_phase1_holdout_prediction"
          ] is False
          assert value["scientific_boundary"][
              "prospective_blind_validation_established"
          ] is False
          assert value["scientific_boundary"]["scientific_status_promoted"] is False
          print(json.dumps(value["aggregate_ac_metrics"], sort_keys=True))
          PY

      - name: Focused comparator regressions
        run: python -m pytest tests/test_in625_published_model_comparator.py -q

      - name: Feed authenticated comparator discrepancy through critic and planner
        run: |
          set -o pipefail
          EVALUATION_FILE_SHA256="$(sha256sum outputs/in625-published-comparator/evaluation.json | cut -d' ' -f1)"
          EVALUATION_OBJECT_SHA256="$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-published-comparator/evaluation.json", encoding="utf-8"))))')"
          python scripts/run_in625_model_discrepancy_inquiry.py \
            --evaluation outputs/in625-published-comparator/evaluation.json \
            --evaluation-file-sha256 "$EVALUATION_FILE_SHA256" \
            --evaluation-object-sha256 "$EVALUATION_OBJECT_SHA256" \
            --output-root outputs/in625-published-comparator/model-discrepancy-inquiry \
            | tee outputs/in625-published-comparator/model_discrepancy_summary.json

      - name: Verify bounded discrepancy inquiry and autonomous next action
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path(
                  "outputs/in625-published-comparator/model-discrepancy-inquiry/"
                  "model_discrepancy_inquiry.json"
              ).read_text(encoding="utf-8")
          )
          assert len(value["competing_hypotheses"]) >= 4
          assert all(
              item["verified_positive"] is False
              for item in value["competing_hypotheses"]
          )
          assert value["plan"]["scientific_critic_adapter"][
              "current_public_critic_contract_consumed"
          ] is True
          selected = value["plan"]["selected_next_action"]
          assert selected["action_class"] == "external_evidence_search"
          assert selected["automatic_execution_authorized"] is False
          assert value["bounded_interpretation"][
              "prospective_blind_validation_established"
          ] is False
          assert value["bounded_interpretation"][
              "generalizable_physics_established"
          ] is False
          assert value["authority_boundary"]["hypothesis_truth_established"] is False
          assert value["authority_boundary"]["scientific_status_promoted"] is False
          print(json.dumps({
              "selected_action_id": selected["action_id"],
              "selected_action_class": selected["action_class"],
              "candidate_count": len(value["plan"]["ranked_actions"]),
              "hypothesis_count": len(value["competing_hypotheses"]),
          }, sort_keys=True))
          PY

      - name: Focused discrepancy-inquiry regressions
        run: python -m pytest tests/test_in625_model_discrepancy_inquiry.py -q

      - name: Freeze selected discrepancy inquiry
        run: |
          INQUIRY="outputs/in625-published-comparator/model-discrepancy-inquiry/model_discrepancy_inquiry.json"
          echo "INQUIRY_FILE_SHA256=$(sha256sum "$INQUIRY" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "INQUIRY_OBJECT_SHA256=$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-published-comparator/model-discrepancy-inquiry/model_discrepancy_inquiry.json", encoding="utf-8"))))')" >> "$GITHUB_ENV"

      - name: Compile planner-selected fixed NIST history request
        run: |
          python scripts/run_in625_blind_challenge_history.py compile-request \
            --inquiry outputs/in625-published-comparator/model-discrepancy-inquiry/model_discrepancy_inquiry.json \
            --inquiry-file-sha256 "$INQUIRY_FILE_SHA256" \
            --inquiry-object-sha256 "$INQUIRY_OBJECT_SHA256" \
            --output outputs/in625-published-comparator/blind_history_request.json \
            | tee outputs/in625-published-comparator/blind_history_request_summary.json
          echo "BLIND_REQUEST_FILE_SHA256=$(sha256sum outputs/in625-published-comparator/blind_history_request.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "BLIND_REQUEST_OBJECT_SHA256=$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-published-comparator/blind_history_request.json", encoding="utf-8"))))')" >> "$GITHUB_ENV"

      - name: Explicitly authorize exact fixed NIST history request
        run: |
          python scripts/run_in625_blind_challenge_history.py authorize \
            --request outputs/in625-published-comparator/blind_history_request.json \
            --request-file-sha256 "$BLIND_REQUEST_FILE_SHA256" \
            --request-object-sha256 "$BLIND_REQUEST_OBJECT_SHA256" \
            --output outputs/in625-published-comparator/blind_history_authorization.json \
            | tee outputs/in625-published-comparator/blind_history_authorization_summary.json
          echo "BLIND_AUTH_FILE_SHA256=$(sha256sum outputs/in625-published-comparator/blind_history_authorization.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "BLIND_AUTH_OBJECT_SHA256=$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-published-comparator/blind_history_authorization.json", encoding="utf-8"))))')" >> "$GITHUB_ENV"

      - name: Execute fixed-source NIST history acquisition and retained-byte replay
        run: |
          set -o pipefail
          python scripts/run_in625_blind_challenge_history.py execute \
            --request outputs/in625-published-comparator/blind_history_request.json \
            --request-file-sha256 "$BLIND_REQUEST_FILE_SHA256" \
            --request-object-sha256 "$BLIND_REQUEST_OBJECT_SHA256" \
            --authorization outputs/in625-published-comparator/blind_history_authorization.json \
            --authorization-file-sha256 "$BLIND_AUTH_FILE_SHA256" \
            --authorization-object-sha256 "$BLIND_AUTH_OBJECT_SHA256" \
            --source-output-dir outputs/in625-published-comparator/blind-history-sources \
            --output outputs/in625-published-comparator/blind_history_result.json \
            | tee outputs/in625-published-comparator/blind_history_result_summary.json

      - name: Verify bounded blind-history evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path(
                  "outputs/in625-published-comparator/blind_history_result.json"
              ).read_text(encoding="utf-8")
          )
          facts = value["verified_historical_context"]
          assert value["source_count"] == 4
          assert facts["amb2018_total_blind_modeling_simulations"] == 46
          assert facts["amb2018_02_melt_pool_geometry_submission_count"] == 10
          assert facts[
              "nist_retrospective_statement_none_of_10_mp_groups_came_close_to_measurements"
          ] is True
          assert facts["current_corrected_ammt_process_conditions"] == {
              "A": {"actual_power_w": 137.9, "scan_speed_mm_s": 400.0},
              "B": {"actual_power_w": 179.2, "scan_speed_mm_s": 800.0},
              "C": {"actual_power_w": 179.2, "scan_speed_mm_s": 1200.0},
          }
          assert facts["current_corrected_spot_d4sigma_um"] == {
              "AMMT": 170.0,
              "CBM": 100.0,
          }
          assert facts["individual_blind_submission_numeric_predictions_acquired"] is False
          assert value["bounded_interpretation"][
              "retrospective_published_accuracy_equals_original_blind_accuracy_established"
          ] is False
          assert value["bounded_interpretation"][
              "specific_cause_of_retrospective_improvement_established"
          ] is False
          assert value["authority_boundary"][
              "prospective_blind_validation_established"
          ] is False
          assert value["authority_boundary"]["scientific_status_promoted"] is False
          print(json.dumps({
              "source_count": value["source_count"],
              "blind_simulations": facts["amb2018_total_blind_modeling_simulations"],
              "mp_submissions": facts["amb2018_02_melt_pool_geometry_submission_count"],
              "individual_predictions_acquired": facts[
                  "individual_blind_submission_numeric_predictions_acquired"
              ],
          }, sort_keys=True))
          PY

      - name: Focused blind-history regressions
        run: python -m pytest tests/test_in625_blind_challenge_history.py -q

      - name: Upload comparator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: in625-published-retrospective-model-comparator
          path: outputs/in625-published-comparator/**
          if-no-files-found: error
          retention-days: 30
