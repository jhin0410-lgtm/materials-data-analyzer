name: Temporary PR135 semantic-claim contract gate

on:
  push:
    branches:
      - agent/acquisition-record-provenance-binding-20260815

permissions:
  contents: write

jobs:
  focused-semantic-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/acquisition-record-provenance-binding-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply semantic-claim hardening
        run: |
          python scripts/tmp_pr135_semantic_claim_contract.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run acquisition provenance regressions
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/acquisition_record_binding.py \
            tests/test_acquisition_record_binding.py
          python -m pytest -q \
            tests/test_acquisition_record_binding.py \
            tests/test_evidence_origin_binding.py \
            tests/test_program_evidence_origin_binding.py \
            tests/test_input_evidence_origin_pack.py \
            tests/test_input_evidence_origin_pack_consumer.py \
            tests/test_authenticated_transition_consumer.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/acquisition_record_binding.py \
            tests/test_acquisition_record_binding.py
      - name: Commit verified binding hardening
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/acquisition_record_binding.py \
            tests/test_acquisition_record_binding.py
          if git diff --cached --quiet; then
            echo "No source/test changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Harden recorded acquisition provenance semantics'
          git push origin HEAD:agent/acquisition-record-provenance-binding-20260815
