name: Real-data autonomous research MVP acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/real-data-mvp-acceptance.yml"
      - "scripts/build_real_data_mvp_acceptance.py"
      - "src/materials_data_analyzer/research_loop/real_data_episode_acceptance.py"
      - "src/materials_data_analyzer/research_loop/phase_a_e_acceptance.py"
      - "tests/test_real_data_episode_acceptance.py"
      - "tests/test_phase_a_e_acceptance.py"

permissions:
  contents: read

concurrency:
  group: real-data-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCA_COMMIT: fb85c4eb3d57a209c70f0db1de40421158af2270
  MCA_VERSION: 0.11.0

jobs:
  real-data-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out materials-data-analyzer
        uses: actions/checkout@v7
        with:
          path: materials-data-analyzer

      - name: Check out pinned materials-characterization-analyzer
        uses: actions/checkout@v7
        with:
          repository: jhin0410-lgtm/materials-characterization-analyzer
          ref: ${{ env.MCA_COMMIT }}
          path: materials-characterization-analyzer

      - name: Verify exact producer commit
        working-directory: materials-characterization-analyzer
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${MCA_COMMIT}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install both repositories
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "materials-data-analyzer[dev]"
          python -m pip install -e materials-characterization-analyzer
          test "$(mca --version)" = "materials-characterization-analyzer ${MCA_VERSION}"

      - name: Execute NIST AM-Bench representative research cycle
        run: |
          python materials-data-analyzer/scripts/run_representative_process_characterization_workflow.py \
            --output materials-data-analyzer/outputs/real-data-mvp-nist

      - name: Discover and acquire real public RWGS evidence
        run: |
          python materials-characterization-analyzer/scripts/discover_public_rwgs_xrd_sem_eds.py \
            --config materials-characterization-analyzer/case_studies/public_rwgs_xrd_sem_eds/discovery_config.json \
            --output materials-characterization-analyzer/outputs/real-data-mvp-rwgs/discovery

      - name: Execute producer RWGS diagnostic analysis
        run: |
          python materials-characterization-analyzer/scripts/run_public_rwgs_xrd_sem_eds_case.py \
            --config materials-characterization-analyzer/case_studies/public_rwgs_xrd_sem_eds/case_config.json \
            --discovery materials-characterization-analyzer/outputs/real-data-mvp-rwgs/discovery \
            --output materials-characterization-analyzer/outputs/real-data-mvp-rwgs/result

      - name: Export and independently validate RWGS handoff
        run: |
          python materials-characterization-analyzer/scripts/export_public_rwgs_handoff_bundle.py \
            --config materials-characterization-analyzer/case_studies/public_rwgs_xrd_sem_eds/case_config.json \
            --result materials-characterization-analyzer/outputs/real-data-mvp-rwgs/result
          mca validate-handoff \
            --bundle materials-characterization-analyzer/outputs/real-data-mvp-rwgs/result/handoff_bundle \
            --output materials-characterization-analyzer/outputs/real-data-mvp-rwgs/handoff-validation

      - name: Consume RWGS evidence through bounded downstream-use contract
        run: |
          mda-characterization-import \
            --bundle-manifest materials-characterization-analyzer/outputs/real-data-mvp-rwgs/result/handoff_bundle/characterization_handoff_bundle.json \
            --output materials-data-analyzer/outputs/real-data-mvp-rwgs-consumer

      - name: Build three-episode provenance-bound MVP acceptance
        run: |
          python materials-data-analyzer/scripts/build_real_data_mvp_acceptance.py \
            --repository-root materials-data-analyzer \
            --representative-root materials-data-analyzer/outputs/real-data-mvp-nist \
            --rwgs-consumer-root materials-data-analyzer/outputs/real-data-mvp-rwgs-consumer \
            --rwgs-bundle-manifest materials-characterization-analyzer/outputs/real-data-mvp-rwgs/result/handoff_bundle/characterization_handoff_bundle.json \
            --output materials-data-analyzer/outputs/real-data-mvp-acceptance

      - name: Verify real-data MVP closeout boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("materials-data-analyzer/outputs/real-data-mvp-acceptance")
          suite = json.loads((root / "real_data_episode_suite_acceptance.json").read_text(encoding="utf-8"))
          closeout = json.loads((root / "autonomous_research_scientist_mvp_closeout.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "autonomous_research_scientist_mvp_manifest.json").read_text(encoding="utf-8"))

          assert suite["mvp_acceptance_passed"] is True
          assert suite["episode_count"] == 3
          assert suite["valid_episode_count"] == 3
          assert suite["full_cycle_count"] == 3
          assert suite["bounded_blocked_count"] == 0
          assert suite["full_cycle_family_count"] == 3
          assert suite["full_cycle_modality_count"] == 3
          assert suite["full_cycle_evidence_class_count"] == 3
          assert suite["materially_different_full_cycles"] is True
          assert suite["scientific_status_changed"] is False
          assert suite["execution_authorized_here"] is False
          assert suite["human_review_synthesized_here"] is False
          assert all(item["mvp_full_cycle_complete"] is True for item in suite["evaluations"])
          assert all(item["false_scientific_promotion_detected"] is False for item in suite["evaluations"])

          assert closeout["status"] == "bounded_autonomous_research_scientist_mvp_complete"
          assert closeout["mvp_completion_issue"] == 165
          assert closeout["mvp_acceptance_passed"] is True
          assert closeout["qualifying_full_cycle_count"] == 3
          assert closeout["remaining_empirical_issues"] == [76]
          assert closeout["issue_76_satisfied"] is False
          assert closeout["scientific_hypothesis_verified"] is False
          assert closeout["scientific_status_changed"] is False
          assert closeout["unsupported_scientific_promotion_performed"] is False
          assert closeout["physical_experiment_execution_authorized"] is False
          assert closeout["second_executor_introduced"] is False
          assert closeout["human_review_synthesized"] is False

          for relative, expected in manifest["artifacts"].items():
              path = root / relative
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          PY

      - name: Run focused acceptance regressions
        working-directory: materials-data-analyzer
        run: |
          python -m pytest -q \
            tests/test_real_data_episode_acceptance.py \
            tests/test_phase_a_e_acceptance.py \
            tests/test_representative_process_characterization_workflow.py

      - name: Upload bounded MVP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-data-autonomous-research-mvp
          path: |
            materials-data-analyzer/outputs/real-data-mvp-nist/representative_workflow_summary.json
            materials-data-analyzer/outputs/real-data-mvp-nist/representative_workflow_manifest.json
            materials-data-analyzer/outputs/real-data-mvp-rwgs-consumer/cross_repository_handoff_summary.json
            materials-data-analyzer/outputs/real-data-mvp-rwgs-consumer/cross_repository_handoff_manifest.json
            materials-data-analyzer/outputs/real-data-mvp-rwgs-consumer/integrated_sample_table.csv
            materials-data-analyzer/outputs/real-data-mvp-acceptance/
            materials-characterization-analyzer/outputs/real-data-mvp-rwgs/handoff-validation/
          if-no-files-found: error
          retention-days: 30
