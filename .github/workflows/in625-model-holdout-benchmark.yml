name: IN625 AM-Bench calibration holdout benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/in625-model-holdout-benchmark.yml"
      - "scripts/run_in625_model_holdout_benchmark.py"
      - "src/materials_data_analyzer/research_loop/in625_model_holdout_benchmark.py"
      - "tests/test_in625_model_holdout_benchmark.py"
      - "data/case_studies/nist_ambench_2018_02/source_process_conditions.csv"
      - "data/case_studies/nist_ambench_2018_02/source_melt_pool_measurements.csv"

permissions:
  contents: read

jobs:
  calibration-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt

      - name: Freeze Case-B calibration / A-C holdout contract
        run: |
          mkdir -p outputs/in625-model-holdout
          python scripts/run_in625_model_holdout_benchmark.py freeze-contract \
            --repository-root . \
            --output outputs/in625-model-holdout/contract.json \
            | tee outputs/in625-model-holdout/contract_summary.json
          echo "CONTRACT_FILE_SHA256=$(sha256sum outputs/in625-model-holdout/contract.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "CONTRACT_OBJECT_SHA256=$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-model-holdout/contract.json", encoding="utf-8"))))')" >> "$GITHUB_ENV"

      - name: Freeze calibration-only smoke baseline before holdout reveal
        run: |
          python scripts/run_in625_model_holdout_benchmark.py freeze-baseline \
            --contract outputs/in625-model-holdout/contract.json \
            --contract-file-sha256 "$CONTRACT_FILE_SHA256" \
            --contract-object-sha256 "$CONTRACT_OBJECT_SHA256" \
            --output outputs/in625-model-holdout/prediction.json \
            | tee outputs/in625-model-holdout/prediction_summary.json
          echo "PREDICTION_FILE_SHA256=$(sha256sum outputs/in625-model-holdout/prediction.json | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PREDICTION_OBJECT_SHA256=$(python -c 'import json; from materials_data_analyzer.research_loop.evidence_packet import canonical_sha256; print(canonical_sha256(json.load(open("outputs/in625-model-holdout/prediction.json", encoding="utf-8"))))')" >> "$GITHUB_ENV"

      - name: Reveal A-C measurements only after prediction freeze and score holdout
        run: |
          python scripts/run_in625_model_holdout_benchmark.py evaluate \
            --repository-root . \
            --contract outputs/in625-model-holdout/contract.json \
            --contract-file-sha256 "$CONTRACT_FILE_SHA256" \
            --contract-object-sha256 "$CONTRACT_OBJECT_SHA256" \
            --prediction outputs/in625-model-holdout/prediction.json \
            --prediction-file-sha256 "$PREDICTION_FILE_SHA256" \
            --prediction-object-sha256 "$PREDICTION_OBJECT_SHA256" \
            --output outputs/in625-model-holdout/evaluation.json \
            | tee outputs/in625-model-holdout/evaluation_summary.json

      - name: Verify baseline is diagnostic-only and holdout remains honest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/in625-model-holdout")
          contract = json.loads((root / "contract.json").read_text(encoding="utf-8"))
          prediction = json.loads((root / "prediction.json").read_text(encoding="utf-8"))
          evaluation = json.loads((root / "evaluation.json").read_text(encoding="utf-8"))

          assert contract["partition"]["calibration_case_ids"] == ["B"]
          assert contract["partition"]["holdout_case_ids"] == ["A", "C"]
          assert contract["partition"]["holdout_response_values_exposed_in_contract"] is False
          assert prediction["model"]["model_class"] == "diagnostic_persistence_baseline_not_physics"
          assert prediction["calibration_provenance"]["response_case_ids_used_for_fit"] == ["B"]
          assert prediction["calibration_provenance"]["holdout_response_values_consumed_before_prediction_freeze"] is False
          assert evaluation["aggregate_holdout_metrics"]["calibration_case_included"] is False
          assert evaluation["aggregate_holdout_metrics"]["width_mae_um"] > 0
          assert evaluation["aggregate_holdout_metrics"]["depth_mae_um"] > 0
          assert evaluation["scientific_boundary"]["scientific_status_promoted"] is False
          assert evaluation["scientific_boundary"]["causal_validity_established"] is False
          print(json.dumps({
              "contract_sha256": contract["contract_sha256"],
              "prediction_sha256": prediction["prediction_sha256"],
              "evaluation_sha256": evaluation["evaluation_sha256"],
              "width_mae_um": evaluation["aggregate_holdout_metrics"]["width_mae_um"],
              "depth_mae_um": evaluation["aggregate_holdout_metrics"]["depth_mae_um"],
          }, sort_keys=True))
          PY

      - name: Focused leakage regressions
        run: python -m pytest tests/test_in625_model_holdout_benchmark.py -q

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: in625-ambench-calibration-holdout-benchmark
          path: outputs/in625-model-holdout/**
          if-no-files-found: error
          retention-days: 30
