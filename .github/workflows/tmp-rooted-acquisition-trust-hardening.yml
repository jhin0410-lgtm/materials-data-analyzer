name: Temporary rooted acquisition trust hardening gate

on:
  push:
    branches:
      - agent/rooted-acquisition-trust-hardening-20260816

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rooted-acquisition-trust-hardening-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run rooted acquisition provenance gate
        run: |
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/mission_source_trust_root_binding.py \
            tests/test_mission_source_trust_root_binding.py
          python -m pytest -q \
            tests/test_mission_source_trust_root_binding.py \
            tests/test_acquisition_source_trust_policy.py \
            tests/test_acquisition_record_binding.py \
            tests/test_research_program_source_trust_policy_pins.py \
            tests/test_research_program_exact_file_binding_toctou.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/mission_source_trust_root_binding.py \
            tests/test_mission_source_trust_root_binding.py
      - name: Commit verified formatting
        run: |
          git add \
            src/materials_data_analyzer/research_loop/mission_source_trust_root_binding.py \
            tests/test_mission_source_trust_root_binding.py
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Format rooted acquisition trust regressions"
          git push origin HEAD:agent/rooted-acquisition-trust-hardening-20260816
