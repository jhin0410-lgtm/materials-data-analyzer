name: Temporary PR128 public surface gate

on:
  push:
    branches:
      - agent/authenticated-transition-consumer-20260815

permissions:
  contents: write

jobs:
  public-surface:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/authenticated-transition-consumer-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply public surface patch
        run: |
          python scripts/tmp_pr128_public_surface.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Public surface regression gate
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/__init__.py \
            src/materials_data_analyzer/research_program_cli.py \
            tests/test_authenticated_transition_consumer_cli.py
          python -m pytest -q \
            tests/test_authenticated_transition_consumer.py \
            tests/test_authenticated_transition_consumer_cli.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_inference_binding.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/authenticated_transition_consumer.py \
            src/materials_data_analyzer/research_loop/__init__.py \
            src/materials_data_analyzer/research_program_cli.py \
            tests/test_authenticated_transition_consumer.py \
            tests/test_authenticated_transition_consumer_cli.py
          PYTHONPATH=src python -m materials_data_analyzer.research_program_cli authenticate-transition-bundle --help
      - name: Commit verified public surface
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/__init__.py \
            src/materials_data_analyzer/research_program_cli.py \
            docs/AUTHENTICATED_TRANSITION_CONSUMER.md \
            tests/test_authenticated_transition_consumer_cli.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Expose independent authenticated transition consumer'
          git push origin HEAD:agent/authenticated-transition-consumer-20260815
