name: One-shot public transport P2 patch

on:
  push:
    branches:
      - fix/public-acquisition-transport-errors-20260824
    paths:
      - ".github/workflows/one-shot-public-transport-p2.yml"
      - "scripts/maintenance/apply_public_transport_p2_patch.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/public-acquisition-transport-errors-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Apply exact P2 patch
        run: python scripts/maintenance/apply_public_transport_p2_patch.py
      - name: Run focused acquisition tests
        run: >-
          python -m pytest -q
          tests/test_public_data_acquisition.py
          tests/test_public_data_acquisition_transport_errors.py
      - name: Run lint
        run: >-
          python -m ruff check
          src/materials_data_analyzer/research_loop/public_data_acquisition.py
          tests/test_public_data_acquisition_transport_errors.py
      - name: Commit verified source patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/materials_data_analyzer/research_loop/public_data_acquisition.py
          git diff --cached --quiet && exit 0
          git commit -m "Narrow transient public acquisition failures"
          git push origin HEAD:fix/public-acquisition-transport-errors-20260824
