name: Temporary input evidence origin request gate

on:
  push:
    branches:
      - agent/input-evidence-origin-request-dev-20260815

jobs:
  focused-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run input evidence origin request regressions
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/input_evidence_origin_request.py \
            tests/test_input_evidence_origin_request.py
          python -m pytest -q \
            tests/test_input_evidence_origin_request.py \
            tests/test_program_evidence_origin_binding.py \
            tests/test_evidence_origin_binding.py \
            tests/test_research_program.py \
            tests/test_epistemic_transition.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/input_evidence_origin_request.py \
            tests/test_input_evidence_origin_request.py
