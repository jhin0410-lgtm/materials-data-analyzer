name: Temporary program evidence origin binding gate

on:
  push:
    branches:
      - agent/program-evidence-origin-binding-20260815

jobs:
  focused-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run provenance bridge regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_program_evidence_origin_binding.py \
            tests/test_evidence_origin_binding.py \
            tests/test_epistemic_transition.py \
            tests/test_epistemic_graph.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/program_evidence_origin_binding.py \
            tests/test_program_evidence_origin_binding.py
