name: Temporary authenticated graph-chain closure

on:
  push:
    branches:
      - agent/authenticated-inference-provenance-20260815
    paths:
      - .github/workflows/_tmp_close_authenticated_graph_chain.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/authenticated-inference-provenance-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply authenticated graph-chain closure
        run: |
          python scripts/_tmp_close_authenticated_graph_chain.py
          python scripts/_tmp_fix_authenticated_graph_chain_gate.py
          python - <<'PY'
          from pathlib import Path
          for name in (
              'tests/test_authenticated_epistemic_transition.py',
              'tests/test_authenticated_epistemic_transition_merge_gate.py',
              'tests/test_authenticated_epistemic_transition_inherited_portability.py',
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python -m py_compile src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py
          python -m py_compile tests/test_authenticated_epistemic_transition.py
          python -m py_compile tests/test_authenticated_epistemic_transition_merge_gate.py
          python -m py_compile tests/test_authenticated_epistemic_transition_inherited_portability.py
          git diff --check
      - name: Run focused graph-chain gate
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_merge_gate.py \
            tests/test_authenticated_epistemic_transition_inherited_portability.py
          python -m pytest -q \
            tests/test_authenticated_inference_binding.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_inherited_portability.py \
            tests/test_authenticated_epistemic_transition_merge_gate.py \
            tests/test_authenticated_epistemic_transition_lineage_identity.py \
            tests/test_authenticated_epistemic_transition_construction_contract.py \
            tests/test_authenticated_transition_legacy_critic_compatibility.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_merge_gate.py \
            tests/test_authenticated_epistemic_transition_inherited_portability.py
          git diff --check
      - name: Commit graph-chain closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_merge_gate.py \
            tests/test_authenticated_epistemic_transition_inherited_portability.py \
            docs/AUTHENTICATED_EPISTEMIC_TRANSITION.md
          git diff --cached --quiet && exit 1
          git commit -m 'Close authenticated graph replay chain'
          git push origin HEAD:agent/authenticated-inference-provenance-20260815
