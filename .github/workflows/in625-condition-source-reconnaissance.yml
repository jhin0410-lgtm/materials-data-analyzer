name: IN625 geometry condition source reconnaissance

on:
  push:
    branches:
      - feature/multisource-geometry-condition-mapping-220
    paths:
      - ".github/workflows/in625-condition-source-reconnaissance.yml"
      - "configs/research/in625_geometry_condition_source_reconnaissance.v1.json"
      - "scripts/recon_in625_geometry_condition_sources.py"
  pull_request:
    paths:
      - ".github/workflows/in625-condition-source-reconnaissance.yml"
      - "configs/research/in625_geometry_condition_source_reconnaissance.v1.json"
      - "scripts/recon_in625_geometry_condition_sources.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source-reconnaissance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install bounded PDF text reconnaissance dependency
        run: python -m pip install "pypdf>=5,<7"
      - name: Acquire exact official sources and verify semantic anchors
        run: >-
          python scripts/recon_in625_geometry_condition_sources.py
          --config configs/research/in625_geometry_condition_source_reconnaissance.v1.json
          --output outputs/in625-condition-source-recon/source-reconnaissance.json
      - name: Enforce reconnaissance boundary
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("outputs/in625-condition-source-recon/source-reconnaissance.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["source_count"] == 8
          assert result["all_sources_fetched"] is True
          assert result["all_claim_anchors_matched"] is True
          assert result["unrestricted_search_performed"] is False
          assert result["arbitrary_url_fetch_performed"] is False
          assert result["source_bytes_persisted"] is False
          assert result["paper_claims_promoted_to_row_level_authority"] is False
          assert result["scientific_status_changed"] is False
          by_id = {item["source_id"]: item for item in result["sources"]}
          assert by_id["lane-2020-melt-pool-geometry"]["media_type"] == "pdf"
          assert by_id["naderi-2022-scaling-fidelity"]["media_type"] == "pdf"
          assert by_id["weaver-2021-spot-size-scaling-metadata"]["media_type"] == "html"
          assert by_id["weaver-2021-spot-size-scaling-metadata"]["row_level_measurement_authority"] is False
          assert all(item["source_size_bytes"] > 0 for item in result["sources"])
          assert all(len(item["source_sha256"]) == 64 for item in result["sources"])
      - name: Upload provenance-only reconnaissance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: in625-condition-source-reconnaissance
          path: outputs/in625-condition-source-recon/source-reconnaissance.json
          if-no-files-found: warn
          retention-days: 30
