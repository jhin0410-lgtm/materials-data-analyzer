name: Temporary PR127 nested binding closure gate

on:
  push:
    branches:
      - agent/authenticated-inference-provenance-20260815

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/authenticated-inference-provenance-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply nested binding closure
        run: |
          if grep -q '^def _validated_lineage_artifact_fields' src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py; then
            echo 'Nested closure already applied.'
          else
            python scripts/tmp_pr127_nested_binding_closure.py
          fi
          git diff --check
      - name: Install focused tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run focused provenance gate
        run: |
          set -euo pipefail
          python -m ruff check --fix tests/test_authenticated_epistemic_transition_nested_binding_contract.py
          python -m pytest -q \
            tests/test_authenticated_epistemic_transition_nested_binding_contract.py \
            tests/test_authenticated_epistemic_transition_final_review_regressions.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_inherited_portability.py \
            tests/test_authenticated_epistemic_transition_lineage_identity.py \
            tests/test_authenticated_epistemic_transition_merge_gate.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_nested_binding_contract.py
      - name: Commit verified closure
        run: |
          set -euo pipefail
          git add src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_nested_binding_contract.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Reject unknown nested lineage artifact claims'
          git push origin HEAD:agent/authenticated-inference-provenance-20260815
