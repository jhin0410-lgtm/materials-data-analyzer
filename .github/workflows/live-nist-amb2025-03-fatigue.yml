name: Live NIST AMB2025-03 fatigue generalization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-nist-amb2025-03-fatigue.yml"
      - "configs/research/post_mvp_real_data_generalization_frontier.v1.json"
      - "scripts/audit_live_nist_amb2025_03_fatigue.py"
      - "src/materials_data_analyzer/public_acquisition_cli.py"
      - "src/materials_data_analyzer/research_loop/frontier_acquisition.py"
      - "src/materials_data_analyzer/research_loop/nist_amb2025_03_answer_audit.py"
      - "src/materials_data_analyzer/research_loop/nist_amb2025_03_fatigue_intake.py"
      - "src/materials_data_analyzer/research_loop/nist_amb2025_03_metadata_contract.py"
      - "src/materials_data_analyzer/research_loop/nist_pdr_acquisition.py"
      - "src/materials_data_analyzer/research_loop/public_data_acquisition.py"
      - "tests/test_nist_amb2025_03_answer_audit.py"
      - "tests/test_nist_amb2025_03_fatigue_intake.py"
      - "tests/test_nist_amb2025_03_metadata_contract.py"
      - "tests/test_post_mvp_generalization_frontier.py"
      - "tests/test_nist_pdr_acquisition.py"
      - "tests/test_nist_pdr_nerdm_compatibility.py"
      - "tests/test_public_data_acquisition.py"

permissions:
  contents: read

jobs:
  acquire-fatigue-calibration-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and focused regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt

      - name: Run deterministic acquisition and fatigue-intake regressions
        run: |
          python -m pytest -q \
            tests/test_nist_amb2025_03_answer_audit.py \
            tests/test_nist_amb2025_03_fatigue_intake.py \
            tests/test_nist_amb2025_03_metadata_contract.py \
            tests/test_post_mvp_generalization_frontier.py \
            tests/test_nist_pdr_acquisition.py \
            tests/test_nist_pdr_nerdm_compatibility.py \
            tests/test_public_data_acquisition.py

      - name: Acquire checksum-bound NIST fatigue calibration evidence
        run: |
          mkdir -p outputs/nist-amb2025-03
          python -m materials_data_analyzer.public_acquisition_cli \
            --frontier configs/research/post_mvp_real_data_generalization_frontier.v1.json \
            --candidate-id nist-amb2025-03-ti64-fatigue \
            --output-root outputs/nist-amb2025-03/packages \
            --timeout-seconds 180 \
            --max-auto-mib 16 \
            | tee outputs/nist-amb2025-03/frontier_acquisition_report.json

      - name: Verify exact-byte acquisition and no scientific promotion
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/nist-amb2025-03")
          report = json.loads((root / "frontier_acquisition_report.json").read_text(encoding="utf-8"))
          acquisition = report["acquisition"]

          assert report["scientific_status_changed"] is False
          assert report["requires_scientific_intake"] is True
          assert acquisition["automatic_execution_attempted"] == 12
          assert acquisition["automatic_execution_succeeded"] == 12
          assert acquisition["automatic_execution_failed"] == 0
          assert acquisition["all_auto_succeeded"] is True
          assert acquisition["human_review_required"] == []
          assert acquisition["blocked"] == []

          expected_paths = {
              "calibration_data/build_and_powder_details/readme.txt",
              "calibration_data/fatigue_testing/fatigue_800hip.xlsx",
              "calibration_data/fatigue_testing/readme.txt",
              "calibration_data/heat_treatment/AMBench2025_PostProcessing_PBFL_Ti6Al4V.xlsx",
              "calibration_data/heat_treatment/readme.txt",
              "calibration_data/profilometry/profilometry.xlsx",
              "calibration_data/profilometry/readme.txt",
              "calibration_data/solid_chemistry/solid_chemistry.xlsx",
              "calibration_data/solid_chemistry/readme.txt",
              "calibration_data/tensile_testing/tensile_properties.xlsx",
              "calibration_data/tensile_testing/readme.txt",
              "calibration_data/x-ray_diffraction/readme.txt",
          }
          receipts = acquisition["receipts"]
          assert {item["artifact_path"] for item in receipts} == expected_paths
          for receipt in receipts:
              assert receipt["scientific_status_changed"] is False
              assert receipt["requires_scientific_intake"] is True
              assert receipt["recorded_acquisition_provenance_authenticated"] is True
              package = Path(receipt["package_directory"])
              artifact = package / receipt["artifact_path"]
              body = artifact.read_bytes()
              assert len(body) == receipt["artifact_size_bytes"]
              assert hashlib.sha256(body).hexdigest() == receipt["artifact_sha256"]
          PY

      - name: Build compact acquisition inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/nist-amb2025-03")
          report = json.loads((root / "frontier_acquisition_report.json").read_text(encoding="utf-8"))
          receipts = report["acquisition"]["receipts"]
          inventory = {
              "dataset": "NIST AMB2025-03",
              "doi": "10.18434/mds2-3734",
              "candidate_id": "nist-amb2025-03-ti64-fatigue",
              "acquired_file_count": len(receipts),
              "files": [
                  {
                      "path": item["artifact_path"],
                      "sha256": item["artifact_sha256"],
                      "size_bytes": item["artifact_size_bytes"],
                      "provenance_authenticated": item["recorded_acquisition_provenance_authenticated"],
                  }
                  for item in receipts
              ],
              "scientific_status_changed": False,
              "requires_scientific_intake": True,
              "fatigue_model_fitted": False,
              "runout_censoring_audited": False,
              "independent_build_replication_established": False,
          }
          (root / "acquisition_inventory.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit exact fatigue rows and execute bounded second-pass evidence audit
        run: |
          python scripts/audit_live_nist_amb2025_03_fatigue.py \
            --acquisition-root outputs/nist-amb2025-03 \
            --output outputs/nist-amb2025-03/intake

      - name: Verify exact live fatigue research-cycle snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/nist-amb2025-03/intake")
          summary = json.loads((root / "fatigue_scientific_intake_summary.json").read_text(encoding="utf-8"))
          report = json.loads((root / "fatigue_scientific_intake_report.json").read_text(encoding="utf-8"))
          reanalysis = json.loads((root / "fatigue_second_pass_reanalysis.json").read_text(encoding="utf-8"))
          sequence = json.loads((root / "fatigue_episode_sequence.json").read_text(encoding="utf-8"))

          assert summary["source_version"] == "1.1.1"
          assert summary["metadata_sha256"] == "77afc27dbb8b853191064cca3833fa25021bcab6b7640561a854bfb937ad7761"
          assert summary["workbook_sha256"] == "4686e0f4cd082790de24a19142595d24cb8d6e413d0dbba5426cc7d45b179e44"
          assert summary["one_build_declared"] is True
          assert summary["post_build_conditions"] == ["800HIP", "800VAC"]
          assert summary["test_rows"] == 24
          assert summary["valid_failure_or_runout_specimens"] == 23
          assert summary["observed_failures"] == 14
          assert summary["runouts"] == 9
          assert summary["invalid_tests"] == 1
          assert summary["exact_integer_censor_cycles_from_notes"] == 8
          assert summary["million_shorthand_rows_requiring_semantic_review"] == 1
          assert summary["cycles_column_vs_exact_note_discrepancy_count"] == 5
          assert summary["naive_uncensored_cycles_regression_eligible"] is False
          assert summary["condition_specific_censored_sn_analysis_eligible"] is False
          assert summary["both_condition_answer_datafile_discovered"] is True
          assert summary["both_condition_answer_source_sha256_bound"] is False
          assert summary["full_bounded_research_cycle_completed"] is True
          assert summary["scientific_support_established"] is False
          assert summary["scientific_status_changed"] is False

          inventory = report["fatigue_inventory"]
          assert inventory["unique_source_specimens"] == 24
          assert inventory["desired_load_formula_cell_count"] == 7
          assert inventory["diameter_source_storage_counts"] == {
              "numeric_cell": 20,
              "text_decimal_cell": 4,
          }
          assert inventory["stress_level_summary"]["925"] == {
              "specimens": 3, "failures": 0, "runouts": 3, "invalid": 0, "review_required": 0
          }
          assert inventory["stress_level_summary"]["937"] == {
              "specimens": 4, "failures": 2, "runouts": 2, "invalid": 0, "review_required": 0
          }
          assert inventory["stress_level_summary"]["1050"] == {
              "specimens": 4, "failures": 3, "runouts": 0, "invalid": 1, "review_required": 0
          }
          assert report["source_scope_contract"]["one_build_declared"] is True
          assert report["source_scope_contract"]["vac_fatigue_calibration_data_declared"] is False
          assert report["source_method_semantics"]["build_replication_established"] is False
          assert report["analysis_eligibility"]["hip_vs_vac_fatigue_treatment_comparison"]["eligible"] is False
          assert report["analysis_eligibility"]["build_generalized_treatment_effect"]["eligible"] is False
          assert report["bounded_next_action"]["action_type"] == "runout_censor_semantics_audit"

          runout_reaudit = reanalysis["runout_censor_reanalysis"]
          assert runout_reaudit["source_note"] == "10M runout"
          assert runout_reaudit["exact_10m_definition_found_in_acquired_fatigue_readme"] is False
          assert runout_reaudit["censor_cycles_exact_after"] is None
          assert runout_reaudit["resolution_status"] == "unresolved_without_inference"

          answer = reanalysis["adjacent_answer_data_provenance_audit"]
          assert answer["answer_artifact"]["filepath"] == "answers_data/fatigue_both_conditions.xlsx"
          assert answer["answer_artifact"]["size_bytes"] == 25018
          assert answer["answer_artifact"]["public_datafile_discovered"] is True
          assert answer["answer_artifact"]["source_checksum"] is None
          assert answer["answer_artifact"]["source_sha256_bound"] is False
          assert answer["automatic_acquisition_eligible"] is False
          assert answer["automatic_acquisition_decision"] == "REVIEW_REQUIRED_SOURCE_INTEGRITY"
          assert answer["bounded_stop"] is True
          assert answer["scientific_status_changed"] is False

          assert sequence["next_action_type"] == "runout_censor_semantics_audit"
          assert sequence["persisted_reanalysis_sha256"] == reanalysis["reanalysis_sha256"]
          assert sequence["bounded_stop"] is True
          assert sequence["future_followups_kept_unexecuted"] is True
          assert sequence["full_bounded_research_cycle_completed"] is True
          assert sequence["scientific_status_changed"] is False
          PY

      - name: Upload exact acquisition and scientific-intake evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nist-amb2025-03-fatigue-acquisition
          path: |
            outputs/nist-amb2025-03/frontier_acquisition_report.json
            outputs/nist-amb2025-03/acquisition_inventory.json
            outputs/nist-amb2025-03/packages/
            outputs/nist-amb2025-03/intake/*.json
          if-no-files-found: warn
          retention-days: 30
