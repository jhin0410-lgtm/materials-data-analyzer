name: Live NIST AMB2025-03 fatigue generalization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-nist-amb2025-03-fatigue.yml"
      - "configs/research/post_mvp_real_data_generalization_frontier.v1.json"
      - "src/materials_data_analyzer/public_acquisition_cli.py"
      - "src/materials_data_analyzer/research_loop/frontier_acquisition.py"
      - "src/materials_data_analyzer/research_loop/nist_pdr_acquisition.py"
      - "src/materials_data_analyzer/research_loop/public_data_acquisition.py"
      - "tests/test_post_mvp_generalization_frontier.py"
      - "tests/test_nist_pdr_acquisition.py"
      - "tests/test_nist_pdr_nerdm_compatibility.py"
      - "tests/test_public_data_acquisition.py"

permissions:
  contents: read

jobs:
  acquire-fatigue-calibration-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and focused regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt

      - name: Run deterministic acquisition and frontier regressions
        run: |
          python -m pytest -q \
            tests/test_post_mvp_generalization_frontier.py \
            tests/test_nist_pdr_acquisition.py \
            tests/test_nist_pdr_nerdm_compatibility.py \
            tests/test_public_data_acquisition.py

      - name: Acquire checksum-bound NIST fatigue calibration evidence
        run: |
          mkdir -p outputs/nist-amb2025-03
          python -m materials_data_analyzer.public_acquisition_cli \
            --frontier configs/research/post_mvp_real_data_generalization_frontier.v1.json \
            --candidate-id nist-amb2025-03-ti64-fatigue \
            --output-root outputs/nist-amb2025-03/packages \
            --timeout-seconds 180 \
            --max-auto-mib 16 \
            | tee outputs/nist-amb2025-03/frontier_acquisition_report.json

      - name: Verify exact-byte acquisition and no scientific promotion
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/nist-amb2025-03")
          report = json.loads((root / "frontier_acquisition_report.json").read_text(encoding="utf-8"))
          acquisition = report["acquisition"]

          assert report["scientific_status_changed"] is False
          assert report["requires_scientific_intake"] is True
          assert acquisition["automatic_execution_attempted"] == 12
          assert acquisition["automatic_execution_succeeded"] == 12
          assert acquisition["automatic_execution_failed"] == 0
          assert acquisition["all_auto_succeeded"] is True
          assert acquisition["human_review_required"] == []
          assert acquisition["blocked"] == []

          expected_paths = {
              "calibration_data/build_and_powder_details/readme.txt",
              "calibration_data/fatigue_testing/fatigue_800hip.xlsx",
              "calibration_data/fatigue_testing/readme.txt",
              "calibration_data/heat_treatment/AMBench2025_PostProcessing_PBFL_Ti6Al4V.xlsx",
              "calibration_data/heat_treatment/readme.txt",
              "calibration_data/profilometry/profilometry.xlsx",
              "calibration_data/profilometry/readme.txt",
              "calibration_data/solid_chemistry/solid_chemistry.xlsx",
              "calibration_data/solid_chemistry/readme.txt",
              "calibration_data/tensile_testing/tensile_properties.xlsx",
              "calibration_data/tensile_testing/readme.txt",
              "calibration_data/x-ray_diffraction/readme.txt",
          }
          receipts = acquisition["receipts"]
          assert {item["artifact_path"] for item in receipts} == expected_paths
          for receipt in receipts:
              assert receipt["scientific_status_changed"] is False
              assert receipt["requires_scientific_intake"] is True
              assert receipt["recorded_acquisition_provenance_authenticated"] is True
              package = Path(receipt["package_directory"])
              artifact = package / receipt["artifact_path"]
              body = artifact.read_bytes()
              assert len(body) == receipt["artifact_size_bytes"]
              assert hashlib.sha256(body).hexdigest() == receipt["artifact_sha256"]
          PY

      - name: Build compact acquisition inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/nist-amb2025-03")
          report = json.loads((root / "frontier_acquisition_report.json").read_text(encoding="utf-8"))
          receipts = report["acquisition"]["receipts"]
          inventory = {
              "dataset": "NIST AMB2025-03",
              "doi": "10.18434/mds2-3734",
              "candidate_id": "nist-amb2025-03-ti64-fatigue",
              "acquired_file_count": len(receipts),
              "files": [
                  {
                      "path": item["artifact_path"],
                      "sha256": item["artifact_sha256"],
                      "size_bytes": item["artifact_size_bytes"],
                      "provenance_authenticated": item["recorded_acquisition_provenance_authenticated"],
                  }
                  for item in receipts
              ],
              "scientific_status_changed": False,
              "requires_scientific_intake": True,
              "fatigue_model_fitted": False,
              "runout_censoring_audited": False,
              "independent_build_replication_established": False,
          }
          (root / "acquisition_inventory.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact acquisition packages for scientific intake
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nist-amb2025-03-fatigue-acquisition
          path: |
            outputs/nist-amb2025-03/frontier_acquisition_report.json
            outputs/nist-amb2025-03/acquisition_inventory.json
            outputs/nist-amb2025-03/packages/
          if-no-files-found: warn
          retention-days: 30
