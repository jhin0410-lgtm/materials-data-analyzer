name: IN625 authorized network and row intake

on:
  push:
    branches:
      - feature/in625-authorized-network-row-intake-211
    paths:
      - ".github/workflows/in625-authorized-network-row-intake.yml"
      - "configs/research/in625_zenodo_20503603_verified_source.v1.json"
      - "configs/research/in625_external_evidence_action_registry.v1.json"
      - "configs/research/in625_tensile_reviewed_intake.v1.json"
      - "src/materials_data_analyzer/research_loop/in625_archive_network_acquisition.py"
      - "src/materials_data_analyzer/research_loop/in625_tensile_reviewed_intake.py"
      - "src/materials_data_analyzer/research_loop/in625_post_acquisition_rediagnosis.py"
      - "src/materials_data_analyzer/research_loop/in625_external_evidence_action.py"
      - "src/materials_data_analyzer/research_loop/in625_execution_verifier.py"
      - "src/materials_data_analyzer/research_loop/in625_execution_planning.py"
      - "src/materials_data_analyzer/research_loop/in625_authorized_execution.py"
      - "tests/test_in625_archive_network_acquisition.py"
      - "tests/test_in625_tensile_reviewed_intake.py"
      - "tests/test_in625_post_acquisition_rediagnosis.py"
      - "tests/test_in625_external_evidence_typed_execution.py"
      - "tests/test_public_recursive_in625_external_evidence.py"
  pull_request:
    paths:
      - ".github/workflows/in625-authorized-network-row-intake.yml"
      - "configs/research/in625_zenodo_20503603_verified_source.v1.json"
      - "configs/research/in625_external_evidence_action_registry.v1.json"
      - "configs/research/in625_tensile_reviewed_intake.v1.json"
      - "src/materials_data_analyzer/research_loop/in625_archive_network_acquisition.py"
      - "src/materials_data_analyzer/research_loop/in625_tensile_reviewed_intake.py"
      - "src/materials_data_analyzer/research_loop/in625_post_acquisition_rediagnosis.py"
      - "src/materials_data_analyzer/research_loop/in625_external_evidence_action.py"
      - "src/materials_data_analyzer/research_loop/in625_execution_verifier.py"
      - "src/materials_data_analyzer/research_loop/in625_execution_planning.py"
      - "src/materials_data_analyzer/research_loop/in625_authorized_execution.py"
      - "tests/test_in625_archive_network_acquisition.py"
      - "tests/test_in625_tensile_reviewed_intake.py"
      - "tests/test_in625_post_acquisition_rediagnosis.py"
      - "tests/test_in625_external_evidence_typed_execution.py"
      - "tests/test_public_recursive_in625_external_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-live-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository development environment
        run: python -m pip install -e ".[dev]"
      - name: Run fail-closed focused acceptance tests before network access
        run: >-
          python -m pytest -q
          tests/test_in625_archive_network_acquisition.py
          tests/test_in625_tensile_reviewed_intake.py
          tests/test_in625_post_acquisition_rediagnosis.py
          tests/test_in625_external_evidence_typed_execution.py
          tests/test_public_recursive_in625_external_evidence.py
      - name: Authorize archive, acquire exact bytes, register, review tensile rows, and re-diagnose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/in625-authorized-network-row-intake
          python - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          from materials_data_analyzer.research_loop.action_authorization import (
              assess_current_action_authorization,
          )
          from materials_data_analyzer.research_loop.action_registry import load_action_registry
          from materials_data_analyzer.research_loop.authorized_execution import execute_authorized_action
          from materials_data_analyzer.research_loop.in625_archive_network_acquisition import (
              build_in625_archive_network_authorization,
              execute_authorized_in625_archive_download,
          )
          from materials_data_analyzer.research_loop.in625_execution_verifier import (
              verify_in625_execution_handoff,
          )
          from materials_data_analyzer.research_loop.in625_post_acquisition_rediagnosis import (
              build_in625_post_acquisition_rediagnosis,
          )
          from materials_data_analyzer.research_loop.in625_tensile_reviewed_intake import (
              build_reviewed_in625_tensile_intake,
          )
          from materials_data_analyzer.research_loop.in625_zenodo_live_evidence import (
              build_verified_in625_zenodo_readme_manifest,
              inspect_verified_in625_dataset_archive,
          )
          from materials_data_analyzer.research_loop.kernel import (
              initialize_research_loop,
              load_research_state,
          )
          from materials_data_analyzer.research_loop.planning_adapter import plan_research_next_action

          repository_root = Path.cwd().resolve()
          root = (repository_root / "outputs/in625-authorized-network-row-intake").resolve()
          source_config_path = (
              repository_root / "configs/research/in625_zenodo_20503603_verified_source.v1.json"
          ).resolve()
          tensile_policy_path = (
              repository_root / "configs/research/in625_tensile_reviewed_intake.v1.json"
          ).resolve()
          registry_path = (
              repository_root / "configs/research/in625_external_evidence_action_registry.v1.json"
          ).resolve()

          def sha256_bytes(raw: bytes) -> str:
              return hashlib.sha256(raw).hexdigest()

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def write_json(path: Path, value: object) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(value, indent=2, ensure_ascii=False, sort_keys=True, allow_nan=False) + "\n",
                  encoding="utf-8",
              )

          def canonical_sha(value: object) -> str:
              return hashlib.sha256(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode("utf-8")
              ).hexdigest()

          def exact_zenodo_get(url: str, *, timeout: int = 60) -> bytes:
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme.lower() != "https" or (parsed.hostname or "").lower() != "zenodo.org":
                  raise SystemExit(f"pre-authorization metadata URL left exact Zenodo HTTPS host: {url}")
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "materials-data-analyzer/in625-preauthorization-metadata"},
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  final_url = response.geturl()
                  final = urllib.parse.urlparse(final_url)
                  if final.scheme.lower() != "https" or (final.hostname or "").lower() != "zenodo.org":
                      raise SystemExit(f"metadata redirect left exact Zenodo HTTPS host: {final_url}")
                  return response.read()

          config_bytes = source_config_path.read_bytes()
          config = json.loads(config_bytes.decode("utf-8"))
          record_id = str(config["zenodo"]["record_id"])
          metadata_url = f"https://zenodo.org/api/records/{record_id}"
          metadata_bytes = exact_zenodo_get(metadata_url)
          metadata = json.loads(metadata_bytes.decode("utf-8"))
          files = {item["key"]: item for item in metadata.get("files", [])}
          readme_name = config["zenodo"]["readme_file"]
          readme_url = files[readme_name]["links"]["self"]
          readme_bytes = exact_zenodo_get(readme_url)

          pre_manifest = build_verified_in625_zenodo_readme_manifest(
              config=config,
              metadata_bytes=metadata_bytes,
              readme_bytes=readme_bytes,
          )
          write_json(root / "source-readme-manifest.json", pre_manifest)
          (root / "record.json").write_bytes(metadata_bytes)
          (root / readme_name).write_bytes(readme_bytes)

          authorization = build_in625_archive_network_authorization(
              config=config,
              config_bytes=config_bytes,
              metadata_bytes=metadata_bytes,
              readme_bytes=readme_bytes,
          )
          if authorization["network_access_performed"] is not False:
              raise SystemExit("pre-download authorization may not claim that archive network access already occurred")
          authorization_path = root / "network-authorization.json"
          write_json(authorization_path, authorization)

          archive_name = config["zenodo"]["archive_file"]
          archive_path = root / archive_name
          receipt = execute_authorized_in625_archive_download(
              authorization=authorization,
              config=config,
              config_bytes=config_bytes,
              metadata_bytes=metadata_bytes,
              readme_bytes=readme_bytes,
              output_path=archive_path,
          )
          if Path(receipt["archive"]["path"]).resolve() != archive_path:
              raise SystemExit("network receipt archive path differs from the authorized output path")
          if receipt["archive"]["sha256"] != config["zenodo"]["files"][archive_name]["verified_sha256"]:
              raise SystemExit("network receipt lost the repository-pinned archive SHA-256")
          receipt_path = root / "network-acquisition-receipt.json"
          write_json(receipt_path, receipt)

          selected_root = root / "selected-source-files"
          archive_manifest = inspect_verified_in625_dataset_archive(
              config=config,
              archive_path=archive_path,
              selected_output_dir=selected_root,
          )
          if archive_manifest["archive"]["sha256_previously_pinned"] is not True:
              raise SystemExit("archive inspection did not preserve the pre-pinned SHA-256")
          write_json(root / "archive-manifest.json", archive_manifest)

          tensile_policy = json.loads(tensile_policy_path.read_text(encoding="utf-8"))
          workbook_member = PurePosixPath(tensile_policy["workbook"]["archive_member_path"])
          readme_member = PurePosixPath(tensile_policy["documentation"]["archive_member_path"])
          workbook_path = selected_root.joinpath(*workbook_member.parts)
          tensile_readme_path = selected_root.joinpath(*readme_member.parts)
          if not workbook_path.is_file() or not tensile_readme_path.is_file():
              # The source verifier extracts selected numerical files but not every documentation file.
              with zipfile.ZipFile(archive_path, "r") as archive:
                  for member, target in ((workbook_member, workbook_path), (readme_member, tensile_readme_path)):
                      info = archive.getinfo(member.as_posix())
                      if info.flag_bits & 0x1 or info.file_size > 64 * 1024 * 1024:
                          raise SystemExit(f"reviewed tensile source member is unsafe: {member}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      raw = archive.read(info)
                      if len(raw) != info.file_size:
                          raise SystemExit(f"reviewed tensile source member size drifted: {member}")
                      target.write_bytes(raw)
          if sha256_file(workbook_path) != tensile_policy["workbook"]["sha256"]:
              raise SystemExit("extracted tensile workbook differs from reviewed policy")
          if sha256_file(tensile_readme_path) != tensile_policy["documentation"]["sha256"]:
              raise SystemExit("extracted tensile README differs from reviewed policy")

          tensile_output = root / "reviewed-tensile"
          tensile_manifest = build_reviewed_in625_tensile_intake(
              workbook_path=workbook_path,
              readme_path=tensile_readme_path,
              policy_path=tensile_policy_path,
              output_dir=tensile_output,
          )
          if tensile_manifest["measurement_row_count"] != 200289:
              raise SystemExit("live reviewed tensile intake did not reproduce exactly 200,289 measurement rows")
          if tensile_manifest["parallel_test_block_count"] != 19:
              raise SystemExit("live reviewed tensile intake did not reproduce exactly 19 parallel-test blocks")
          if tensile_manifest["scientific_boundaries"]["direct_nist_condition_comparability_established"] is not False:
              raise SystemExit("reviewed tensile intake improperly promoted direct NIST comparability")

          objective_path = root / "typed-research-objective.json"
          write_json(
              objective_path,
              {
                  "schema_version": "1.0",
                  "research_id": "authorized-live-in625-external-evidence-20503603",
                  "question": "Can the exact authorized Zenodo 20503603 IN625 archive be registered and moved into reviewed row-level intake?",
                  "metrics": {
                      "primary": "external_source_provenance",
                      "secondary": ["archive_byte_integrity", "reviewed_row_level_measurement_availability"],
                  },
                  "constraints": [
                      "Archive network access requires the deterministic pre-download authorization certificate",
                      "No direct NIST condition-comparability claim",
                      "No empirical model-validation or hypothesis-truth promotion",
                  ],
                  "budget": {"maximum_actions": 2, "maximum_cost_units": 4},
                  "stop_rules": [
                      "Stop this acquisition action after one exact source registration or a fail-closed verifier rejection"
                  ],
              },
          )
          research_run = root / "typed-research-run"
          initialize_research_loop(objective_path, research_run)
          registry = load_action_registry(registry_path, repository_root=repository_root)
          request_path = root / "typed-execution-request.json"
          write_json(
              request_path,
              {
                  "schema_version": "1.0",
                  "action_id": "register-authorized-zenodo-20503603-in625",
                  "action_type": "external_evidence_search",
                  "action_version": "1.0",
                  "research_run": str(research_run),
                  "source_config": str(source_config_path),
                  "expected_source_config_sha256": sha256_file(source_config_path),
                  "archive_path": str(archive_path),
                  "expected_archive_sha256": receipt["archive"]["sha256"],
                  "registry": str(registry_path),
                  "repository_root": str(repository_root),
                  "expected_registry_sha256": registry["registry_sha256"],
              },
          )
          planning = plan_research_next_action(
              "in625-external-evidence",
              repository_root=repository_root,
              research_run=research_run,
              action_registry_path=registry_path,
          )
          if planning["selection_status"] != "ready_to_execute":
              raise SystemExit("IN625 typed planner did not expose the exact acquired source")
          typed_authorization = assess_current_action_authorization(
              "in625-external-evidence",
              repository_root=repository_root,
              research_run=research_run,
              action_registry_path=registry_path,
          )
          if typed_authorization["authorization_status"] != "ready_for_explicit_execution_request":
              raise SystemExit("IN625 typed registration did not pass its authorization boundary")
          handoff = verify_in625_execution_handoff(
              repository_root=repository_root,
              research_run=research_run,
              action_registry_path=registry_path,
              request_path=request_path,
          )
          if handoff["archive_sha256"] != receipt["archive"]["sha256"]:
              raise SystemExit("typed execution handoff archive differs from network receipt archive")
          execution = execute_authorized_action(
              "in625-external-evidence",
              repository_root=repository_root,
              research_run=research_run,
              action_registry_path=registry_path,
              request_path=request_path,
              expected_action_type=handoff["action_type"],
              expected_request_sha256=handoff["request_sha256"],
              expected_research_ledger_sha256=handoff["research_ledger_sha256"],
          )
          final_state = load_research_state(research_run)
          execution_with_request = dict(execution)
          execution_with_request["request_sha256"] = handoff["request_sha256"]

          rediagnosis = build_in625_post_acquisition_rediagnosis(
              network_authorization=authorization,
              network_receipt=receipt,
              typed_execution_result=execution_with_request,
              reviewed_tensile_manifest=tensile_manifest,
          )
          if rediagnosis["current_blocker"]["code"] != "cross_source_physical_comparability_not_established":
              raise SystemExit("post-acquisition diagnosis did not move to the physical-comparability blocker")
          if rediagnosis["stop_state"]["positive_scientific_closeout"] is not False:
              raise SystemExit("post-acquisition diagnosis improperly closed scientific validation")

          write_json(root / "typed-planning.json", planning)
          write_json(root / "typed-registration-authorization.json", typed_authorization)
          write_json(root / "typed-execution-handoff.json", handoff)
          write_json(root / "typed-execution-result.json", execution_with_request)
          write_json(root / "typed-research-state.json", final_state)
          write_json(root / "post-acquisition-rediagnosis.json", rediagnosis)

          chain = {
              "schema_version": "1.0",
              "source_id": authorization["source_id"],
              "archive_sha256": receipt["archive"]["sha256"],
              "network_authorization_sha256": authorization["authorization_sha256"],
              "network_receipt_sha256": receipt["receipt_sha256"],
              "typed_request_sha256": handoff["request_sha256"],
              "typed_pre_execution_ledger_sha256": handoff["research_ledger_sha256"],
              "typed_final_ledger_sha256": final_state["ledger_sha256"],
              "reviewed_tensile_manifest_sha256": tensile_manifest["manifest_sha256"],
              "reviewed_tensile_row_artifact_sha256": tensile_manifest["row_artifact"]["sha256"],
              "reviewed_tensile_measurement_row_count": tensile_manifest["measurement_row_count"],
              "reviewed_tensile_parallel_test_block_count": tensile_manifest["parallel_test_block_count"],
              "post_acquisition_rediagnosis_sha256": rediagnosis["rediagnosis_sha256"],
              "direct_nist_condition_comparability_established": False,
              "empirical_model_validation_established": False,
              "hypothesis_truth_established": False,
              "positive_scientific_closeout_established": False,
          }
          chain["chain_sha256"] = canonical_sha(chain)
          write_json(root / "authorized-provenance-chain.json", chain)

          # The full 180.7 MB source archive is ephemerally verified but is not duplicated in the CI artifact.
          archive_path.unlink()
          if archive_path.exists():
              raise SystemExit("full external archive was not removed before artifact upload")

          print(json.dumps({
              "record_id": record_id,
              "authorization_sha256": authorization["authorization_sha256"],
              "network_receipt_sha256": receipt["receipt_sha256"],
              "archive_sha256": chain["archive_sha256"],
              "measurement_row_count": tensile_manifest["measurement_row_count"],
              "parallel_test_block_count": tensile_manifest["parallel_test_block_count"],
              "row_artifact_sha256": tensile_manifest["row_artifact"]["sha256"],
              "typed_registered_outcome": execution_with_request["verified_report"]["registered_outcome"],
              "post_acquisition_blocker": rediagnosis["current_blocker"]["code"],
              "next_action_class": rediagnosis["next_action"]["action_class"],
              "positive_scientific_closeout": rediagnosis["stop_state"]["positive_scientific_closeout"],
              "chain_sha256": chain["chain_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload authorized provenance and reviewed row-level evidence
        uses: actions/upload-artifact@v7
        with:
          name: in625-authorized-network-row-intake
          path: |
            outputs/in625-authorized-network-row-intake/network-authorization.json
            outputs/in625-authorized-network-row-intake/network-acquisition-receipt.json
            outputs/in625-authorized-network-row-intake/source-readme-manifest.json
            outputs/in625-authorized-network-row-intake/archive-manifest.json
            outputs/in625-authorized-network-row-intake/reviewed-tensile/reviewed_tensile_manifest.json
            outputs/in625-authorized-network-row-intake/reviewed-tensile/reviewed_tensile_rows.jsonl
            outputs/in625-authorized-network-row-intake/typed-planning.json
            outputs/in625-authorized-network-row-intake/typed-registration-authorization.json
            outputs/in625-authorized-network-row-intake/typed-execution-handoff.json
            outputs/in625-authorized-network-row-intake/typed-execution-result.json
            outputs/in625-authorized-network-row-intake/typed-research-state.json
            outputs/in625-authorized-network-row-intake/post-acquisition-rediagnosis.json
            outputs/in625-authorized-network-row-intake/authorized-provenance-chain.json
          if-no-files-found: error
          retention-days: 14
