name: Temporary Cycle-1 declared-length EOF hardening

on:
  push:
    branches:
      - tmp/cycle1-declared-length-eof-hardening

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply premature EOF hardening
        run: python .tmp/build_cycle1_declared_length_eof_hardening.py
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Run focused transport regressions
        run: >-
          python -m pytest -q
          tests/test_public_data_acquisition_transport_errors.py
          tests/test_in625_archive_network_transport_errors.py
          tests/test_autonomous_production_cycle1_transport_stop.py
          tests/test_autonomous_production_cycle1_transport_stop_verifier.py
      - name: Run lint and diff checks
        run: |
          python -m ruff check src/materials_data_analyzer/research_loop/public_data_acquisition.py tests/test_public_data_acquisition_transport_errors.py
          git diff --check
      - name: Commit validated production changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/materials_data_analyzer/research_loop/public_data_acquisition.py \
            tests/test_public_data_acquisition_transport_errors.py
          git diff --cached --check
          git commit -m "Classify premature HTTP EOF as transport failure"
          git push origin HEAD:tmp/cycle1-declared-length-eof-hardening
