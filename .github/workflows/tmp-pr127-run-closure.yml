name: Temporary PR127 closure runner

on:
  push:
    branches:
      - agent/authenticated-inference-provenance-20260815

permissions:
  contents: write

jobs:
  run-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/authenticated-inference-provenance-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply closure patch payload
        shell: bash
        run: |
          if grep -q '^def _assert_transition_metadata_append_only' src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py; then
            echo 'Closure already applied.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-pr127-final-review-closure.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          raw_payload = workflow[start:end]
          payload = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_payload.splitlines()
          )
          exec(compile(payload, '<pr127-closure-payload>', 'exec'))
          PY
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Focused regressions and lint
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_authenticated_epistemic_transition_final_review_regressions.py \
            tests/test_authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_inherited_portability.py \
            tests/test_authenticated_epistemic_transition_lineage_identity.py \
            tests/test_authenticated_epistemic_transition_merge_gate.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py \
            tests/test_authenticated_epistemic_transition_final_review_regressions.py
      - name: Commit verified closure if needed
        shell: bash
        run: |
          set -euo pipefail
          git add src/materials_data_analyzer/research_loop/authenticated_epistemic_transition.py tests/test_authenticated_epistemic_transition_final_review_regressions.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Close final authenticated transition review gaps'
          git push origin HEAD:agent/authenticated-inference-provenance-20260815
