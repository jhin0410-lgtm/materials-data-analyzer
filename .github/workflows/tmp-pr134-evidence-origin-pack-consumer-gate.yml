name: Temporary PR134 evidence-origin pack consumer gate

on:
  push:
    branches:
      - agent/input-evidence-origin-pack-consumer-20260815

permissions:
  contents: write

jobs:
  focused-consumer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/input-evidence-origin-pack-consumer-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run independent pack-consumer regressions
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/input_evidence_origin_pack_consumer.py \
            tests/test_input_evidence_origin_pack_consumer.py
          python -m pytest -q \
            tests/test_input_evidence_origin_pack_consumer.py \
            tests/test_input_evidence_origin_pack.py \
            tests/test_input_evidence_origin_request.py \
            tests/test_program_evidence_origin_binding.py \
            tests/test_evidence_origin_binding.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/input_evidence_origin_pack_consumer.py \
            tests/test_input_evidence_origin_pack_consumer.py
      - name: Commit verified consumer changes
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/input_evidence_origin_pack_consumer.py \
            tests/test_input_evidence_origin_pack_consumer.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Independently re-authenticate evidence-origin packs'
          git push origin HEAD:agent/input-evidence-origin-pack-consumer-20260815
