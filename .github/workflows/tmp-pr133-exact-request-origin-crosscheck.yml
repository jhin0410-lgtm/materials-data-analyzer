name: Temporary PR133 exact request/origin cross-check gate

on:
  push:
    branches:
      - agent/input-evidence-origin-pack-clean-20260815

permissions:
  contents: write

jobs:
  focused-crosscheck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/input-evidence-origin-pack-clean-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply request/origin cross-check hardening
        run: |
          python scripts/tmp_pr133_exact_request_origin_crosscheck.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run focused pack gate
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/input_evidence_origin_pack.py \
            tests/test_input_evidence_origin_pack.py
          python -m pytest -q \
            tests/test_input_evidence_origin_pack.py \
            tests/test_input_evidence_origin_request.py \
            tests/test_program_evidence_origin_binding.py \
            tests/test_evidence_origin_binding.py \
            tests/test_authenticated_transition_consumer.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/input_evidence_origin_pack.py \
            tests/test_input_evidence_origin_pack.py
      - name: Commit verified hardening
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/input_evidence_origin_pack.py \
            tests/test_input_evidence_origin_pack.py
          if git diff --cached --quiet; then
            echo "No source/test changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Cross-check exact evidence-origin pack bytes'
          git push origin HEAD:agent/input-evidence-origin-pack-clean-20260815
