name: Temporary release test source snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-release-test-source-snapshot.yml"

permissions:
  contents: read

jobs:
  upload-test-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: release-test-source-snapshot
          path: |
            tests/test_battery_comparability_evidence.py
            tests/test_battery_external_cohort_admission.py
            tests/test_battery_forecast_failure_diagnostics.py
          if-no-files-found: error
          retention-days: 1
