name: Live independent IN625 evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-independent-in625-evidence.yml"
      - "configs/research/in625_zenodo_publication_dataset.v1.json"
      - "scripts/run_live_in625_zenodo_evidence.py"
      - "scripts/prepare_live_in625_review_packet.py"
      - "src/materials_data_analyzer/research_loop/evidence_harvester.py"
      - "src/materials_data_analyzer/research_loop/federated_provider_discovery.py"
      - "src/materials_data_analyzer/research_loop/in625_zenodo_episode.py"
      - "src/materials_data_analyzer/research_loop/in625_zenodo_review_preparation.py"
      - "src/materials_data_analyzer/research_loop/safe_archive_inventory.py"
      - "src/materials_data_analyzer/research_loop/safe_archive_member_reader.py"
      - "src/materials_data_analyzer/research_loop/scientific_review_release.py"
      - "src/materials_data_analyzer/research_loop/zenodo_evidence_acquisition.py"
      - "tests/test_evidence_harvester.py"
      - "tests/test_federated_provider_discovery.py"
      - "tests/test_in625_zenodo_episode.py"
      - "tests/test_in625_zenodo_review_preparation.py"
      - "tests/test_safe_archive_inventory.py"
      - "tests/test_safe_archive_member_reader.py"
      - "tests/test_scientific_review_release.py"
      - "tests/test_zenodo_evidence_acquisition.py"

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and regression dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic evidence and review-preparation regression
        run: >-
          python -m pytest -q
          tests/test_federated_provider_discovery.py
          tests/test_zenodo_evidence_acquisition.py
          tests/test_safe_archive_inventory.py
          tests/test_safe_archive_member_reader.py
          tests/test_evidence_harvester.py
          tests/test_in625_zenodo_episode.py
          tests/test_in625_zenodo_review_preparation.py
          tests/test_scientific_review_release.py
      - name: Run live independent IN625 episode
        run: >-
          python scripts/run_live_in625_zenodo_evidence.py
          --config configs/research/in625_zenodo_publication_dataset.v1.json
          --output outputs/live-in625-evidence
      - name: Prepare exact-byte scientific review request
        run: >-
          python scripts/prepare_live_in625_review_packet.py
          --episode-output outputs/live-in625-evidence
      - name: Report live scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/live-in625-evidence")
          payload = json.loads((root / "live_in625_evidence_summary.json").read_text(encoding="utf-8"))
          review = json.loads((root / "review_preparation_summary.json").read_text(encoding="utf-8"))
          print(json.dumps(payload, indent=2, sort_keys=True))
          print(json.dumps(review, indent=2, sort_keys=True))
          assert payload["issue_76_eligible"] is False
          assert payload["scientific_status_changed"] is False
          if "scientific_hypothesis_verified" in payload:
              assert payload["scientific_hypothesis_verified"] is False
          assert review["scientific_status_changed"] is False
          assert review["human_review_decision_created"] is False
          if review["review_packet_prepared"]:
              assert review["human_review_blocker_released"] is False
              assert review["scientific_support_established"] is False
              assert review["issue_76_eligible"] is False
          PY
      - name: Upload compact live evidence and review records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-independent-in625-evidence
          path: |
            outputs/live-in625-evidence/**/*.json
            !outputs/live-in625-evidence/acquisition/files/**
          if-no-files-found: warn
          retention-days: 30
