name: Temporary program evidence origin compatibility gate

on:
  push:
    branches:
      - agent/program-evidence-origin-binding-20260815

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/program-evidence-origin-binding-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply real-program compatibility closure
        run: |
          python scripts/tmp_program_evidence_origin_none_planning.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run bridge regressions
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/program_evidence_origin_binding.py \
            tests/test_program_evidence_origin_binding.py
          python -m pytest -q \
            tests/test_program_evidence_origin_binding.py \
            tests/test_evidence_origin_binding.py \
            tests/test_research_program.py \
            tests/test_epistemic_transition.py \
            tests/test_epistemic_graph.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/program_evidence_origin_binding.py \
            tests/test_program_evidence_origin_binding.py
      - name: Commit verified bridge closure
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/program_evidence_origin_binding.py \
            tests/test_program_evidence_origin_binding.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Support null planning states in program evidence origin bridge'
          git push origin HEAD:agent/program-evidence-origin-binding-20260815
