name: Temporary provenance public API gate

on:
  push:
    branches:
      - agent/provenance-public-api-dev-20260815

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/provenance-public-api-dev-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply public API integration
        run: |
          python scripts/tmp_provenance_public_api.py
          git diff --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run provenance public API regressions
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            src/materials_data_analyzer/research_loop/__init__.py \
            tests/test_provenance_public_api.py
          python -m pytest -q \
            tests/test_provenance_public_api.py \
            tests/test_evidence_origin_binding.py \
            tests/test_program_evidence_origin_binding.py \
            tests/test_scientific_critic_authenticated_policy.py \
            tests/test_authenticated_transition_consumer.py \
            tests/test_research_program.py
          python -m ruff check \
            src/materials_data_analyzer/research_loop/__init__.py \
            src/materials_data_analyzer/research_loop/program_evidence_origin_binding.py \
            tests/test_provenance_public_api.py \
            tests/test_program_evidence_origin_binding.py
      - name: Commit verified public API integration
        run: |
          set -euo pipefail
          git add \
            src/materials_data_analyzer/research_loop/__init__.py \
            docs/EVIDENCE_ORIGIN_PROVENANCE.md \
            tests/test_provenance_public_api.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Expose provenance and authenticated critic public APIs'
          git push origin HEAD:agent/provenance-public-api-dev-20260815
