name: v2.6 public release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "configs/v2_6_public_release_candidate.json"
      - "scripts/audit_v2_6_public_release_candidate.py"
      - "tests/test_v2_6_public_release_candidate.py"
      - "docs/V2_6_PUBLIC_RELEASE_CANDIDATE.md"
      - "docs/PLATFORM_V2_5_ROADMAP.md"
      - "docs/PLATFORM_V2_6_ROADMAP.md"
      - "docs/BATTERY_V2_6_EXTERNAL_EVIDENCE_LINE_CLOSEOUT.md"
      - "data/processed/battery_v2_6_14_external_evidence_line_closeout_summary.json"
      - ".github/workflows/v2-6-public-release-candidate.yml"

permissions:
  contents: read

concurrency:
  group: v2-6-release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify audited commit ancestry
        run: |
          git merge-base --is-ancestor 50e3ee1201ef791b250558a30c373848d615f815 HEAD
          git merge-base --is-ancestor 8edd4b79c35f5aa5d0f85a5e03fbb918e0c09c5d HEAD

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build release-candidate closeout
        run: |
          python scripts/audit_v2_6_public_release_candidate.py \
            --repo-root . \
            --output outputs/v2_6_public_release_candidate

      - name: Validate tracked v2.6 closeout
        run: |
          python -m src.platform_core.battery_v2_6_external_evidence_line_closeout \
            --json validate \
            data/processed/battery_v2_6_14_external_evidence_line_closeout_summary.json

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_v2_6_public_release_candidate.py \
            tests/test_battery_v2_6_external_evidence_line_closeout.py \
            tests/test_battery_v2_6_external_evidence_line_closeout_tracked.py

      - name: Verify decision and checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/v2_6_public_release_candidate")
          summary = json.loads(
              (root / "v2_6_public_release_candidate.json").read_text(
                  encoding="utf-8"
              )
          )
          manifest = json.loads(
              (root / "v2_6_public_release_candidate_manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          assert summary["decision"] == (
              "v2_6_0_selected_metadata_promotion_pending"
          )
          assert summary["candidate_version"] == "2.6.0"
          assert summary["separate_v2_5_public_release_authorized"] is False
          assert summary["software_validation"]["status"] == "supported"
          assert summary["software_validation"]["v2_6_stage_count"] == 13
          assert all(summary["software_validation"]["checks"].values())
          assert summary["scientific_closeout"]["status"] == "inconclusive"
          assert summary["scientific_closeout"]["ridge_generalization"] == (
              "unsupported"
          )
          assert summary["public_metadata_promotion_performed"] is False
          assert summary["tag_or_release_created"] is False

          for name, filename in manifest["outputs"].items():
              path = root / filename
              assert path.is_file()
              assert manifest["output_sha256"][name] == hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()
          PY

      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-6-public-release-candidate
          path: outputs/v2_6_public_release_candidate
          if-no-files-found: error
          retention-days: 14
