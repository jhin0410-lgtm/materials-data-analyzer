name: Cross-repository characterization evidence ladder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/loaders/characterization_evidence_ladder.py"
      - "src/loaders/characterization_research_bundle.py"
      - "src/materials_data_analyzer/characterization_research_use_workflow.py"
      - "src/materials_data_analyzer/characterization_use_policy.py"
      - "src/materials_data_analyzer/research_loop/characterization_evidence_gap.py"
      - "tests/test_characterization_evidence_ladder_consumer.py"
      - "tests/test_characterization_evidence_gap.py"
      - ".github/workflows/cross-repository-characterization-evidence-ladder.yml"

permissions:
  contents: read

concurrency:
  group: characterization-evidence-ladder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCA_COMMIT: cc8a047c58067e3b0002e51f35eb0a2b602f508f

jobs:
  independently-replay-producer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research orchestrator
        uses: actions/checkout@v7
        with:
          path: materials-data-analyzer

      - name: Check out pinned characterization evidence authority
        uses: actions/checkout@v7
        with:
          repository: jhin0410-lgtm/materials-characterization-analyzer
          ref: ${{ env.MCA_COMMIT }}
          path: materials-characterization-analyzer

      - name: Verify exact producer commit
        shell: bash
        run: |
          actual="$(git -C materials-characterization-analyzer rev-parse HEAD)"
          test "$actual" = "$MCA_COMMIT"
          echo "verified materials-characterization-analyzer: $actual"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install repositories independently
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "materials-data-analyzer[dev]"
          python -m pip install -e materials-characterization-analyzer

      - name: Build schema-1.1 producer contract fixture through public MCA APIs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from mca.evidence_ladder import LEVELS, evaluate_evidence_ladder
          from mca.handoff_bundle_builder import build_characterization_handoff_bundle_from_config
          from mca.provenance import sha256_file

          root = Path("producer-contract-fixture")
          evidence = root / "evidence"
          evidence.mkdir(parents=True)

          feature = {
              "sample_id": "sample-a",
              "measurement_id": "sample-a-raman",
              "instrument": "raman",
              "feature_name": "candidate_count",
              "feature_label": None,
              "value": 2.0,
              "unit": "count",
              "method": "diagnostic_peak_detection",
              "source_file": "producer-local/raman.txt",
              "source_sha256": "a" * 64,
              "preprocessing_id": "raman-preprocessing-v1",
              "quality_flag": "review_required",
          }
          source_path = evidence / "source_manifest.json"
          source_path.write_text(
              json.dumps({"source": "public", "sha256": "a" * 64}) + "\n",
              encoding="utf-8",
          )
          analysis_path = evidence / "analysis_manifest.json"
          analysis_path.write_text(
              json.dumps(
                  {
                      "schema_version": "1.0",
                      "analysis_count": 1,
                      "analyses": [
                          {
                              "schema_version": "1.0",
                              "software_version": "contract-fixture",
                              "features": [feature],
                          }
                      ],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          comparability_path = evidence / "comparability_matrix.csv"
          pd.DataFrame(
              [{"modality": "raman", "comparability_status": "not_established"}]
          ).to_csv(comparability_path, index=False)

          bindings = {
              "source_manifest": sha256_file(source_path),
              "analysis_manifest": sha256_file(analysis_path),
              "comparability_matrix": sha256_file(comparability_path),
          }
          levels = {}
          for index, level in enumerate(LEVELS):
              supported = index <= 5
              levels[level] = {
                  "assessment": "Supported" if supported else "Unsupported",
                  "evidence": [f"contract evidence for {level}"] if supported else [],
                  "limitations": [] if supported else ["independent validation remains open"],
              }
          declaration = {
              "schema_version": "1.0",
              "declaration_id": "cross-repository-ladder-contract",
              "subject": {
                  "modality": "raman",
                  "source_material_domain": "Co3O4",
                  "target_material_domain": "Co3O4",
                  "claim_scope": "material_validation",
              },
              "source_bindings": [
                  {"role": role, "sha256": bindings[role]}
                  for role in sorted(bindings)
              ],
              "levels": levels,
              "limitations": [
                  "This fixture validates software contracts only; it is not new empirical evidence."
              ],
          }
          assessment = evaluate_evidence_ladder(declaration)
          assessment_path = evidence / "evidence_ladder_assessment.json"
          assessment_path.write_text(
              json.dumps(assessment, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # The builder's config contract is schema 1.0. Supplying the optional
          # scientific_evidence_ladder input causes the produced bundle itself to be
          # schema 1.1. Keep these two version domains deliberately distinct.
          config = {
              "schema_version": "1.0",
              "case_id": "cross-repository-ladder-contract",
              "producer_repository": "jhin0410-lgtm/materials-characterization-analyzer",
              "evidence_level": "Diagnostic",
              "sample_context_rows": [
                  {
                      "sample_id": "sample-a",
                      "material": "Co3O4",
                      "identical_physical_aliquot_confirmed": False,
                  }
              ],
              "scientific_boundary": {
                  "strongest_evidence": "Cross-repository schema and replay contract only.",
                  "primary_limitation": "This fixture is not an empirical scientific validation.",
                  "suitable_for": ["software interoperability validation"],
                  "unsuitable_for": [
                      "scientific claim promotion",
                      "predictive or causal inference",
                      "engineering release decisions",
                  ],
              },
              "evidence": {
                  "source_manifest": "evidence/source_manifest.json",
                  "analysis_manifest": "evidence/analysis_manifest.json",
                  "comparability_matrix": "evidence/comparability_matrix.csv",
              },
              "scientific_evidence_ladder": "evidence/evidence_ladder_assessment.json",
          }
          config_path = root / "handoff_config.json"
          config_path.write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          result = build_characterization_handoff_bundle_from_config(
              config_path,
              root / "bundle",
          )
          assert result["validation"]["schema_version"] == "1.1"
          assert result["validation"]["scientific_evidence_ladder_present"] is True
          assert result["validation"]["scientific_evidence_ladder"]["first_blocking_level"] == (
              "L6_independent_external_validation"
          )
          print(json.dumps(result["validation"]["scientific_evidence_ladder"], indent=2))
          PY

      - name: Consume producer bundle through installed orchestrator CLI
        shell: bash
        run: |
          mda-characterization-import \
            --bundle-manifest producer-contract-fixture/bundle/characterization_handoff_bundle.json \
            --output materials-data-analyzer/outputs/cross-repository-ladder-contract \
            --requested-use descriptive

      - name: Verify independent replay and autonomous evidence-gap handoff
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("materials-data-analyzer/outputs/cross-repository-ladder-contract")
          summary = json.loads(
              (root / "cross_repository_handoff_summary.json").read_text(encoding="utf-8")
          )
          manifest = json.loads(
              (root / "cross_repository_handoff_manifest.json").read_text(encoding="utf-8")
          )
          gap = json.loads(
              (root / "characterization_evidence_gap.json").read_text(encoding="utf-8")
          )

          ladder = summary["scientific_evidence_ladder"]
          assert ladder["independently_replayed"] is True
          assert ladder["highest_contiguous_supported_level"] == "L5_material_domain_validation"
          assert ladder["first_blocking_level"] == "L6_independent_external_validation"
          assert ladder["scientific_status_promoted"] is False
          assert ladder["downstream_use_authorized"] is False

          assert gap["first_blocking_level"] == "L6_independent_external_validation"
          assert gap["evidence_gap"]["action_class_hint"] == "replication"
          assert gap["scientific_status_promoted"] is False
          assert gap["downstream_use_authorized"] is False
          assert gap["automatic_execution_authorized"] is False
          assert gap["planning_metadata_only"] is True
          assert summary["autonomous_research_planning"] == gap
          assert manifest["autonomous_research_planning"] == gap
          assert manifest["input_bundle"]["schema_version"] == "1.1"

          for name, filename in manifest["outputs"].items():
              path = root / filename
              assert path.is_file(), (name, filename)
              assert manifest["output_sha256"][name] == hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()
          PY

      - name: Verify no producer implementation dependency leaked into orchestrator
        shell: bash
        run: |
          if grep -R --line-number --include='*.py' -E '(^|[[:space:]])(from|import)[[:space:]]+mca([[:space:].]|$)' \
            materials-data-analyzer/src; then
            echo "materials-data-analyzer must independently replay the handoff contract" >&2
            exit 1
          fi

      - name: Run focused consumer regressions
        working-directory: materials-data-analyzer
        run: |
          python -m pytest -q \
            tests/test_characterization_evidence_ladder_consumer.py \
            tests/test_characterization_evidence_gap.py \
            tests/test_characterization_use_policy.py \
            tests/test_characterization_use_workflow.py \
            tests/test_characterization_import_cli.py

      - name: Upload cross-repository contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-repository-characterization-evidence-ladder
          path: |
            producer-contract-fixture
            materials-data-analyzer/outputs/cross-repository-ladder-contract
          if-no-files-found: warn
          retention-days: 14