name: Live NIST mds2-2923 acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-nist-mds2-2923-acquisition.yml"
      - "configs/research/in625_external_physical_source_frontier.v1.json"
      - "configs/research/in625_geometry_condition_source_reconnaissance.v1.json"
      - "scripts/audit_live_nist_mds2_2923.py"
      - "scripts/recon_in625_geometry_condition_sources.py"
      - "scripts/verify_live_nist_mds2_2923_micrographs.py"
      - "src/materials_data_analyzer/public_acquisition_cli.py"
      - "src/materials_data_analyzer/research_loop/frontier_acquisition.py"
      - "src/materials_data_analyzer/research_loop/nist_mds2_2923_scientific_intake.py"
      - "src/materials_data_analyzer/research_loop/nist_pdr_acquisition.py"
      - "src/materials_data_analyzer/research_loop/public_data_acquisition.py"
      - "tests/test_in625_mds2_2923_acquisition_frontier.py"
      - "tests/test_nist_mds2_2923_scientific_intake.py"
      - "tests/test_nist_pdr_acquisition.py"
      - "tests/test_nist_pdr_nerdm_compatibility.py"
      - "tests/test_public_data_acquisition.py"

permissions:
  contents: read

jobs:
  live-acquisition-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and focused regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-release.txt
          python -m pip install "pypdf>=5,<7"

      - name: Acquire official paper and benchmark evidence bytes
        run: |
          python scripts/recon_in625_geometry_condition_sources.py \
            --config configs/research/in625_geometry_condition_source_reconnaissance.v1.json \
            --output outputs/nist-mds2-2923/condition-source-reconnaissance.json

      - name: Verify paper and official-source provenance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/nist-mds2-2923/condition-source-reconnaissance.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["source_count"] == 8
          assert result["all_sources_fetched"] is True
          assert result["all_claim_anchors_matched"] is True
          assert result["unrestricted_search_performed"] is False
          assert result["arbitrary_url_fetch_performed"] is False
          assert result["source_bytes_persisted"] is False
          assert result["paper_claims_promoted_to_row_level_authority"] is False
          assert result["scientific_status_changed"] is False
          by_id = {item["source_id"]: item for item in result["sources"]}
          assert by_id["nist-official-amb2018-02-description"]["source_class"] == "official_web_document"
          assert by_id["ricker-2019-topographic-tracks"]["source_class"] == "primary_paper"
          assert by_id["lane-2020-melt-pool-geometry"]["media_type"] == "pdf"
          assert by_id["naderi-2022-scaling-fidelity"]["media_type"] == "pdf"
          assert by_id["weaver-2021-spot-size-scaling-metadata"]["media_type"] == "html"
          assert all(item["row_level_measurement_authority"] is False for item in result["sources"])
          assert all(item["source_size_bytes"] > 0 for item in result["sources"])
          assert all(len(item["source_sha256"]) == 64 for item in result["sources"])
          PY

      - name: Run deterministic NIST acquisition and intake regressions
        run: |
          python -m pytest -q \
            tests/test_in625_mds2_2923_acquisition_frontier.py \
            tests/test_nist_mds2_2923_scientific_intake.py \
            tests/test_nist_pdr_acquisition.py \
            tests/test_nist_pdr_nerdm_compatibility.py \
            tests/test_public_data_acquisition.py

      - name: Acquire authoritative README and workbook
        run: |
          mkdir -p outputs/nist-mds2-2923
          python -m materials_data_analyzer.public_acquisition_cli \
            --frontier configs/research/in625_external_physical_source_frontier.v1.json \
            --candidate-id nist-mds2-2923-cross-sectional-micrographs \
            --output-root outputs/nist-mds2-2923/packages \
            --timeout-seconds 180 \
            --max-auto-mib 8 \
            | tee outputs/nist-mds2-2923/frontier_acquisition_report.json

      - name: Verify acquisition and scientific boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/nist-mds2-2923")
          report = json.loads((root / "frontier_acquisition_report.json").read_text(encoding="utf-8"))
          acquisition = report["acquisition"]
          assert report["scientific_status_changed"] is False
          assert report["requires_scientific_intake"] is True
          assert acquisition["automatic_execution_attempted"] == 2
          assert acquisition["automatic_execution_succeeded"] == 2
          assert acquisition["automatic_execution_failed"] == 0
          assert acquisition["all_auto_succeeded"] is True
          assert acquisition["human_review_required"] == []
          assert acquisition["blocked"] == []

          expected_paths = {"2923_README.txt", "Master_TrackList_Measurements.xlsx"}
          receipts = acquisition["receipts"]
          assert {item["artifact_path"] for item in receipts} == expected_paths
          for receipt in receipts:
              assert receipt["scientific_status_changed"] is False
              assert receipt["requires_scientific_intake"] is True
              assert receipt["recorded_acquisition_provenance_authenticated"] is True
              package = Path(receipt["package_directory"])
              artifact = package / receipt["artifact_path"]
              body = artifact.read_bytes()
              assert len(body) == receipt["artifact_size_bytes"]
              assert hashlib.sha256(body).hexdigest() == receipt["artifact_sha256"]
          PY

      - name: Audit exact workbook rows and prepare scientific review request
        run: |
          python scripts/audit_live_nist_mds2_2923.py \
            --acquisition-root outputs/nist-mds2-2923 \
            --output outputs/nist-mds2-2923/intake

      - name: Verify exact live intake snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("outputs/nist-mds2-2923/intake")
          summary = json.loads((root / "scientific_intake_summary.json").read_text(encoding="utf-8"))
          report = json.loads((root / "scientific_intake_report.json").read_text(encoding="utf-8"))
          request = json.loads((root / "scientific_review_request.json").read_text(encoding="utf-8"))

          assert summary["in625_measurement_rows"] == 178
          assert summary["in625_physical_tracks"] == 106
          assert summary["data_process_spot_groups"] == 73
          assert summary["summary_process_spot_groups"] == 64
          assert summary["summary_missing_groups"] == 9
          assert summary["summary_missing_measurement_rows"] == 20
          assert summary["source_track_metadata_conflicts"] == 1
          assert summary["bound_micrographs"] == 178
          assert summary["bound_micrograph_total_size_bytes"] == 948262052
          assert summary["issue_76_exact_target_cells_satisfied"] == 0
          assert summary["issue_76_eligible"] is False
          assert summary["human_scientific_review_decision_created"] is False
          assert summary["scientific_support_established"] is False
          assert summary["scientific_status_changed"] is False

          inventory = report["in625_inventory"]
          assert inventory["machine_measurement_counts"] == {"AMMT": 34, "EOS M270": 144}
          assert inventory["machine_physical_track_counts"] == {"AMMT": 34, "EOS M270": 72}
          assert inventory["measurements_per_physical_track_distribution"] == {"1": 34, "2": 72}
          assert report["micrograph_binding"]["nerdm_datafile_count"] == 444
          assert report["micrograph_binding"]["nerdm_in625_micrograph_count"] == 356
          assert report["micrograph_binding"]["workbook_extension_claim_mismatch_count"] == 178
          assert len(report["source"]["source_anomalies"]) == 4
          assert report["measurement_semantics"]["calibration_conversion_performed"] is False
          assert report["issue_76"]["eligible"] is False
          assert request["requested_uses"] == ["descriptive_analysis", "scientific_intake"]
          assert request["scientific_status_changed"] is False
          PY

      - name: Live-verify raw micrographs across every explicit sample block
        run: |
          python scripts/verify_live_nist_mds2_2923_micrographs.py \
            --acquisition-root outputs/nist-mds2-2923 \
            --manifest outputs/nist-mds2-2923/intake/micrograph_manifest.json \
            --output-root outputs/nist-mds2-2923/micrograph-verification \
            --timeout-seconds 180 \
            --max-auto-mib 32 \
            --max-attempts-per-block 4

      - name: Verify raw-micrograph live acquisition boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/nist-mds2-2923/micrograph-verification/micrograph_live_verification_summary.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result["metadata_bound_file_count"] == 178
          assert result["metadata_bound_total_size_bytes"] == 948262052
          assert result["explicit_sample_block_count"] == 7
          assert result["live_verified_sample_block_count"] == 7
          assert result["representative_sample_blocks_live_verified"] is True
          assert result["live_verified_file_count"] == 7
          assert result["all_workbook_bound_micrographs_metadata_bound"] is True
          assert result["all_workbook_bound_micrographs_live_verified"] is False
          assert result["full_raw_acquisition_required_for_workbook_published_width_depth_use"] is False
          assert result["full_raw_acquisition_required_for_image_remeasurement"] is True
          assert all(item["recorded_acquisition_provenance_authenticated"] is True for item in result["files"])
          assert result["raw_bytes_persisted_in_job_workspace"] is True
          assert result["raw_bytes_committed_to_repository"] is False
          assert result["scientific_status_changed"] is False
          assert result["scientific_support_established"] is False
          assert result["issue_76_eligible"] is False
          PY

      - name: Upload bounded acquisition and scientific-intake evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nist-mds2-2923-live-intake
          path: |
            outputs/nist-mds2-2923/condition-source-reconnaissance.json
            outputs/nist-mds2-2923/frontier_acquisition_report.json
            outputs/nist-mds2-2923/packages/
            outputs/nist-mds2-2923/intake/*.json
            outputs/nist-mds2-2923/micrograph-verification/micrograph_live_verification_summary.json
          if-no-files-found: warn
          retention-days: 30
