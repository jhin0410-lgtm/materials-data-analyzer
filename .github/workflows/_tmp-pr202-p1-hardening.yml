          old_sig = '''    previous_checkpoint: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n'''
          if old_sig not in tail:
              raise SystemExit('validator signature anchor missing')
          tail = tail.replace(
              old_sig,
              '''    previous_checkpoint: Mapping[str, Any] | None = None,\n    previous_validated_planning_context: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n''',
              1,
          )
          text = text[:idx] + tail
          p.write_text(text, encoding='utf-8')
          patch(
              p,
              '''        minimum_utility=minimum_utility,\n        previous_checkpoint=previous_checkpoint,\n    )\n''',
              '''        minimum_utility=minimum_utility,\n        previous_checkpoint=previous_checkpoint,\n        previous_validated_planning_context=previous_validated_planning_context,\n    )\n''',
          )
          patch(
              p,
              '''        "planner_verification": dict(rebuilt["planner_verification"]),\n        "authorization_granted": False,\n''',
              '''        "planner_verification": dict(rebuilt["planner_verification"]),\n        "predecessor_validation": rebuilt.get("predecessor_validation"),\n        "authorization_granted": False,\n''',
          )

          # 5) Re-diagnosis must not invent a hypothesis portfolio for claim/conclusion targets.
          p = pkg / 'recursive_research_cycle_rediagnosis.py'
          patch(
