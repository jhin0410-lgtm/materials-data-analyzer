              '''    program_state: Mapping[str, Any],\n    previous_progression: Mapping[str, Any] | None = None,\n    source_evaluated_graph: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n''',
          )
          patch(
              p,
              '''    previous_sha: str | None = None\n    previous_evaluated_graph_sha: str | None = None\n''',
              '''    previous_sha: str | None = None\n''',
          )
          patch(
              p,
              '''        previous_evaluated_graph_sha = _sha(\n            prior_ancestry.get("evaluated_graph_canonical_sha256"),\n            "previous_progression.ancestry.evaluated_graph_canonical_sha256",\n        )\n''',
              '''        _sha(\n            prior_ancestry.get("evaluated_graph_canonical_sha256"),\n            "previous_progression.ancestry.evaluated_graph_canonical_sha256",\n        )\n''',
          )
          patch(
              p,
              '''        current_target,\n        assessment,\n    ) = _authenticated_transition(\n        bundle_root=transition_bundle_root,\n        execution=execution,\n        source_target=source_target,\n        program_state=_mapping(program_state, "program_state"),\n    )\n''',
              '''        current_target,\n        assessment,\n        base_scientific_state,\n        successor_scientific_state,\n    ) = _authenticated_transition(\n        bundle_root=transition_bundle_root,\n        execution=execution,\n        source_target=source_target,\n        program_state=_mapping(program_state, "program_state"),\n        source_evaluated_graph=source_evaluated_graph,\n    )\n''',
          )
          patch(
              p,
              '''    if previous_evaluated_graph_sha == graph_sha:\n        raise RecursiveResearchEvidenceError(\n            "recursive cycle produced no new evaluated graph information state"\n        )\n\n    portfolio_state_name = (\n''',
              '''    no_new_scientific_information = (\n        cycle_index > 1\n        and base_scientific_state["fingerprint_sha256"]\n        == successor_scientific_state["fingerprint_sha256"]\n    )\n\n    portfolio_state_name = (\n''',
          )
          patch(
              p,
              '''    if portfolio_state_name == "retired_falsified_within_verified_scope":\n        status = "bounded_stop_hypothesis_retired"\n        re_diagnosis_required = False\n        stop_reason = "Target hypothesis remains retired/falsified within verified scope."\n    elif portfolio_state_name == "positive_closeout_required":\n        status = "bounded_stop_domain_closeout_required"\n        re_diagnosis_required = False\n        stop_reason = "Positive scientific closeout requires separate domain review."\n    else:\n        status = "re_diagnosis_required"\n        re_diagnosis_required = True\n        stop_reason = None\n''',
              '''    assessment_status = assessment.get("status")\n    if portfolio_state_name == "retired_falsified_within_verified_scope":\n        status = "bounded_stop_hypothesis_retired"\n        re_diagnosis_required = False\n        stop_reason = "Target hypothesis remains retired/falsified within verified scope."\n    elif current_target["node_type"] != "hypothesis" and assessment_status == "falsified_within_verified_scope":\n        status = "bounded_stop_target_falsified"\n        re_diagnosis_required = False\n        stop_reason = "Target claim/conclusion is falsified within verified scope."\n    elif portfolio_state_name == "positive_closeout_required" or (\n        current_target["node_type"] != "hypothesis"\n        and assessment_status == "provisionally_supported"\n    ):\n        status = "bounded_stop_domain_closeout_required"\n        re_diagnosis_required = False\n        stop_reason = "Positive scientific closeout requires separate domain review."\n    elif no_new_scientific_information:\n        status = "bounded_stop_no_new_scientific_information"\n        re_diagnosis_required = False\n        stop_reason = (\n            "Successor cycle added only non-status-affecting/version bookkeeping; "\n            "the target scientific evidence state did not change."\n        )\n    else:\n        status = "re_diagnosis_required"\n        re_diagnosis_required = True\n        stop_reason = None\n''',
          )
          patch(
