name: PR202 final P1 hardening

on:
  push:
    branches:
      - feature/bounded-recursive-research-cycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bounded-recursive-research-cycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply provenance hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          pkg = root / 'src/materials_data_analyzer/research_loop'

          authorization_module = '''"""Historical authorization reconstruction for recursive execution evidence.

This module does not authorize or execute an action.  It replays the repository's
existing authorization policy against the exact immutable ledger prefix immediately
before a recorded action, using an isolated temporary reconstruction of that historical
research-run state.  The result is provenance evidence about whether the action was
actually authorizable at that point in the hash-chained run.
"""
from __future__ import annotations

import hashlib
import json
from collections.abc import Mapping
from pathlib import Path
from tempfile import TemporaryDirectory
from typing import Any

from .action_authorization import assess_current_action_authorization
from .kernel import (
    LEDGER_FILENAME,
    LOCK_FILENAME,
    OBJECTIVE_FILENAME,
    STATE_FILENAME,
    ResearchLoopError,
    _load_consistent_read,
    _reconstruct_state,
    _serialize_ledger,
)

RECURSIVE_AUTHORIZATION_PROVENANCE_SCHEMA_VERSION = "1.0"
RECURSIVE_AUTHORIZATION_PROVENANCE_POLICY_VERSION = "1.0"


class RecursiveAuthorizationProvenanceError(ResearchLoopError):
    """Raised when pre-execution authorization cannot be reconstructed exactly."""


def _canonical_sha256(value: object) -> str:
    return hashlib.sha256(
        json.dumps(
            value,
            ensure_ascii=False,
            sort_keys=True,
            separators=(",", ":"),
            allow_nan=False,
        ).encode("utf-8")
    ).hexdigest()


def verify_preexecution_authorization(
    *,
    adapter_id: str,
    repository_root: str | Path,
    research_run: str | Path,
    action_registry_path: str | Path,
    expected_action_id: str,
    expected_concrete_action_type: str,
    expected_concrete_action_version: str,
    expected_candidate_action_class: str,
) -> dict[str, Any]:
    """Replay existing authorization on the exact ledger prefix before one action."""
    root = Path(repository_root).expanduser().resolve(strict=True)
    run = Path(research_run).expanduser().resolve(strict=True)
    registry_path = Path(action_registry_path).expanduser().resolve(strict=True)
    run_path, events, current_state = _load_consistent_read(run)
    matches = [
        (index, event)
        for index, event in enumerate(events)
        if event.get("event_type") == "action_recorded"
        and isinstance(event.get("payload"), Mapping)
        and event["payload"].get("action_id") == expected_action_id
    ]
    if len(matches) != 1:
        raise RecursiveAuthorizationProvenanceError(
            "immutable ledger must contain exactly one matching action event"
        )
    action_index, action_event = matches[0]
    action_payload = action_event["payload"]
    if action_payload.get("action_type") != expected_concrete_action_type:
        raise RecursiveAuthorizationProvenanceError(
            "immutable ledger action type differs from expected concrete action"
        )
    if action_index < 1:
        raise RecursiveAuthorizationProvenanceError(
            "action event cannot precede the immutable research objective"
        )
    prefix = events[:action_index]
    prefix_text = _serialize_ledger(prefix)
    prefix_sha = hashlib.sha256(prefix_text.encode("utf-8")).hexdigest()
    pre_state = _reconstruct_state(prefix, prefix_sha)
    if pre_state.get("status") != "active":
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution immutable research state was not active"
        )

    objective_path = run_path / OBJECTIVE_FILENAME
    if not objective_path.is_file():
        raise RecursiveAuthorizationProvenanceError(
            "immutable run objective disappeared during authorization reconstruction"
        )
    with TemporaryDirectory(prefix="recursive-auth-replay-") as temporary:
        replay = Path(temporary)
        (replay / OBJECTIVE_FILENAME).write_bytes(objective_path.read_bytes())
        (replay / LEDGER_FILENAME).write_text(prefix_text, encoding="utf-8")
        (replay / STATE_FILENAME).write_text(
            json.dumps(pre_state, indent=2, ensure_ascii=False, sort_keys=True) + "\\n",
            encoding="utf-8",
        )
        (replay / LOCK_FILENAME).write_bytes(b"\\0")
        authorization = assess_current_action_authorization(
            adapter_id,
            repository_root=root,
            research_run=replay,
            action_registry_path=registry_path,
        )

    if authorization.get("authorization_status") != "ready_for_explicit_execution_request":
        raise RecursiveAuthorizationProvenanceError(
            "exact pre-execution state was not ready for an explicit typed request"
        )
    if authorization.get("execution_registry_verified") is not True:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution authorization did not verify the execution registry"
        )
    if authorization.get("selected_action_binding_verified") is not True:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution authorization did not verify selected-action binding"
        )
    if authorization.get("budget_verified") is not True:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution authorization did not verify remaining research budget"
        )
    selected = authorization.get("selected_action")
    contract = authorization.get("execution_contract")
    if not isinstance(selected, Mapping) or not isinstance(contract, Mapping):
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution authorization omitted selected action or execution contract"
        )
    if selected.get("action_type") != expected_concrete_action_type:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution selected action type differs from executed action"
        )
    if selected.get("action_version") != expected_concrete_action_version:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution selected action version differs from executed action"
        )
    if contract.get("action_type") != expected_concrete_action_type:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution execution contract type differs from executed action"
        )
    if contract.get("action_version") != expected_concrete_action_version:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution execution contract version differs from executed action"
        )
    if contract.get("category") != expected_candidate_action_class:
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution execution contract category differs from planner action class"
        )
    if selected.get("cost_units") != action_payload.get("cost_units"):
        raise RecursiveAuthorizationProvenanceError(
            "pre-execution selected cost differs from immutable action event"
        )

    result: dict[str, Any] = {
        "schema_version": RECURSIVE_AUTHORIZATION_PROVENANCE_SCHEMA_VERSION,
        "policy_version": RECURSIVE_AUTHORIZATION_PROVENANCE_POLICY_VERSION,
        "verification_status": "preexecution_authorization_deterministically_reconstructed",
        "adapter_id": adapter_id,
        "action_id": expected_action_id,
        "concrete_action_type": expected_concrete_action_type,
        "concrete_action_version": expected_concrete_action_version,
        "candidate_action_class": expected_candidate_action_class,
        "pre_execution_ledger_sha256": prefix_sha,
        "pre_execution_event_count": len(prefix),
        "terminal_ledger_sha256": current_state.get("ledger_sha256"),
        "authorization_result_sha256": _canonical_sha256(authorization),
        "authorization_status": authorization.get("authorization_status"),
        "execution_registry_verified": True,
        "selected_action_binding_verified": True,
        "budget_verified": True,
        "explicit_request_was_not_inferred_from_execution_completion": True,
        "execution_performed_by_replay": False,
        "scientific_status_changed": False,
    }
    result["verification_sha256"] = _canonical_sha256(result)
    return result


__all__ = [
    "RECURSIVE_AUTHORIZATION_PROVENANCE_POLICY_VERSION",
    "RECURSIVE_AUTHORIZATION_PROVENANCE_SCHEMA_VERSION",
    "RecursiveAuthorizationProvenanceError",
    "verify_preexecution_authorization",
]
'''
          (pkg / 'recursive_authorization_provenance.py').write_text(authorization_module, encoding='utf-8')

          scientific_module = '''"""Path-insensitive scientific-state identities for bounded recursive cycles.

Graph version IDs, transition lineage, edge IDs, diagnostic-only relations, and local
artifact paths are bookkeeping.  Recursive no-new-information decisions instead compare
the target's verified directional evidence and assessed scientific state.
"""
from __future__ import annotations

import hashlib
import json
from collections.abc import Mapping, Sequence
from typing import Any

from .kernel import ResearchLoopError

RECURSIVE_SCIENTIFIC_STATE_SCHEMA_VERSION = "1.0"
RECURSIVE_SCIENTIFIC_STATE_POLICY_VERSION = "1.0"
_DIRECTIONAL = {"supports", "contradicts", "falsifies"}


class RecursiveScientificStateError(ResearchLoopError):
    """Raised when an evaluated graph cannot yield a stable scientific identity."""


def _sha(value: object) -> str:
    return hashlib.sha256(
        json.dumps(
            value,
            ensure_ascii=False,
            sort_keys=True,
            separators=(",", ":"),
            allow_nan=False,
        ).encode("utf-8")
    ).hexdigest()


def _mapping(value: object, field: str) -> Mapping[str, Any]:
    if not isinstance(value, Mapping):
        raise RecursiveScientificStateError(f"{field} must be an object")
    return value


def _sequence(value: object, field: str) -> Sequence[object]:
    if isinstance(value, (str, bytes, bytearray)) or not isinstance(value, Sequence):
        raise RecursiveScientificStateError(f"{field} must be a sequence")
    return value


def _artifact_identity(value: object, field: str) -> dict[str, str]:
    item = _mapping(value, field)
    role = item.get("role")
    digest = item.get("sha256")
    if not isinstance(role, str) or not role.strip():
        raise RecursiveScientificStateError(f"{field}.role must be non-empty")
    if not isinstance(digest, str) or len(digest) != 64:
        raise RecursiveScientificStateError(f"{field}.sha256 must be SHA-256")
    return {"role": role, "sha256": digest}


def _node_identity(node: Mapping[str, Any], *, include_id: bool) -> dict[str, Any]:
    result: dict[str, Any] = {
        "node_type": node.get("node_type"),
        "statement": node.get("statement"),
    }
    if include_id:
        result["node_id"] = node.get("node_id")
    if "evidence_binding" in node:
        binding = _mapping(node.get("evidence_binding"), "node.evidence_binding")
        result["evidence_binding"] = {
            "workstream_id": binding.get("workstream_id"),
            "role": binding.get("role"),
            "sha256": binding.get("sha256"),
        }
    if "evidence_quality" in node:
        result["evidence_quality"] = node.get("evidence_quality")
    if "execution_status" in node:
        result["execution_status"] = node.get("execution_status")
    artifacts = node.get("artifact_bindings")
    if artifacts is not None:
        normalized = [
            _artifact_identity(item, f"node.artifact_bindings[{index}]")
            for index, item in enumerate(_sequence(artifacts, "node.artifact_bindings"))
        ]
        result["artifact_bindings"] = sorted(
            normalized, key=lambda item: (item["role"], item["sha256"])
        )
    return result


def _edge_identity(edge: Mapping[str, Any], *, include_ids: bool) -> dict[str, Any]:
    result: dict[str, Any] = {
        "relation": edge.get("relation"),
        "assessment_level": edge.get("assessment_level"),
        "active": edge.get("active"),
    }
    if include_ids:
        result.update(
            {
                "edge_id": edge.get("edge_id"),
                "source_node_id": edge.get("source_node_id"),
                "target_node_id": edge.get("target_node_id"),
            }
        )
    verifier = edge.get("verification_artifact")
    if verifier is not None:
        result["verification_artifact"] = _artifact_identity(
            verifier, "edge.verification_artifact"
        )
    return result


def evaluated_graph_scientific_identity_sha256(
    evaluated_graph: Mapping[str, Any],
) -> str:
    """Bind an evaluated graph while excluding local artifact path resolution."""
    graph = _mapping(evaluated_graph, "evaluated_graph")
    nodes = [
        _mapping(item, f"evaluated_graph.nodes[{index}]")
        for index, item in enumerate(_sequence(graph.get("nodes"), "evaluated_graph.nodes"))
    ]
    edges = [
        _mapping(item, f"evaluated_graph.edges[{index}]")
        for index, item in enumerate(_sequence(graph.get("edges"), "evaluated_graph.edges"))
    ]
    assessments = [
        dict(_mapping(item, f"evaluated_graph.assessments[{index}]"))
        for index, item in enumerate(
            _sequence(graph.get("assessments"), "evaluated_graph.assessments")
        )
    ]
    normalized_assessments = []
    for item in assessments:
        normalized_assessments.append(
            {
                "node_id": item.get("node_id"),
                "node_type": item.get("node_type"),
                "status": item.get("status"),
                "final_positive_support_granted": item.get("final_positive_support_granted"),
                "domain_closeout_required_for_positive_conclusion": item.get(
                    "domain_closeout_required_for_positive_conclusion"
                ),
                "confidence_score": item.get("confidence_score"),
            }
        )
    identity = {
        "schema_version": RECURSIVE_SCIENTIFIC_STATE_SCHEMA_VERSION,
        "policy_version": RECURSIVE_SCIENTIFIC_STATE_POLICY_VERSION,
        "graph_id": graph.get("graph_id"),
        "research_scope": graph.get("research_scope"),
        "nodes": sorted(
            [_node_identity(item, include_id=True) for item in nodes],
            key=lambda item: str(item.get("node_id")),
        ),
        "edges": sorted(
            [_edge_identity(item, include_ids=True) for item in edges],
            key=lambda item: str(item.get("edge_id")),
        ),
        "assessments": sorted(
            normalized_assessments, key=lambda item: str(item.get("node_id"))
        ),
    }
    return _sha(identity)


def target_scientific_state_fingerprint(
    evaluated_graph: Mapping[str, Any], *, target_node_id: str
) -> dict[str, Any]:
    """Fingerprint status-affecting verified evidence, not transition bookkeeping."""
    graph = _mapping(evaluated_graph, "evaluated_graph")
    nodes = [
        _mapping(item, f"evaluated_graph.nodes[{index}]")
        for index, item in enumerate(_sequence(graph.get("nodes"), "evaluated_graph.nodes"))
    ]
    by_id = {str(item.get("node_id")): item for item in nodes}
    if target_node_id not in by_id:
        raise RecursiveScientificStateError("target node is absent from evaluated graph")
    target = by_id[target_node_id]
    assessments = [
        _mapping(item, f"evaluated_graph.assessments[{index}]")
        for index, item in enumerate(
            _sequence(graph.get("assessments"), "evaluated_graph.assessments")
        )
        if isinstance(item, Mapping) and item.get("node_id") == target_node_id
    ]
    if len(assessments) != 1:
        raise RecursiveScientificStateError(
            "target must resolve to exactly one evaluated assessment"
        )
    verified_relations: list[dict[str, Any]] = []
    for index, raw in enumerate(_sequence(graph.get("edges"), "evaluated_graph.edges")):
        edge = _mapping(raw, f"evaluated_graph.edges[{index}]")
        if (
            edge.get("active") is True
            and edge.get("target_node_id") == target_node_id
            and edge.get("relation") in _DIRECTIONAL
            and edge.get("assessment_level") == "domain_verified"
        ):
            source_id = edge.get("source_node_id")
            if source_id not in by_id:
                raise RecursiveScientificStateError(
                    "verified directional edge source is absent from evaluated graph"
                )
            verified_relations.append(
                {
                    "relation": edge.get("relation"),
                    "source": _node_identity(by_id[str(source_id)], include_id=False),
                    "verification_artifact": _artifact_identity(
                        edge.get("verification_artifact"),
                        f"evaluated_graph.edges[{index}].verification_artifact",
                    ),
                }
            )
    payload: dict[str, Any] = {
        "schema_version": RECURSIVE_SCIENTIFIC_STATE_SCHEMA_VERSION,
        "policy_version": RECURSIVE_SCIENTIFIC_STATE_POLICY_VERSION,
        "target": _node_identity(target, include_id=True),
        "assessment_status": assessments[0].get("status"),
        "verified_directional_evidence": sorted(
            verified_relations,
            key=lambda item: _sha(item),
        ),
        "diagnostic_edges_included": False,
        "graph_version_included": False,
        "local_artifact_paths_included": False,
    }
    payload["fingerprint_sha256"] = _sha(payload)
    return payload


__all__ = [
    "RECURSIVE_SCIENTIFIC_STATE_POLICY_VERSION",
    "RECURSIVE_SCIENTIFIC_STATE_SCHEMA_VERSION",
    "RecursiveScientificStateError",
    "evaluated_graph_scientific_identity_sha256",
    "target_scientific_state_fingerprint",
]
'''
