              '''    action = matches[0]\n    if action.get("action_type") != concrete_action_type:\n        raise RecursiveAuthorizedExecutionEvidenceError(\n            "research ledger concrete action type differs from verified request"\n        )\n    authorization_provenance = verify_preexecution_authorization(\n        adapter_id=adapter_id,\n        repository_root=root,\n        research_run=run,\n        action_registry_path=registry_path,\n        expected_action_id=expected_candidate_action_id,\n        expected_concrete_action_type=concrete_action_type,\n        expected_concrete_action_version=concrete_action_version,\n        expected_candidate_action_class=expected_candidate_action_class,\n    )\n    outcome = action.get("status")\n''',
