          # 4) Reconstruct predecessor from its own validated planning artifact/context.
          p = pkg / 'validated_recursive_cycle_planning.py'
          patch(
              p,
              '''def _canonical_sha256(value: object) -> str:\n    return hashlib.sha256(\n''',
              '''def _mapping(value: object, field: str) -> Mapping[str, Any]:\n    if not isinstance(value, Mapping):\n        raise ValidatedRecursivePlanningError(f"{field} must be an object")\n    return value\n\n\ndef _optional_mapping(value: object, field: str) -> Mapping[str, Any] | None:\n    if value is None:\n        return None\n    return _mapping(value, field)\n\n\ndef _canonical_sha256(value: object) -> str:\n    return hashlib.sha256(\n''',
          )
          patch(
              p,
              '''def build_validated_recursive_planning_checkpoint(\n''',
              '''def _reconstruct_predecessor_context(\n    context: Mapping[str, Any],\n) -> tuple[dict[str, Any], str]:\n    ctx = _mapping(context, "previous_validated_planning_context")\n    artifact = _mapping(\n        ctx.get("validated_planning_artifact"),\n        "previous_validated_planning_context.validated_planning_artifact",\n    )\n    inputs = _mapping(\n        ctx.get("validation_inputs"),\n        "previous_validated_planning_context.validation_inputs",\n    )\n    verification = validate_validated_recursive_planning_checkpoint(\n        artifact,\n        planning_handoff=_mapping(inputs.get("planning_handoff"), "previous.validation_inputs.planning_handoff"),\n        source_discrepancy_report=_mapping(inputs.get("source_discrepancy_report"), "previous.validation_inputs.source_discrepancy_report"),\n        source_evaluated_graph=_mapping(inputs.get("source_evaluated_graph"), "previous.validation_inputs.source_evaluated_graph"),\n        fresh_plan=_mapping(inputs.get("fresh_plan"), "previous.validation_inputs.fresh_plan"),\n        planner_program_state=_mapping(inputs.get("planner_program_state"), "previous.validation_inputs.planner_program_state"),\n        source_hypothesis_portfolio=_optional_mapping(inputs.get("source_hypothesis_portfolio"), "previous.validation_inputs.source_hypothesis_portfolio"),\n        previous_discrepancy_report=_optional_mapping(inputs.get("previous_discrepancy_report"), "previous.validation_inputs.previous_discrepancy_report"),\n        candidate_match=_optional_mapping(inputs.get("candidate_match"), "previous.validation_inputs.candidate_match"),\n        planner_critic_report=_optional_mapping(inputs.get("planner_critic_report"), "previous.validation_inputs.planner_critic_report"),\n        planner_reasoning_proposal=_optional_mapping(inputs.get("planner_reasoning_proposal"), "previous.validation_inputs.planner_reasoning_proposal"),\n        budget_units=float(inputs.get("budget_units", 8.0)),\n        minimum_utility=float(inputs.get("minimum_utility", 0.01)),\n        previous_validated_planning_context=_optional_mapping(\n            inputs.get("previous_validated_planning_context"),\n            "previous.validation_inputs.previous_validated_planning_context",\n        ),\n    )\n    checkpoint = _mapping(\n        verification.get("recursive_checkpoint"),\n        "previous validated planning recursive_checkpoint",\n    )\n    digest = verification.get("validated_checkpoint_sha256")\n    if not isinstance(digest, str) or len(digest) != 64:\n        raise ValidatedRecursivePlanningError(\n            "previous validated planning artifact omitted canonical SHA-256"\n        )\n    return dict(checkpoint), digest\n\n\ndef build_validated_recursive_planning_checkpoint(\n''',
          )
          patch(
              p,
              '''    previous_checkpoint: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n''',
              '''    previous_checkpoint: Mapping[str, Any] | None = None,\n    previous_validated_planning_context: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n''',
          )
          patch(
              p,
              '''    verification = validate_autonomous_inquiry_plan(\n''',
              '''    validated_previous_checkpoint: dict[str, Any] | None = None\n    previous_validated_artifact_sha: str | None = None\n    if previous_validated_planning_context is not None:\n        validated_previous_checkpoint, previous_validated_artifact_sha = (\n            _reconstruct_predecessor_context(previous_validated_planning_context)\n        )\n        if previous_checkpoint is not None and dict(previous_checkpoint) != validated_previous_checkpoint:\n            raise ValidatedRecursivePlanningError(\n                "raw previous checkpoint differs from reconstructed predecessor"\n            )\n    elif previous_checkpoint is not None:\n        raise ValidatedRecursivePlanningError(\n            "raw predecessor checkpoint is not accepted without deterministic validated-planning reconstruction"\n        )\n\n    verification = validate_autonomous_inquiry_plan(\n''',
          )
          patch(
              p,
              '''        candidate_match=candidate_match,\n        previous_checkpoint=previous_checkpoint,\n    )\n''',
              '''        candidate_match=candidate_match,\n        previous_checkpoint=validated_previous_checkpoint,\n    )\n''',
          )
          patch(
              p,
              '''        "recursive_checkpoint": checkpoint,\n        "autonomy_boundary": {\n''',
              '''        "recursive_checkpoint": checkpoint,\n        "predecessor_validation": (\n            None\n            if validated_previous_checkpoint is None\n            else {\n                "validated_planning_artifact_sha256": previous_validated_artifact_sha,\n                "recursive_checkpoint_sha256": validated_previous_checkpoint["checkpoint_sha256"],\n                "deterministically_reconstructed": True,\n            }\n        ),\n        "autonomy_boundary": {\n''',
          )
          # second function signature occurrence
          text = p.read_text(encoding='utf-8')
          marker = '''def validate_validated_recursive_planning_checkpoint(\n'''
          idx = text.index(marker)
