              '''            "hypothesis_portfolio_sha256": _embedded_sha(\n                portfolio,\n                field="hypothesis_portfolio",\n                sha_field="portfolio_sha256",\n            ),\n''',
              '''            "hypothesis_portfolio_sha256": (\n                None\n                if portfolio is None\n                else _embedded_sha(\n                    portfolio,\n                    field="hypothesis_portfolio",\n                    sha_field="portfolio_sha256",\n                )\n            ),\n''',
          )

          # Internal regression fixtures use the same record contract as the production builder.
