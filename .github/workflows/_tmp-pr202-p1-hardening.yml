                  )
              test_path.write_text(text, encoding='utf-8')

          # Focused hardening tests independent of large file-backed integration fixtures.
          hardening_test = '''from __future__ import annotations\n\nimport copy\n\nfrom materials_data_analyzer.research_loop.recursive_research_cycle_evidence import (\n    _authoritative_portfolio,\n)\nfrom materials_data_analyzer.research_loop.recursive_scientific_state import (\n    target_scientific_state_fingerprint,\n)\n\n\ndef _evaluated(graph_id: str, *, diagnostic_edge: str, verified_sha: str | None = None) -> dict:\n    nodes = [\n        {\n            "node_id": "c-1",\n            "node_type": "claim",\n            "statement": "bounded claim",\n        },\n        {\n            "node_id": "a-1",\n            "node_type": "analysis",\n            "statement": "bounded analysis",\n            "execution_status": "completed",\n            "artifact_bindings": [\n                {"role": "primary", "path": "/tmp/result", "sha256": "a" * 64, "bytes": 1}\n            ],\n        },\n    ]\n    edges = [\n        {\n            "edge_id": diagnostic_edge,\n            "source_node_id": "a-1",\n            "target_node_id": "c-1",\n            "relation": "supports",\n            "assessment_level": "diagnostic",\n            "rationale": "diagnostic only",\n            "active": True,\n        }\n    ]\n    status = "inconclusive"\n    if verified_sha is not None:\n        edges.append(\n            {\n                "edge_id": "verified-1",\n                "source_node_id": "a-1",\n                "target_node_id": "c-1",\n                "relation": "supports",\n                "assessment_level": "domain_verified",\n                "rationale": "verified",\n                "active": True,\n                "verification_artifact": {\n                    "role": "domain",\n                    "path": "/tmp/verifier",\n                    "sha256": verified_sha,\n                    "bytes": 1,\n                },\n            }\n        )\n        status = "provisionally_supported"\n    return {\n        "schema_version": "1.0",\n        "graph_policy_version": "1.0",\n        "graph_id": graph_id,\n        "research_scope": "bounded",\n        "nodes": nodes,\n        "edges": edges,\n        "assessments": [\n            {\n                "node_id": "c-1",\n                "node_type": "claim",\n                "status": status,\n                "verified_support_edges": ["verified-1"] if verified_sha else [],\n                "verified_contradiction_edges": [],\n                "verified_falsification_edges": [],\n                "diagnostic_relation_edges": [diagnostic_edge],\n                "final_positive_support_granted": False,\n                "domain_closeout_required_for_positive_conclusion": bool(verified_sha),\n                "confidence_score": None,\n            }\n        ],\n        "conflict_count": 0,\n        "falsified_count": 0,\n        "autonomy_boundary": {},\n    }\n\n\ndef test_target_scientific_fingerprint_ignores_graph_and_diagnostic_bookkeeping() -> None:\n    first = _evaluated("g-1", diagnostic_edge="diag-1")\n    second = _evaluated("g-2", diagnostic_edge="diag-2")\n    assert target_scientific_state_fingerprint(first, target_node_id="c-1")[\n        "fingerprint_sha256"\n    ] == target_scientific_state_fingerprint(second, target_node_id="c-1")[\n        "fingerprint_sha256"\n    ]\n\n\ndef test_target_scientific_fingerprint_changes_on_domain_verified_evidence() -> None:\n    first = _evaluated("g-1", diagnostic_edge="diag-1")\n    second = _evaluated("g-2", diagnostic_edge="diag-2", verified_sha="b" * 64)\n    assert target_scientific_state_fingerprint(first, target_node_id="c-1")[\n        "fingerprint_sha256"\n    ] != target_scientific_state_fingerprint(second, target_node_id="c-1")[\n        "fingerprint_sha256"\n    ]\n\n\ndef test_claim_target_does_not_require_unrelated_hypothesis_portfolio() -> None:\n    graph = _evaluated("g-1", diagnostic_edge="diag-1")\n    portfolio, digest, state = _authoritative_portfolio(\n        evaluated_graph=graph,\n        fresh_plan={},\n        target={\n            "graph_id": "g-1",\n            "node_id": "c-1",\n            "node_type": "claim",\n            "statement": "bounded claim",\n        },\n        assessment=graph["assessments"][0],\n    )\n    assert portfolio is None\n    assert digest is None\n    assert state is None\n'''
          (root / 'tests/test_recursive_cycle_final_p1_hardening.py').write_text(hardening_test, encoding='utf-8')

          # Remove this one-shot mutation workflow from the resulting branch state.
          workflow = root / '.github/workflows/_tmp-pr202-p1-hardening.yml'
          workflow.unlink()
          PY
