              '''    if (\n        value.get("authorization_status")\n        != "preexecution_authorization_deterministically_reconstructed"\n    ):\n        raise RecursiveResearchEvidenceError(\n            "execution record does not contain reconstructed pre-execution authorization"\n        )\n''',
