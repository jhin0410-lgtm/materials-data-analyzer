[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-data-analyzer"
dynamic = ["version"]
description = "Auditable tabular engineering-data analysis and scientific trust-boundary workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  {name = "jhin0410-lgtm"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10,<2",
  "pymatgen>=2024.5,<2027",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
]
connectors = [
  "requests>=2.31,<3",
  "kaggle>=1.6,<2",
]
materials = [
  "mp-api>=0.41,<1",
]
units = [
  "pint>=0.24,<1",
]
all = [
  "requests>=2.31,<3",
  "kaggle>=1.6,<2",
  "mp-api>=0.41,<1",
  "pint>=0.24,<1",
]

[project.scripts]
mda = "materials_data_analyzer.cli:main"
mda-battery-intelligence = "materials_data_analyzer.battery_cli:main"
mda-battery-result-audit = "materials_data_analyzer.battery_audit_cli:main"
mda-battery-target-sensitivity = "materials_data_analyzer.battery_target_sensitivity_cli:main"
mda-nasa-battery-import = "materials_data_analyzer.nasa_battery_cli:main"
mda-characterization-import = "materials_data_analyzer.characterization_import_cli:main"
mda-public-acquisition = "materials_data_analyzer.public_acquisition_cli:main"
mda-autonomous-evidence-loop = "materials_data_analyzer.autonomous_evidence_loop_cli:main"
mda-research-loop = "materials_data_analyzer.research_loop_cli:main"
mda-research-program = "materials_data_analyzer.research_program_cli:main"
mda-research-multicycle = "materials_data_analyzer.research_multicycle_cli:main"
mda-research-epistemic-multicycle = "materials_data_analyzer.research_epistemic_multicycle_cli:main"
mda-research-episode = "materials_data_analyzer.research_episode_cli:main"
mda-scientific-review = "materials_data_analyzer.scientific_review_cli:main"

[project.urls]
Repository = "https://github.com/jhin0410-lgtm/materials-data-analyzer"
Issues = "https://github.com/jhin0410-lgtm/materials-data-analyzer/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "config",
  "data_io",
  "dataset_registry",
  "domain_constraints",
  "io_utils",
  "preprocessing",
  "process_data",
  "reports",
  "results",
  "schema_mapping",
  "visualization",
  "dataset_contract",
]

[tool.setuptools.dynamic]
version = {attr = "platform_core.version.PLATFORM_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "analyzers*",
  "connectors*",
  "features*",
  "loaders*",
  "materials_data_analyzer*",
  "platform_core*",
]
