[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-data-analyzer"
dynamic = ["version"]
description = "Auditable tabular engineering-data analysis and scientific trust-boundary workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "jhin0410-lgtm"},
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "pymatgen>=2024.5,<2027",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
mda = "materials_data_analyzer.cli:main"

[project.urls]
Repository = "https://github.com/jhin0410-lgtm/materials-data-analyzer"
Issues = "https://github.com/jhin0410-lgtm/materials-data-analyzer/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "config",
  "data_io",
  "dataset_registry",
  "domain_constraints",
  "io_utils",
  "preprocessing",
  "process_data",
  "reports",
  "results",
  "schema_mapping",
  "visualization",
]

[tool.setuptools.dynamic]
version = {attr = "platform_core.version.PLATFORM_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "analyzers*",
  "connectors*",
  "features*",
  "loaders*",
  "materials_data_analyzer*",
  "platform_core*",
]
